<style>
  :root{--bg:#EEF1F6;--ink:#1B2436;--soft:#6B7688;--line:#E3E8F0;--v1:#4C6EF5;--pan:#fff;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);font-family:'Pretendard',sans-serif;color:var(--ink);}
  .bar{background:var(--pan);border-bottom:1px solid var(--line);padding:10px 16px;position:sticky;top:0;z-index:10;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .bar .logo{font-size:14px;font-weight:800;margin-right:14px;letter-spacing:-.3px;}
  .bar .logo b{color:var(--v1);}
  .tab{background:var(--bg);border:none;color:var(--soft);font-family:inherit;font-weight:700;font-size:13px;padding:9px 18px;border-radius:30px;cursor:pointer;}
  .tab.on{background:var(--v1);color:#fff;}
  .tab.soon{opacity:.55;}
  .tab .badge{font-size:10px;background:rgba(107,118,136,.2);color:var(--soft);padding:1px 6px;border-radius:8px;margin-left:5px;}
  .stage{position:relative;}
  iframe{width:100%;border:0;display:block;background:var(--bg);}
  /* [2026-09] 로그인 게이트 */
  #sgate{position:fixed;inset:0;z-index:99999;background:linear-gradient(160deg,#0F1626,#1E2C48);display:flex;align-items:center;justify-content:center;padding:24px;}
  #sgate.hidden{display:none;}
  .sg-card{background:#fff;border-radius:22px;padding:38px 32px;max-width:380px;width:100%;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.4);}
  .sg-logo{font-size:34px;margin-bottom:6px;}
  .sg-ttl{font-size:20px;font-weight:900;color:#1B2436;letter-spacing:-.5px;}
  .sg-sub{font-size:13px;color:#8A97AC;font-weight:600;margin-top:8px;line-height:1.5;}
  .sg-btn{margin-top:24px;width:100%;height:48px;border:1px solid #DCE3EE;border-radius:12px;background:#fff;font-size:14px;font-weight:800;font-family:inherit;color:#3A4356;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;}
  .sg-btn:hover{background:#F7F9FC;box-shadow:0 3px 12px rgba(27,36,54,.1);}
  .sg-btn svg{width:19px;height:19px;}
  .sg-msg{margin-top:16px;font-size:12.5px;font-weight:700;min-height:18px;}
  #sgate .sg-msg.err{color:#E23A22;} #sgate .sg-msg.wait{color:#8A97AC;}
  /* [2026-09] 애플st 인사 — 크게, 페이드인 */
  #sgate .sg-msg.ok{color:#1B2436;font-size:19px;font-weight:800;letter-spacing:-.4px;margin-top:18px;opacity:0;animation:sgHello .5s ease forwards;}
  #sgate .sg-msg.ok b{color:#1B2436;font-weight:900;}
  @keyframes sgHello{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  #sgate.bye{transition:opacity .5s ease;opacity:0;}
  .sg-foot{margin-top:20px;font-size:11px;color:#B6C2DC;font-weight:600;}
  /* [2026-09] 우측 상단 로그인 상태 칩 */

  .user-chip.on{display:inline-flex;}
  .uc-av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#4C6EF5,#7048E8);color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;}

  .uc-nm .rk{font-size:10.5px;font-weight:600;color:#8A97AC;margin-left:3px;}
  .uc-out{width:26px;height:26px;border-radius:50%;border:none;background:transparent;color:#8A97AC;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .uc-out:hover{background:#E7ECF3;color:#E23A22;}

    var nm=SG_NAME[(u.email||'').toLowerCase()]||(u.displayName||'');

    // 우측 상단 로그인 상태 칩 채우기

window.sgateLogout=function(){ try{_sgAuth.signOut();}catch(e){} };
window.sgateLogin=function(){
  var msg=document.getElementById('sgateMsg');
  if(msg){ msg.className='sg-msg wait'; msg.textContent='로그인 창을 여는 중...'; }
  var p=new firebase.auth.GoogleAuthProvider();
  _sgAuth.signInWithPopup(p).catch(function(e){
    if(msg){ msg.className='sg-msg err'; msg.textContent='로그인 실패: '+(e.message||e.code); }
  });
};
  var FRAMES={total:{src:'total.html?v=gate1',h:900},hire:{src:'hire.html?v=gate1',h:900},hr:{src:'hr.html?v=gate1',h:780},web:{src:'dashboard.html?v=gate1',h:1700}};
  var frame=document.getElementById('frame');
  var _cardOverlay=false;   // 카드 모달 오버레이 중 높이 자동조정 중단
  var _cardScrollY=0;      // 오버레이 전환 시 iframe이 flow에서 빠져 부모 스크롤이 0으로 클램프됨 → 원복용
  function fitHeight(){
    if(_cardOverlay) return;   // 오버레이 중에는 height 100vh 유지
    try{
      var doc=frame.contentWindow.document;
      var h=Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight);
      if(h>0){ var target=(h+20)+'px'; if(frame.style.height!==target){ frame.style.height=target; notifyParent(h+90); } }
    }catch(e){}
  }
  // 자식(hr 등)이 CSV 렌더를 늦게 끝내도 iframe이 그만큼 자동으로 커지게 — 중첩 스크롤 방지
  var _ro=null;
  function watchFrame(){
    try{
      if(_ro){ _ro.disconnect(); _ro=null; }
      var doc=frame.contentWindow.document;
      if(window.ResizeObserver && doc && doc.body){
        _ro=new ResizeObserver(function(){ fitHeight(); });
        _ro.observe(doc.body);
      }
    }catch(e){}
  }
  function notifyParent(h){
    // 노션 등 부모 프레임에 높이 전달 (iframe-resizer 호환 + 일반 postMessage)
    try{ window.parent.postMessage({type:'resize-iframe',height:h},'*'); }catch(e){}
    try{ window.parent.postMessage('setHeight:'+h,'*'); }catch(e){}
  }
  frame.addEventListener('load', function(){ fitHeight(); setTimeout(fitHeight,300); setTimeout(fitHeight,800); setTimeout(fitHeight,1600); watchFrame(); });

  window.addEventListener('message',function(e){
    if(e.data&&(e.data.t==='dashH'||e.data.t==='frameH')&&e.data.h>0){
      if(!_cardOverlay) frame.style.height=(e.data.h+10)+'px';
    }
    // 개인카드 모달: iframe을 화면 고정 오버레이로 전환 (모달이 진짜 뷰포트 기준이 되도록)
    if(e.data && e.data.t==='cardOpen'){
      if(frame && !_cardOverlay){
        _cardOverlay=true;
        _cardScrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
        frame.dataset.prevStyle = frame.getAttribute('style')||'';
        frame.style.position='fixed';
        frame.style.top='0'; frame.style.left='0';
        frame.style.width='100%'; frame.style.height='100vh';
        frame.style.zIndex='9999';
        document.body.style.overflow='hidden';
      }
    }
    if(e.data && e.data.t==='cardClose'){
      if(frame && _cardOverlay){
        _cardOverlay=false;
        frame.setAttribute('style', frame.dataset.prevStyle||'');
        document.body.style.overflow='';
        fitHeight();   // iframe 높이를 먼저 되돌려야 scrollTo가 클램프되지 않는다
        if(_cardScrollY){
          window.scrollTo(0,_cardScrollY);
          var _n=0, _t=setInterval(function(){
            var cur=window.pageYOffset||document.documentElement.scrollTop||0;
            if(cur>=_cardScrollY-2 || ++_n>10){ clearInterval(_t); return; }
            fitHeight(); window.scrollTo(0,_cardScrollY);
          },40);
        }
      }
    }
  });
  function go(btn){
    // [2026-09] 게이트가 아직 떠있으면(미통과) 무시. 통과했으면 정상 동작.
    var g=document.getElementById('sgate');
    if(g && !g.classList.contains('hidden')) return;
    document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on');});
    btn.classList.add('on');
    var t=btn.dataset.t;
    if(_ro){ try{_ro.disconnect();}catch(e){} _ro=null; }
    var fr=document.getElementById('frame');
    if(fr && FRAMES[t]){ fr.style.height=FRAMES[t].h+'px'; fr.src=FRAMES[t].src; }
    document.title=btn.textContent.trim()+' · 아라온 그로스';  // 탭별 제목
  }
  window.addEventListener('load', function(){ setTimeout(fitHeight,500); });
</script>
