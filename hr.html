<script>

var __now=new Date();
var __curYm=__now.getFullYear()+'-'+('0'+(__now.getMonth()+1)).slice(-2);
var __curMoLabel=(__now.getMonth()+1)+'월';
var __curYmLabel=__now.getFullYear()+'년 '+(__now.getMonth()+1)+'월';
const CSV = {
  상담: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsnuROsI7L8HP80yoRQCuaAkcoPnVcK9TY1U2Z-B8AVHmz_Y7rO4_aUBLsgu91bJGj63xJFmNrnPaJ/pub?gid=120536013&single=true&output=csv',
  사업: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTOyHCwLPcRpL2wumHbbZCSuzSZJJw7zaGeARW2I9JjWbX-lA0Uf6mVO5n4JHIKfaAzeSrOFEvjvdKi/pub?gid=1502260628&single=true&output=csv',
  수업: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vShRV1Qb_pqFgbkFJM1SCG5462zc_HgNTqG7-kxvoIvxd1yzx_pkIkP2IjjiVncH2arU5Ro2jgoH2AW/pub?gid=381025116&single=true&output=csv',
  코칭: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vShRV1Qb_pqFgbkFJM1SCG5462zc_HgNTqG7-kxvoIvxd1yzx_pkIkP2IjjiVncH2arU5Ro2jgoH2AW/pub?gid=956415153&single=true&output=csv'
};

// CSV 파서 (따옴표 안 콤마/줄바꿈 대응)
function parseCSV(text){
  var rows=[], row=[], cur='', q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c==='\r'){}
      else cur+=c;
    }
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function idx(header, names){ // 헤더에서 컬럼 위치 찾기 (여러 후보명)
  for(var n=0;n<names.length;n++){
    for(var i=0;i<header.length;i++){
      if((header[i]||'').replace(/\s/g,'')===names[n].replace(/\s/g,'')) return i;
    }
  }
  return -1;
}
function ym(v){ // 입사일 → YYYY-MM
  var s=String(v||'').trim();
  var m=s.match(/(\d{4})[-.\/]\s*(\d{1,2})/);
  if(m) return m[1]+'-'+('0'+m[2]).slice(-2);
  return s.slice(0,7);
}

// 시트별 파싱 규칙
// 원장(팀 헤더에 표시, 멤버 명단 제외)
// 상담부 팀구분 → 지점(대분류) 묶기
function _h2branch(h){
  h=String(h||'').trim();
  if(h==='부평1팀'||h==='부평2팀'||h==='부평운영팀') return '부평지점';
  // 메이킷위드 = 메이킷위드1과·2과·운영팀(+팀표기)만
  if(h==='메이킷위드1과'||h==='메이킷위드2과'||h==='메이킷위드운영팀'||h==='메이킷위드1팀'||h==='메이킷위드2팀') return '메이킷위드';
  // 가산연합센터 = 가산연합(메이킷위드팀·인투팀) — 독립 지점 (total과 통일)
  if(h==='가산연합메이킷위드팀'||h==='가산연합인투팀') return '가산연합센터';
  // 파인더루원 = 파인더루원만
  if(h==='파인더루원') return '파인더루원';
  // 마포연합센터 = 마포연합(센터·인투팀·파인더팀) — 독립 지점 (total과 통일)
  if(h==='마포연합센터'||h==='마포연합인투팀'||h==='마포연합파인더팀') return '마포연합센터';
  if(h==='스카이에듀1팀'||h==='스카이에듀2팀'||h==='스카이에듀3팀') return '스카이에듀';
  return h; // 마곡지점/수원지점 등 그대로
}
// 세부팀명 정규화 (안현규 등 잔류 "팀" 표기 → "과"로 통일)
var SUB_REMAP = { '메이킷위드1팀':'메이킷위드1과', '메이킷위드2팀':'메이킷위드2과' };
// 강제 제외 (행정상 시트엔 재직이나 실제 퇴사)
var FORCE_EXCLUDE = ['박종현'];

var WONJANG = {
  '코칭': { 'A':'정나영', 'B':'장영주' }
};
// 상담부 지사장/지점장 (코칭 원장처럼 지점 헤더에 강조 — 명단엔 남김)
var BRANCH_LEAD = {
  '메이킷위드':'지사장 장윤호',
  '파인더루원':'지사장 김윤호',
  '부평지점':'지점장 우혜림',
  '마곡지점':'김슬기 (휴직)',
  '수원지점':'김우진 대리',
  '가산연합센터':'장윤호·우혜림 공동운영',
  '마포연합센터':'김윤호·노영호 공동운영'
};
// 세부팀 담당 (지사장 아래)
var SUB_LEAD = {
  '가산연합메이킷위드팀':'김성윤','가산연합인투팀':'김성윤',
  '마포연합센터':'김원득·노영호','마포연합인투팀':'김원득·노영호','마포연합파인더팀':'김원득·노영호'
};
// 팀 라벨 (A → 코칭A)
var TEAMLABEL = {
  '코칭': function(t){ return t==='미구분'?'운영지원':'코칭'+t; }
};

var SHEETS = [
  { key:'수업', label:'수업 강사', url:CSV.수업, group:'과목', retireBy:'퇴사일', note:'특이사항' },
  { key:'코칭', label:'코칭 코치', url:CSV.코칭, group:'팀',   retireBy:'퇴사일', note:'특이사항' },
  { key:'사업부', label:'사업부',   url:CSV.사업, group:'부서명', retireBy:'재직', note:'공개특이사항' },
  { key:'상담부', label:'상담부',   url:CSV.상담, group:'부서명', retireBy:'재직', note:'특이사항' }
];

async function loadSheet(cfg){
  try{
    var res=await fetch(cfg.url); var text=await res.text();
    var rows=parseCSV(text).filter(function(r){return r.some(function(c){return (c||'').trim();});});
    // 헤더행 찾기 ('이름' 포함된 행)
    var hi=0; for(var i=0;i<Math.min(rows.length,5);i++){ if(rows[i].some(function(c){return (c||'').indexOf('이름')>=0;})){hi=i;break;} }
    var H=rows[hi];
    var cName=idx(H,['이름']), cIn=idx(H,['입사일','입사']), cOut=idx(H,['퇴사일','퇴사']),
        cRank=idx(H,['직급']), cGroup=idx(H,[cfg.group]), cJae=idx(H,['재직']),
        cNote=cfg.note?idx(H,[cfg.note]):-1;
    var members=[], ipsa=0, toesa=0;
    var _30ago = new Date(); _30ago.setDate(_30ago.getDate()-30); _30ago.setHours(0,0,0,0);
    for(var r=hi+1;r<rows.length;r++){
      var row=rows[r]; var name=(row[cName]||'').trim();
      if(!name) continue;
      var outv=(cOut>=0?row[cOut]:'').trim();
      var jaev=(cJae>=0?row[cJae]:'').trim();
      // 재직 판별
      var isJae = cfg.retireBy==='재직' ? (jaev==='재직') : (!outv);
      var inYm = ym(cIn>=0?row[cIn]:'');
      var outYm = outv ? ym(outv) : '';
      // 입사일 원본(YYYY-MM-DD)을 Date로 파싱 — NEW 뱃지 30일 판정용
      var _inDate = (function(){
        var s=String(cIn>=0?row[cIn]:'').trim();
        var m=s.match(/(\d{4})[-.\/]\s*(\d{1,2})[-.\/]\s*(\d{1,2})/);
        return m ? new Date(+m[1],+m[2]-1,+m[3]) : null;
      })();
      var isNew = !!(_inDate && _inDate >= _30ago);   // NEW 뱃지: 입사 30일 이내
      var isNewMonth = (inYm===__curYm);            // [현재월 자동] 이번달 입사 카운트
      var isOutThisMonth = (outYm===__curYm);       // [현재월 자동] 이번달 퇴사
      // [2026-09] 퇴사일 원본 Date + 근속일수 (경영진용 퇴사자 상세)
      var _outDate = (function(){
        var m=String(outv).match(/(\d{4})[-.\/]\s*(\d{1,2})[-.\/]\s*(\d{1,2})/);
        return m ? new Date(+m[1],+m[2]-1,+m[3]) : null;
      })();
      var _span = (_inDate && _outDate) ? Math.floor((_outDate-_inDate)/86400000) : null;
      // 8월 입퇴사 카운트
      if(isNewMonth) ipsa++;
      if(isOutThisMonth) toesa++;
      // 재직자 OR 이번달 퇴사자만 명단에 (옛날 퇴사자는 제외)
      if(!isJae && !isOutThisMonth) continue;
      var sub=(cGroup>=0?row[cGroup]:'').trim() || '미구분';
      members.push({
        name:name,
        sub:sub,
        rank:(cRank>=0?(row[cRank]||'').trim():''),
        in:inYm,
        note:(cNote>=0?(row[cNote]||'').trim():''),
        isNew:isNew,
        isOut:isOutThisMonth,
        outYm:outYm,
        inDate:_inDate, outDate:_outDate, span:_span
      });
    }
    var jaeCount=members.filter(function(m){return !m.isOut;}).length;
    return { key:cfg.key, label:cfg.label, jae:jaeCount, ipsa:ipsa, toesa:toesa, members:members };
  }catch(e){
    console.error('시트 로드 실패 '+cfg.key, e);
    return { key:cfg.key, label:cfg.label, jae:0, ipsa:0, toesa:0, members:[], error:true };
  }
}

var STATE={};
async function boot(){
  var results=await Promise.all(SHEETS.map(loadSheet));
  results.forEach(function(r){ STATE[r.key]=r; });

  var total=results.reduce(function(a,r){return a+r.jae;},0);
  var ti=results.reduce(function(a,r){return a+r.ipsa;},0);

  // [현재월 자동] 부제·라벨 갱신

  var _ol=document.getElementById('h_out_lbl'); if(_ol)_ol.textContent=__curMoLabel;
  document.getElementById('h_in').textContent=ti+'명';
  document.getElementById('h_out').textContent=to+'명';

  var ch='';results.forEach(function(g,i){ch+='<div class="mc g'+i+'"><div class="l"><span class="dot"></span>'+g.label+'</div><div class="v">'+g.jae+'<small> 명</small></div><div class="io"><span class="in">+'+g.ipsa+'</span><span class="out">-'+g.toesa+'</span></div></div>';});
  document.getElementById('cards').innerHTML=ch;

  var tb='';results.forEach(function(g,i){tb+='<button class="tabbtn'+(i===0?' on':'')+'" onclick="sw(\''+g.key+'\',this)">'+g.label+'</button>';});
  document.getElementById('tabs').innerHTML=tb;

  render(results[0].key);

  // [2026-09] 퇴사자(상담·사업) 재직중 매출 로드 → 이름 맵 → 재렌더
  var outNames=[];
  ['상담부','사업부'].forEach(function(dk){
    var st=STATE[dk]; if(!st)return;
    st.members.forEach(function(m){ if(m.isOut) outNames.push({name:m.name, inDate:m.inDate, outDate:m.outDate, useF:(dk==='사업부')}); });
  });
  if(outNames.length){
    __LED_STATE='loading';
    _ledLoad().then(function(){

      __LED_STATE='ok';
      // 현재 탭이 상담/사업이면 다시 그림
      if(window.__curTab==='상담부'||window.__curTab==='사업부') render(window.__curTab);
    }).catch(function(e){ console.warn('원장 매출 로드 실패',e); __LED_STATE='err'; });
  }
}
window.__curTab='수업';

// 운영지원 역할 태그 (특이사항 → 뱃지)
// ══════════════════════════════════════════════
// [2026-09] 원장(리드요약) — 퇴사자 재직중 월별 매출 (상담/사업 탭)
// total.html fdLoadLedger 이식. 이름(r.sang) 매칭 · 결제일 기준.
// ══════════════════════════════════════════════
var _LED_SID='1lfvUHZcm58JX_dVEkj-5jGEf16W1__w90HUwSWd2IGU';
var _LED_GID='698799247', _CLO_GID='1739211827';
function _ledDate(v){
  v=String(v||'').trim(); if(!v) return null;
  var m1=v.match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if(m1) return new Date(+m1[1],+m1[2]-1,+m1[3]);
  var m2=v.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/); if(m2) return new Date(new Date().getFullYear(),+m2[1]-1,+m2[2]);
  return null;
}
function _ledNum(v){ var n=parseFloat(String(v||'').replace(/[^0-9.\-]/g,'')); return isNaN(n)?0:n; }
function _ledParse(raw){
  var rows=parseCSV(raw);
  var hi=0; for(var i=0;i<Math.min(rows.length,4);i++){ if((rows[i][1]||'').indexOf('상담')>=0 && (rows[i][17]||'').indexOf('상태')>=0){hi=i;break;} }
  var out=[];
  for(var r=hi+1;r<rows.length;r++){
    var row=rows[r]; var dt=_ledDate(row[0]); if(!dt) continue;
    var sang=(row[1]||'').trim(); if(!sang) continue;
    out.push({ dt:dt, sang:sang, saup:(row[5]||'').trim(), sales:_ledNum(row[3])*1000, state:(row[17]||'').trim() });
  }
  return out;
}
var __LED=null;
async function _ledLoad(){
  if(__LED) return __LED;
  var base="https://docs.google.com/spreadsheets/d/"+_LED_SID+"/gviz/tq?tqx=out:csv&headers=0&gid=";
  var t=Date.now();
  var res=await Promise.all([
    fetch(base+_CLO_GID+"&_="+t).then(function(r){return r.text();}),
    fetch(base+_LED_GID+"&_="+t).then(function(r){return r.text();})
  ]);
  __LED=_ledParse(res[0]).concat(_ledParse(res[1]));
  return __LED;
}
// 이름 → 재직중(입사~퇴사) 월별 order매출 {'6':340만,...} + total. useF=사업(saup 매칭)
function _ledMonthly(name, inD, outD, useF){
  var by={}, total=0;
  if(!__LED || !name) return {by:by, total:0};
  __LED.forEach(function(r){
    var who = useF ? r.saup : r.sang;
    if(who!==name) return;
    if(r.state!=='order' || r.sales<=0) return;
    if(inD && r.dt<inD) return;
    if(outD && r.dt>outD) return;
    var mo=r.dt.getMonth()+1;
    by[mo]=(by[mo]||0)+r.sales; total+=r.sales;
  });
  return {by:by, total:total};
}
var __LED_STATE='none'; // none|loading|ok|err

// [2026-09] 특이사항 안전 노출 — 화이트리스트만. 부정평가·사생활 원천 차단.
//   재직자: 진급(텍스트) / 겸직(뱃지+직업) / 재입사(뱃지)
//   퇴사자: 안전사유만, 건강·우울 등은 "건강 사유로" 치환
function parseNoteSafe(note, isOut){
  var s=String(note||'');
  var out={ badges:[], text:'' };
  if(!s) return out;
  if(isOut){
    if(/건강|우울|질병|병으로|아파|치료|입원/.test(s)){ out.text='건강 사유로 퇴사'; return out; }
    var safe=[['취업','취업으로 퇴사'],['이직','이직으로 퇴사'],['학업','학업으로 퇴사'],['군입대','군입대로 퇴사'],['군대','군입대로 퇴사'],['급여','급여 사유로 퇴사'],['결혼','결혼으로 퇴사'],['이사','이사로 퇴사'],['개인사정','개인 사정으로 퇴사']];
    for(var i=0;i<safe.length;i++){ if(s.indexOf(safe[i][0])>=0){ out.text=safe[i][1]; return out; } }
    return out;
  }
  var mProm=s.match(/(\d{1,2}\/\d{1,2}\s*)?(정직원\s*전환|정규직\s*전환|주임\s*\d*호?\s*진급|승진)/);
  if(mProm){ out.text=mProm[0].trim(); }
  if(s.indexOf('본업')>=0){
    var job=''; var mj=s.match(/본업\s*있음\s*\(([^)]+)\)/); if(mj) job=mj[1].trim();
    out.badges.push({cls:'gj', txt:'겸직'+(job?' · '+job:'')});
  }
  if(s.indexOf('재입사')>=0) out.badges.push({cls:'re', txt:'재입사'});
  return out;
}

function roleTags(note){
  var s=String(note||''), u=s.toUpperCase(), out=[];
  if(s.indexOf('출첵')>=0) out.push('출첵');
  if(s.indexOf('개통')>=0 || u.indexOf('A/S')>=0) out.push('개통AS');
  return out;
}

function render(key){
  window.__curTab=key;
  var g=STATE[key]; var arr=g.members.slice();
  var wonMap = WONJANG[key] || {};
  var teamLabelFn = TEAMLABEL[key] || function(t){return t;};

  // 원장 + 강제제외 제거
  var wonNames = {};
  Object.keys(wonMap).forEach(function(t){ wonNames[wonMap[t]]=true; });
  arr = arr.filter(function(x){ return !wonNames[x.name] && FORCE_EXCLUDE.indexOf(x.name)<0; });

  document.getElementById('cnt').textContent=g.label+' 재직 '+arr.length+'명 (마스킹 명부)';

  function _md(d){ return d?((d.getMonth()+1)+'/'+d.getDate()):''; }
  function _man(n){ n=n||0; if(n>=100000000)return (n/100000000).toFixed(n%100000000===0?0:2)+'억'; if(n>=10000)return Math.round(n/10000)+'만'; return (n||0).toLocaleString('ko-KR'); }
  // 근속 뱃지 색: 30일내 주황 / 90일내 빨강 / 그이상 회색
  function spanBadge(sp){
    if(sp==null) return '';
    var c = sp<=30 ? 'sp-o' : sp<=90 ? 'sp-r' : 'sp-g';
    return '<span class="bg-span '+c+'">'+sp+'일 만에</span>';
  }
  var _hasSales=(key==='상담부'||key==='사업부');  // 매출 붙일 탭
  var _useF=(key==='사업부');
  function memRow(x){
    var note=parseNoteSafe(x.note, x.isOut);  // 안전 파싱 (원문 노출 안 함)
    var safeBadges=note.badges.map(function(b){ return '<span class="bg-nt '+b.cls+'">'+b.txt+'</span>'; }).join('');
    var rankHtml = x.rank ? '<span class="mrank">'+x.rank+'</span>' : '';
    var badge = '';
    if(x.isOut) badge = '<span class="bg-out">퇴사</span>';
    else if(x.isNew) badge = '<span class="bg-new">NEW</span>';
    var roleHtml = (key==='코칭' && (x.sub||'')==='미구분' && !x.isOut)
      ? roleTags(x.note).map(function(t){ return '<span class="bg-role'+(t==='개통AS'?' pp':'')+'">'+t+'</span>'; }).join('') : '';
    // 재직자
    if(!x.isOut){
      var _ind = x.inDate ? (x.inDate.getFullYear()+'-'+('0'+(x.inDate.getMonth()+1)).slice(-2)+'-'+('0'+x.inDate.getDate()).slice(-2)) : x.in;
      var promHtml = note.text ? '<span class="bg-prom">'+note.text+'</span>' : '';
      return '<div class="mrow"><span class="mnm">'+x.name+roleHtml+badge+safeBadges+promHtml+'</span>'+rankHtml+'<span class="mdt">'+_ind+'</span></div>';
    }
    // 퇴사자 = 확장 (근속·입퇴사일·사유·매출)
    var reasonHtml = note.text ? ' <span class="oreason">'+note.text+'</span>' : '';
    var top='<div class="orow-top"><span class="mnm">'+x.name+badge+spanBadge(x.span)+safeBadges+'</span>'
      +rankHtml+'<span class="mdt">'+(x.inDate&&x.outDate?(_md(x.inDate)+'입사 → '+_md(x.outDate)+'퇴사'):(x.outYm+' 퇴사'))+reasonHtml+'</span></div>';
    var salesLine='';
    if(_hasSales){
      var m=(window.__LED_MONTHLY&&window.__LED_MONTHLY[x.name])||null;
      if(__LED_STATE==='loading') salesLine='<div class="orow-sales muted">재직 중 매출 불러오는 중…</div>';
      else if(m){
        var months=Object.keys(m.by).sort(function(a,b){return a-b;});
        var moStr=months.map(function(mm){return mm+'월 '+_man(m.by[mm]);}).join(' · ');
        var has=(m.total>0);
        salesLine='<div class="orow-sales">재직 중 매출 <b class="'+(has?'has':'zero')+'">'+(has?_man(m.total):'0')+(has?'':'원')+'</b>'
          +(moStr?' <span class="momini">· '+moStr+'</span>':'')+'</div>';
      }
    }
    return '<div class="mrow out orow">'+top+salesLine+'</div>';
  }

  var h='<div class="grid">';

  if(key==='상담부'){
    // 2단계: 지점(대분류) > 세부팀
    var branchMap={}, bOrder=[];
    arr.forEach(function(x){
      var sub=SUB_REMAP[(x.sub||'').trim()]||x.sub||'미구분';
      var br=_h2branch(sub);
      if(!branchMap[br]){branchMap[br]={};}
      if(!branchMap[br][sub]){branchMap[br][sub]=[];}
      branchMap[br][sub].push(x);
      if(bOrder.indexOf(br)<0)bOrder.push(br);
    });
    bOrder.sort(function(a,b){if(a==='미구분')return 1;if(b==='미구분')return -1;return a<b?-1:1;});
    bOrder.forEach(function(br){
      var teams=branchMap[br];
      var teamKeys=Object.keys(teams).sort();
      var total=0; teamKeys.forEach(function(t){total+=teams[t].filter(function(m){return !m.isOut;}).length;});
      var leadHtml=BRANCH_LEAD[br]?'<span class="c-won">'+BRANCH_LEAD[br]+'</span>':'';
      h+='<div class="gcard"><div class="ghd"><span class="gnm">'+br+'</span>'+leadHtml+'<span class="gcnt">'+total+'</span></div><div class="gbody">';
      teamKeys.forEach(function(t){
        // 세부팀 소제목 (지점명과 다를 때만 표시)
        var subLeadHtml=SUB_LEAD[t]?' <span class="sublead">'+SUB_LEAD[t]+'</span>':'';
        if(t!==br){ h+='<div class="subteam">'+t+' <span class="subcnt">'+teams[t].filter(function(m){return !m.isOut;}).length+'</span>'+subLeadHtml+'</div>'; }
        teams[t].sort(function(a,b){if(a.isOut!==b.isOut)return a.isOut?1:-1;return (a.in||'')<(b.in||'')?-1:1;});
        teams[t].forEach(function(x){ h+=memRow(x); });
      });
      // 퇴사 요약 (이번달 퇴사 있을 때만) — 지점 전체 취합
      var _brOut=[]; teamKeys.forEach(function(t){ teams[t].forEach(function(m){ if(m.isOut) _brOut.push(m); }); });
      if(_brOut.length){
        var _early30=_brOut.filter(function(m){return m.span!=null && m.span<=30;}).length;
        h+='<div class="br-outsum">이번달 퇴사 <b class="c-r">'+_brOut.length+'명</b>'
          +(_early30?' · 30일내 이탈 <b class="c-r">'+_early30+'명</b>':'')+'</div>';
      }
      h+='</div></div>';
    });
  } else {
    // 기존 1단계
    var groups={}, order=[];
    arr.forEach(function(x){ var k=x.sub||'미구분'; if(!groups[k]){groups[k]=[];order.push(k);} groups[k].push(x); });
    order.sort(function(a,b){ if(a==='미구분')return 1; if(b==='미구분')return -1; return a<b?-1:1; });
    order.forEach(function(sub){
      var mem=groups[sub];
      mem.sort(function(a,b){ if(a.isOut!==b.isOut)return a.isOut?1:-1; return (a.in||'')<(b.in||'')?-1:1; });
      var label = teamLabelFn(sub);
      var roleDet='';
      if(key==='코칭' && sub==='미구분'){
        var _cc=0,_as=0;
        mem.forEach(function(m){ if(m.isOut)return; var _t=roleTags(m.note); if(_t.indexOf('출첵')>=0)_cc++; if(_t.indexOf('개통AS')>=0)_as++; });
        var _p=[]; if(_cc)_p.push('출첵'+_cc); if(_as)_p.push('개통AS'+_as);
        if(_p.length) roleDet='<span class="groledet">· '+_p.join('·')+'</span>';
      }
      var won = wonMap[sub];
      var wonHtml = won ? '<span class="c-won">원장 '+won+'</span>' : '';
      h+='<div class="gcard"><div class="ghd"><span class="gnm">'+label+'</span>'+roleDet+wonHtml+'<span class="gcnt">'+mem.filter(function(m){return !m.isOut;}).length+'</span></div><div class="gbody">';
      mem.forEach(function(x){ h+=memRow(x); });
      h+='</div></div>';
    });
  }
  h+='</div>';
  document.getElementById('body').innerHTML=h;
}

function sw(key,btn){window.__curTab=key;document.querySelectorAll('.tabbtn').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');render(key);}

boot();
</script></body></html>
