<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>인사기록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#F1F4F9;--ink:#1B2436;--soft:#6B7688;--line:#E3E8F0;--pan:#fff;--v1:#4C6EF5;--teal:#1D9E75;--amber:#BA7517;--red:#E23A22;--pos:#20A56D;--barbg:#EDF1F8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:24px 20px 60px}
.hd .k{font-size:12px;letter-spacing:2px;color:var(--v1);font-weight:800}
.hd h1{font-size:24px;font-weight:800;margin-top:6px}.hd .m{font-size:12px;color:var(--soft);margin-top:7px}
.mask{font-size:11px;color:var(--pos);background:#EAF7F0;border:0.5px solid #B8E6CE;border-radius:8px;padding:8px 12px;margin:12px 0}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.mc{background:var(--pan);border-radius:14px;padding:18px 20px;box-shadow:0 2px 8px rgba(27,36,54,.05)}
.mc .l{font-size:13px;color:var(--soft);font-weight:600;display:flex;align-items:center;gap:7px}
.mc .dot{width:9px;height:9px;border-radius:50%}
.mc.g0 .dot{background:var(--teal)}.mc.g1 .dot{background:var(--v1)}.mc.g2 .dot{background:var(--amber)}.mc.g3 .dot{background:#7048E8}
.mc .v{font-size:30px;font-weight:900;margin-top:8px}.mc .v small{font-size:14px;color:var(--soft)}
.mc .io{display:flex;gap:12px;margin-top:8px;font-size:12px}
.mc .io .in{color:var(--pos)}.mc .io .out{color:var(--red)}
.hero{background:var(--ink);color:#fff;border-radius:16px;padding:20px 26px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.hero .l{font-size:13px;color:#B6C2DC}.hero .v{font-size:36px;font-weight:900}
.hero .io{display:flex;gap:24px}.hero .io div{font-size:12px;color:#B6C2DC}.hero .io b{display:block;font-size:20px;margin-top:2px}
.hero .io .in b{color:#5DCAA5}.hero .io .out b{color:#F09595}
.panel{background:var(--pan);border-radius:14px;padding:20px 22px;box-shadow:0 2px 8px rgba(27,36,54,.05)}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tabbtn{background:var(--barbg);border:none;color:var(--soft);font-family:inherit;font-weight:700;font-size:13px;padding:8px 15px;border-radius:30px;cursor:pointer}
.tabbtn.on{background:var(--v1);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--soft);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid #F2F4F7}
td.nm{font-weight:700}td.dt{text-align:right;color:var(--soft);font-variant-numeric:tabular-nums}
.cnt{font-size:12px;color:var(--soft);margin-bottom:12px}
.ft{text-align:center;font-size:11px;color:var(--soft);margin-top:20px;line-height:1.8}
@media(max-width:820px){.four{grid-template-columns:repeat(2,1fr)}}

.grp td{background:#F1F4F9;padding:8px 12px !important;border-top:2px solid #E3E8F0}
.grp-nm{font-weight:800;color:#4C6EF5;font-size:13px}
.grp-cnt{float:right;color:#8A94A6;font-size:12px;font-weight:600}
</style></head><body><div class="wrap">
<div class="hd"><div class="k">HR 인사기록</div><h1>인사기록</h1>
<div class="m">2026년 8월 기준 · 재직 현황 · 입퇴사 흐름</div></div>
<div class="mask"><i class="ti ti-lock"></i> 개인정보 보호 — 주민번호·계좌·연락처·주소·생년월일·특이사항 전부 제외 · 이름·부서·직급·입사일만 표시</div>
<div class="hero"><div><div class="l">전체 재직 인원</div><div class="v" id="h_tot"></div></div>
<div class="io"><div class="in">8월 입사<b id="h_in"></b></div><div class="out">8월 퇴사<b id="h_out"></b></div></div></div>
<div class="four" id="cards"></div>
<div class="panel">
<div class="tabs" id="tabs"></div>
<div class="cnt" id="cnt"></div>
<div id="body"></div></div>
<div class="ft">소스 = 인사기록카드(수업·코칭) · 사업부 인사 · 파트타이머 · 2026년 8월 기준<br>파트타이머는 재직자만 · 신상정보 일체 제외 · 매주(또는 매월) 엑셀 갱신</div>
</div>
<script>
// ── 인사 4개 시트 CSV (월 1회 갱신, 시트가 소스) ──
const CSV = {
  상담: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsnuROsI7L8HP80yoRQCuaAkcoPnVcK9TY1U2Z-B8AVHmz_Y7rO4_aUBLsgu91bJGj63xJFmNrnPaJ/pub?gid=120536013&single=true&output=csv',
  사업: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQsnuROsI7L8HP80yoRQCuaAkcoPnVcK9TY1U2Z-B8AVHmz_Y7rO4_aUBLsgu91bJGj63xJFmNrnPaJ/pub?gid=721147912&single=true&output=csv',
  수업: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vShRV1Qb_pqFgbkFJM1SCG5462zc_HgNTqG7-kxvoIvxd1yzx_pkIkP2IjjiVncH2arU5Ro2jgoH2AW/pub?gid=381025116&single=true&output=csv',
  코칭: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vShRV1Qb_pqFgbkFJM1SCG5462zc_HgNTqG7-kxvoIvxd1yzx_pkIkP2IjjiVncH2arU5Ro2jgoH2AW/pub?gid=956415153&single=true&output=csv'
};

// CSV 파서 (따옴표 안 콤마/줄바꿈 대응)
function parseCSV(text){
  var rows=[], row=[], cur='', q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; }
      else cur+=c;
    } else {
      if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c==='\r'){}
      else cur+=c;
    }
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function idx(header, names){ // 헤더에서 컬럼 위치 찾기 (여러 후보명)
  for(var n=0;n<names.length;n++){
    for(var i=0;i<header.length;i++){
      if((header[i]||'').replace(/\s/g,'')===names[n].replace(/\s/g,'')) return i;
    }
  }
  return -1;
}
function ym(v){ // 입사일 → YYYY-MM
  var s=String(v||'').trim();
  var m=s.match(/(\d{4})[-.\/]\s*(\d{1,2})/);
  if(m) return m[1]+'-'+('0'+m[2]).slice(-2);
  return s.slice(0,7);
}

// 시트별 파싱 규칙
var SHEETS = [
  { key:'수업', label:'수업 강사', url:CSV.수업, group:'과목', retireBy:'퇴사일' },
  { key:'코칭', label:'코칭 코치', url:CSV.코칭, group:'팀',   retireBy:'퇴사일' },
  { key:'사업부', label:'사업부',   url:CSV.사업, group:'부서명', retireBy:'재직', note:'공개특이사항' },
  { key:'상담부', label:'상담부',   url:CSV.상담, group:'부서명', retireBy:'재직', note:'특이사항' }
];

async function loadSheet(cfg){
  try{
    var res=await fetch(cfg.url); var text=await res.text();
    var rows=parseCSV(text).filter(function(r){return r.some(function(c){return (c||'').trim();});});
    // 헤더행 찾기 ('이름' 포함된 행)
    var hi=0; for(var i=0;i<Math.min(rows.length,5);i++){ if(rows[i].some(function(c){return (c||'').indexOf('이름')>=0;})){hi=i;break;} }
    var H=rows[hi];
    var cName=idx(H,['이름']), cIn=idx(H,['입사일','입사']), cOut=idx(H,['퇴사일','퇴사']),
        cRank=idx(H,['직급']), cGroup=idx(H,[cfg.group]), cJae=idx(H,['재직']),
        cNote=cfg.note?idx(H,[cfg.note]):-1;
    var members=[], ipsa=0, toesa=0;
    for(var r=hi+1;r<rows.length;r++){
      var row=rows[r]; var name=(row[cName]||'').trim();
      if(!name) continue;
      var outv=(cOut>=0?row[cOut]:'').trim();
      var jaev=(cJae>=0?row[cJae]:'').trim();
      // 재직 판별
      var isJae = cfg.retireBy==='재직' ? (jaev==='재직') : (!outv);
      var inYm = ym(cIn>=0?row[cIn]:'');
      // 8월 입퇴사
      if(inYm==='2026-08') ipsa++;
      if(outv && ym(outv)==='2026-08') toesa++;
      if(!isJae) continue;
      var sub=(cGroup>=0?row[cGroup]:'').trim() || '미구분';
      members.push({
        name:name,
        sub:sub,
        rank:(cRank>=0?(row[cRank]||'').trim():''),
        in:inYm,
        note:(cNote>=0?(row[cNote]||'').trim():'')
      });
    }
    return { key:cfg.key, label:cfg.label, jae:members.length, ipsa:ipsa, toesa:toesa, members:members };
  }catch(e){
    console.error('시트 로드 실패 '+cfg.key, e);
    return { key:cfg.key, label:cfg.label, jae:0, ipsa:0, toesa:0, members:[], error:true };
  }
}

var STATE={};
async function boot(){
  var results=await Promise.all(SHEETS.map(loadSheet));
  results.forEach(function(r){ STATE[r.key]=r; });

  var total=results.reduce(function(a,r){return a+r.jae;},0);
  var ti=results.reduce(function(a,r){return a+r.ipsa;},0);
  var to=results.reduce(function(a,r){return a+r.toesa;},0);
  document.getElementById('h_tot').innerHTML=total+'<small style="font-size:16px;color:#B6C2DC"> 명</small>';
  document.getElementById('h_in').textContent=ti+'명';
  document.getElementById('h_out').textContent=to+'명';

  var ch='';results.forEach(function(g,i){ch+='<div class="mc g'+i+'"><div class="l"><span class="dot"></span>'+g.label+'</div><div class="v">'+g.jae+'<small> 명</small></div><div class="io"><span class="in">+'+g.ipsa+'</span><span class="out">-'+g.toesa+'</span></div></div>';});
  document.getElementById('cards').innerHTML=ch;

  var tb='';results.forEach(function(g,i){tb+='<button class="tabbtn'+(i===0?' on':'')+'" onclick="sw(\''+g.key+'\',this)">'+g.label+'</button>';});
  document.getElementById('tabs').innerHTML=tb;

  render(results[0].key);
}

function render(key){
  var g=STATE[key]; var arr=g.members.slice();
  document.getElementById('cnt').textContent=g.label+' 재직 '+arr.length+'명 (마스킹 명부)';
  var hasNote = arr.some(function(x){return x.note;});
  var hasRank = arr.some(function(x){return x.rank;});

  // 부서(sub)별로 묶기
  var groups={}, order=[];
  arr.forEach(function(x){ var k=x.sub||'미구분'; if(!groups[k]){groups[k]=[];order.push(k);} groups[k].push(x); });
  // 부서명 정렬 (미구분은 맨 뒤)
  order.sort(function(a,b){ if(a==='미구분')return 1; if(b==='미구분')return -1; return a<b?-1:1; });

  var cols = 2 + (hasRank?1:0) + (hasNote?1:0); // 이름+입사 + 옵션
  var h='<table>';
  order.forEach(function(sub){
    var mem=groups[sub];
    mem.sort(function(a,b){ return (a.in||'')<(b.in||'')?-1:1; }); // 부서 내 입사순
    // 부서 헤더 행
    h+='<tbody><tr class="grp"><td colspan="'+cols+'"><span class="grp-nm">'+sub+'</span><span class="grp-cnt">'+mem.length+'명</span></td></tr>';
    mem.forEach(function(x){
      h+='<tr><td class="nm">'+x.name+'</td>'+(hasRank?'<td>'+(x.rank||'')+'</td>':'')+(hasNote?'<td class="note-cell">'+(x.note||'')+'</td>':'')+'<td class="dt">'+x.in+'</td></tr>';
    });
    h+='</tbody>';
  });
  h+='</table>';
  document.getElementById('body').innerHTML=h;
}
function sw(key,btn){document.querySelectorAll('.tabbtn').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');render(key);}

boot();
</script></body></html>
