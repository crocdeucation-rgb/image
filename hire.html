<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>면접 캘린더</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#F1F4F9;--ink:#1B2436;--soft:#6B7688;--line:#E3E8F0;--pan:#fff;--v1:#4C6EF5;--v2:#7048E8;--teal:#1D9E75;--amber:#BA7517;--red:#E23A22;--barbg:#EDF1F8}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1560px;margin:0 auto;padding:20px 20px 60px}
.hd .k{font-size:12px;letter-spacing:2px;color:var(--v1);font-weight:800}
.hd h1{font-size:22px;font-weight:800;margin-top:5px}
.hd .m{font-size:12px;color:var(--soft);margin-top:6px}

/* ── 오늘의 면접 (메인) ── */
.today-hero{background:linear-gradient(125deg,#4C6EF5,#7048E8);border-radius:20px;padding:22px 24px;color:#fff;margin:14px 0}
.th-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.th-date{font-size:20px;font-weight:900}
.th-wd{font-size:14px;font-weight:700;opacity:.85}
.th-live{font-size:11px;font-weight:800;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:20px;margin-left:auto}
.th-sub{font-size:12.5px;opacity:.8;font-weight:600;margin-bottom:16px}
.th-list{display:flex;flex-direction:column;gap:8px}
.th-item{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.16);border-radius:13px;padding:12px 15px;cursor:pointer;transition:.12s}
.th-item:hover{background:rgba(255,255,255,.2)}
.th-tm{font-size:16px;font-weight:900;min-width:52px;letter-spacing:-.5px}
.th-body{flex:1;min-width:0}
.th-nm{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.th-tags{display:flex;gap:5px;margin-top:4px;flex-wrap:wrap}
.th-tag{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px;background:rgba(255,255,255,.9);color:#3B4F9E}
.th-tag.site{background:rgba(255,255,255,.25);color:#fff}
.th-status{font-size:12px;font-weight:800;padding:4px 11px;border-radius:9px;white-space:nowrap;flex-shrink:0}
.th-status.wait{background:rgba(255,255,255,.22);color:#fff}
.th-status.at{background:#E6F7EE;color:#1B7A4A}
.th-status.ns{background:#FBE0DC;color:#C0341E}
.th-status.ps{background:#F0E9FF;color:#5A3AD0}
.th-status.fa{background:rgba(255,255,255,.15);color:rgba(255,255,255,.8)}
.th-none{background:rgba(255,255,255,.12);border-radius:13px;padding:20px;text-align:center;font-size:14px;font-weight:700}
.th-none small{display:block;font-size:12px;opacity:.75;font-weight:600;margin-top:5px}

/* ── 주간 캘린더 ── */
.cal-wrap{background:var(--pan);border-radius:16px;padding:18px 20px;box-shadow:0 2px 8px rgba(27,36,54,.05)}
.cal-hd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.cal-hd h2{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;margin:0}
.cal-nav{display:inline-flex;align-items:center;gap:8px}
.cal-navbtn{background:var(--barbg);border:none;color:var(--soft);font-weight:800;font-size:14px;width:30px;height:30px;border-radius:9px;cursor:pointer}
.cal-navbtn:hover{background:var(--v1);color:#fff}
.cal-navbtn:disabled{opacity:.3;cursor:default}
.cal-range{font-size:13px;font-weight:800;min-width:120px;text-align:center}
.cal-today-btn{background:var(--barbg);border:none;color:var(--v1);font-weight:800;font-size:12px;padding:6px 13px;border-radius:20px;cursor:pointer}
.cal-today-btn:hover{background:var(--v1);color:#fff}

/* PC = 7열 그리드 */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal-col{background:#FAFBFD;border:1px solid var(--line);border-radius:12px;padding:9px 8px;min-height:110px}
.cal-col.today{background:#FFF5F3;border-color:#F3B5AA;border-width:1.5px}
.cal-col.weekend .cal-dnum{color:#B6C2DC}
.cal-dhd{text-align:center;margin-bottom:9px;padding-bottom:7px;border-bottom:1px solid #EDF1F7}
.cal-wd{font-size:10.5px;font-weight:700;color:var(--soft)}
.cal-dnum{font-size:17px;font-weight:900;margin-top:2px;letter-spacing:-.5px}
.cal-col.today .cal-wd,.cal-col.today .cal-dnum{color:#E23A22}
.cal-col.today .cal-dhd{border-color:#F3C9C0}
.cal-todaytag{display:inline-block;font-size:8.5px;font-weight:800;background:#E23A22;color:#fff;padding:1px 6px;border-radius:5px;margin-top:3px}
.cal-ivs{display:flex;flex-direction:column;gap:4px}
.cal-iv{background:#fff;border:1px solid #E7ECF4;border-left-width:3px;border-radius:7px;padding:5px 7px;cursor:pointer;transition:.1s}
.cal-iv:hover{border-color:var(--v1);box-shadow:0 2px 6px rgba(76,110,245,.12)}
.cal-iv.job-상담부{border-left-color:#4C6EF5}
.cal-iv.job-강사{border-left-color:#1D9E75}
.cal-iv.job-사업부{border-left-color:#7048E8}
.cal-iv.job-코칭{border-left-color:#BA7517}
.cal-iv-tm{font-size:10px;font-weight:800;color:var(--soft)}
.cal-iv-nm{font-size:12px;font-weight:800;color:var(--ink);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-iv-tag{font-size:9px;font-weight:700;color:#8A94A6;margin-top:2px}
.cal-iv-mgr{font-size:9px;font-weight:700;color:#7048E8;margin-top:1px}
.cal-iv.done{opacity:.62}
.cal-iv.done .cal-iv-nm{color:#8A94A6}
.cal-iv-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px;vertical-align:middle}
.cal-iv-dot.at{background:#1D9E75}.cal-iv-dot.ns{background:#E23A22}.cal-iv-dot.ps{background:#7048E8}
.cal-empty{font-size:10px;color:#C8D0DC;text-align:center;padding:8px 0}

/* 범례 */
.cal-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:11px;color:var(--soft);font-weight:600}
.cal-legend .lg{display:inline-flex;align-items:center;gap:5px}
.cal-legend .d{width:9px;height:3px;border-radius:2px}
.cal-legend .상담부{background:#4C6EF5}.cal-legend .강사{background:#1D9E75}.cal-legend .사업부{background:#7048E8}.cal-legend .코칭{background:#BA7517}

/* 모바일 = 세로 카드 */
@media(max-width:768px){
  .wrap{padding:16px 12px 40px}
  .cal-grid{grid-template-columns:1fr;gap:9px}
  .cal-col{min-height:0;padding:11px 13px}
  .cal-col.empty-mo{display:none}   /* 모바일: 면접 없는 날 숨김 */
  .cal-dhd{display:flex;align-items:center;gap:8px;text-align:left;margin-bottom:8px;padding-bottom:7px}
  .cal-wd{font-size:12px}
  .cal-dnum{font-size:15px;margin-top:0}
  .cal-dnum::after{content:'일';font-size:11px;font-weight:700;color:var(--soft);margin-left:1px}
  .cal-todaytag{margin-top:0;margin-left:auto}
  .cal-ivs{gap:6px}
  .cal-iv{padding:8px 11px;display:flex;align-items:center;gap:9px}
  .cal-iv-tm{min-width:42px}
  .cal-iv-nm{font-size:13px;margin-top:0}
  .cal-iv-tag{margin-top:0;margin-left:auto}
}

/* 상세 모달 */
.iv-modal-bg{position:fixed;inset:0;background:rgba(15,20,34,.5);backdrop-filter:blur(3px);z-index:9998;display:none;align-items:center;justify-content:center;padding:16px}
.iv-modal-bg.on{display:flex}
.iv-card{width:380px;max-width:100%;max-height:88vh;overflow-y:auto;background:#fff;border-radius:18px;box-shadow:0 20px 60px rgba(15,20,34,.4);animation:ivpop .2s cubic-bezier(.2,.9,.3,1.2)}
@keyframes ivpop{from{transform:translateY(12px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.ivm-hd{padding:20px 22px 16px;color:#fff;position:relative}
.ivm-hd.job-상담부{background:linear-gradient(135deg,#4C6EF5,#5C7CFA)}
.ivm-hd.job-강사{background:linear-gradient(135deg,#1D9E75,#20B884)}
.ivm-hd.job-사업부{background:linear-gradient(135deg,#7048E8,#8B5CF6)}
.ivm-hd.job-코칭{background:linear-gradient(135deg,#BA7517,#E09A2E)}
.ivm-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:15px;cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
.ivm-nm{font-size:22px;font-weight:900}
.ivm-when{font-size:13px;font-weight:700;opacity:.9;margin-top:4px}
.ivm-tags{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.ivm-tag{font-size:11px;font-weight:800;padding:3px 10px;border-radius:7px;background:rgba(255,255,255,.22)}
.ivm-body{padding:16px 22px 20px}
.ivm-row{display:flex;padding:9px 0;border-bottom:1px solid #F2F4F7;font-size:13px}
.ivm-row:last-child{border-bottom:none}
.ivm-lbl{width:80px;color:var(--soft);font-weight:600;flex-shrink:0}
.ivm-val{font-weight:700;color:var(--ink)}
.ivm-val.at{color:#1B7A4A}.ivm-val.ns{color:#C0341E}.ivm-val.ps{color:#5A3AD0}.ivm-val.fa{color:#C0341E}
.ivm-memo{background:#F7F9FC;border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.5;color:#3A4456;margin-top:12px}
.ivm-memo::before{content:'💬 ';opacity:.6}

.ft{text-align:center;font-size:11px;color:var(--soft);margin-top:20px;line-height:1.8}
.err{background:#FFF6F5;border:1px solid #F5D0CC;border-radius:10px;padding:14px;font-size:13px;color:#C0341E;margin:14px 0}
</style></head><body><div class="wrap">
<div class="hd"><div class="k">채용 · 면접</div><h1>면접 캘린더</h1>
<div class="m" id="upd">불러오는 중…</div></div>

<div class="cal-wrap">
  <div class="cal-hd">
    <h2 id="cal_title">🗓️ 이번주 면접</h2>
    <div class="cal-nav">
      <button class="cal-today-btn" onclick="calToday()">오늘</button>
      <button class="cal-navbtn" onclick="calMove(-1)">‹</button>
      <span class="cal-range" id="cal_range"></span>
      <button class="cal-navbtn" onclick="calMove(1)">›</button>
    </div>
  </div>
  <div id="cal_grid"></div>
  <div class="cal-legend">
    <span class="lg"><span class="d 상담부"></span>상담부</span>
    <span class="lg"><span class="d 강사"></span>강사</span>
    <span class="lg"><span class="d 사업부"></span>사업부</span>
    <span class="lg"><span class="d 코칭"></span>코칭</span>
  </div>
</div>
<div class="ft">소스 = 면접일정 시트 (실시간) · 연락처 등 개인정보 제외 · 이름·시간·직무·유입만 표시</div>
</div>

<div class="iv-modal-bg" id="ivModal" onclick="if(event.target===this)closeIv()"><div class="iv-card" id="ivBody"></div></div>

<script>
// ── 면접일정 시트 (publish CSV) ──
var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSz4NSoTmHTebOTpuiy3qbJIRe_vFbC9jf9A4QGDEMlZC4aatoIkEaMqIQspaCNI3scpFhu5TEQEyPA/pub?output=csv";

// CSV 파서 (따옴표 대응)
function parseCSV(text){
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else { if(c==='"')q=true; else if(c===','){row.push(cur);cur='';} else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';} else if(c==='\r'){} else cur+=c; }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}

// "8/26(수)" or "2026-08-26" → Date (올해 기준)
function parseDate(s){
  s=String(s||'').trim();
  var m=s.match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3]);
  m=s.match(/(\d{1,2})\s*[\/월.]\s*(\d{1,2})/);   // 8/26 or 8월26
  if(m){ var y=new Date().getFullYear(); return new Date(y,+m[1]-1,+m[2]); }
  return null;
}
function ymd(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function todayYmd(){ return ymd(new Date()); }
var WD=['일','월','화','수','목','금','토'];
// 직무 정규화 (강사(쌤이다) → 강사)
function jobNorm(s){ s=String(s||''); if(s.indexOf('상담')>=0)return '상담부'; if(s.indexOf('사업')>=0)return '사업부'; if(s.indexOf('코칭')>=0)return '코칭'; if(s.indexOf('강사')>=0)return '강사'; return s||'기타'; }
// [면접관 규칙] 운영센터+알바몬+코칭 = 운영센터 면접 / 나머지 전부 = 엄현호 이사
function interviewerOf(iv){
  // 시트 면접관 열(H) 값이 있으면 그대로 사용
  if(iv.interviewer) return iv.interviewer;
  // 폴백 규칙: 코칭+알바몬 = 운영센터 / 그 외 = 엄현호 이사
  var site=String(iv.site||'').trim(), job=String(iv.job||'').trim();
  if(job==='코칭' && site.indexOf('알바몬')>=0) return '운영센터';
  return '엄현호 이사';
}
// 참석/합격 상태 → {cls,label}
function statusOf(iv){
  var at=String(iv.attend||'').trim(), pass=String(iv.pass||'').trim();
  if(!at && !pass) return {cls:'wait',label:'예정'};
  if(at.indexOf('불참')>=0||at.indexOf('노쇼')>=0) return {cls:'ns',label:'불참'};
  if(pass.indexOf('불합격')>=0) return {cls:'fa',label:'불합격'};
  if(pass.indexOf('합격')>=0){ return iv.eduDate?{cls:'ps',label:'교육예정'}:{cls:'ps',label:'합격'}; }
  if(at.indexOf('참석')>=0) return {cls:'at',label:'참석·결과대기'};
  return {cls:'wait',label:'예정'};
}

var IVS=[];   // 전체 면접 (파싱됨)
var __weekStart=null;   // 현재 보는 주 월요일

function boot(){
  fetch(CSV_URL+'&_='+Date.now()).then(function(r){return r.text();}).then(function(txt){
    var rows=parseCSV(txt).filter(function(r){return r.some(function(c){return (c||'').trim();});});
    // 헤더행 찾기 (이름 포함)
    var hi=0; for(var i=0;i<Math.min(rows.length,4);i++){ if(rows[i].some(function(c){return (c||'').indexOf('이름')>=0;})){hi=i;break;} }
    // 컬럼: A날짜 B시간 C직무 D사이트 E이름 F지역 G연락처 H참석 I합격 J교육날짜 K교육시간 L교육담당 M메모
    for(var r=hi+1;r<rows.length;r++){
      var row=rows[r];
      var nm=(row[4]||'').trim();
      var dt=parseDate(row[0]);
      if(!nm || !dt) continue;
      IVS.push({
        date:ymd(dt), dObj:dt,
        time:(row[1]||'').trim(),
        job:jobNorm(row[2]),
        site:(row[3]||'').trim(),
        name:nm,
        region:(row[5]||'').trim(),
        interviewer:(row[7]||'').trim(),   // [H열] 시트의 실제 면접관 (엄현호 이사/운영센터)
        attend:(row[8]||'').trim(),
        pass:(row[9]||'').trim(),
        eduDate:(row[10]||'').trim(),
        eduTime:(row[11]||'').trim(),
        eduWho:(row[12]||'').trim(),
        memo:(row[13]||'').trim()
      });
    }
    IVS.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:(a.time<b.time?-1:1); });
    document.getElementById('upd').textContent='실시간 · '+IVS.length+'건 · '+new Date().toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+' 기준';
    // 이번주로 초기화
    __weekStart=mondayOf(new Date());
    renderCal();
  }).catch(function(e){
    document.getElementById('cal_grid').innerHTML='<div class="err">시트를 불러오지 못했어요: '+e+'<br>시트 공유가 "링크 있는 사람 뷰어"인지 확인해주세요.</div>';
    document.getElementById('upd').textContent='로드 실패';
  });
}

function mondayOf(d){ var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); var dow=x.getDay(); x.setDate(x.getDate()-(dow===0?6:dow-1)); return x; }

// ── 오늘의 면접 (히어로) ──
function renderToday(){
  var el=document.getElementById('today-hero');
  var td=todayYmd(), now=new Date();
  var dnum=now.getMonth()+1, dday=now.getDate();
  var todays=IVS.filter(function(x){return x.date===td;});
  var h='<div class="today-hero"><div class="th-top"><span class="th-date">오늘 '+dnum+'월 '+dday+'일</span><span class="th-wd">('+WD[now.getDay()]+')</span><span class="th-live">면접 '+todays.length+'건</span></div>';
  if(todays.length){
    h+='<div class="th-sub">시간 · 이름 · 직무 · 유입경로</div><div class="th-list">';
    todays.forEach(function(iv){
      var st=statusOf(iv);
      var esc=function(s){return String(s||'').replace(/</g,'&lt;');};
      h+='<div class="th-item" onclick="openIv(\''+iv.date+'\',\''+esc(iv.name).replace(/'/g,'')+'\')">'
        +'<span class="th-tm">'+(iv.time||'-')+'</span>'
        +'<div class="th-body"><div class="th-nm">'+esc(iv.name)+'</div>'
        +'<div class="th-tags"><span class="th-tag">'+esc(iv.job)+'</span>'
        +(iv.site?'<span class="th-tag site">'+esc(iv.site)+'</span>':'')
        +'<span class="th-tag site">👤 '+esc(interviewerOf(iv))+'</span>'
        +(iv.region?'<span class="th-tag site">'+esc(iv.region)+'</span>':'')+'</div></div>'
        +'<span class="th-status '+st.cls+'">'+st.label+'</span></div>';
    });
    h+='</div>';
  } else {
    // 다음 면접일 폴백
    var next=IVS.filter(function(x){return x.date>td;})[0];
    h+='<div class="th-none">오늘 예정된 면접이 없어요 ☕'
      +(next?'<small>다음 면접 · '+next.date.slice(5).replace('-','/')+' ('+IVS.filter(function(x){return x.date===next.date;}).length+'명)</small>':'')
      +'</div>';
  }
  h+='</div>';
  el.innerHTML=h;
}

// ── 주간 캘린더 ──
window.calMove=function(dir){ __weekStart.setDate(__weekStart.getDate()+dir*7); renderCal(); };
window.calToday=function(){ __weekStart=mondayOf(new Date()); renderCal(); };
function renderCal(){
  var ws=new Date(__weekStart), td=todayYmd();
  var days=[]; for(var i=0;i<7;i++){ var d=new Date(ws); d.setDate(ws.getDate()+i); days.push(d); }
  document.getElementById('cal_range').textContent=(days[0].getMonth()+1)+'/'+days[0].getDate()+' ~ '+(days[6].getMonth()+1)+'/'+days[6].getDate();
  // 이번주면 제목에 오늘 날짜 강조
  var _tt=document.getElementById('cal_title'), _now=new Date();
  var _isThisWeek = days.some(function(d){return ymd(d)===td;});
  if(_tt){ _tt.innerHTML = _isThisWeek ? '🗓️ 오늘 <span style=\"color:#E23A22\">'+( _now.getMonth()+1)+'월 '+_now.getDate()+'일('+WD[_now.getDay()]+')</span> · 이번주 면접' : '🗓️ 주간 면접'; }
  var h='<div class="cal-grid">';
  days.forEach(function(d){
    var dstr=ymd(d), isT=(dstr===td), dow=d.getDay(), wknd=(dow===0||dow===6);
    var list=IVS.filter(function(x){return x.date===dstr;});
    var cls='cal-col'+(isT?' today':'')+(wknd?' weekend':'')+(list.length===0?' empty-mo':'');
    h+='<div class="'+cls+'"><div class="cal-dhd"><div><div class="cal-wd">'+WD[dow]+'</div><div class="cal-dnum">'+d.getDate()+'</div></div>'
      +(isT?'<span class="cal-todaytag">TODAY</span>':'')+'</div><div class="cal-ivs">';
    if(list.length){
      list.forEach(function(iv){
        var st=statusOf(iv), done=(st.cls!=='wait');
        var esc=function(s){return String(s||'').replace(/</g,'&lt;');};
        var dotCls=st.cls==='at'||st.cls==='ps'?'at':st.cls==='ns'||st.cls==='fa'?'ns':'';
        h+='<div class="cal-iv job-'+esc(iv.job)+(done?' done':'')+'" onclick="openIv(\''+iv.date+'\',\''+esc(iv.name).replace(/\x27/g,'')+'\')">'
          +'<div class="cal-iv-tm">'+(dotCls?'<span class="cal-iv-dot '+dotCls+'"></span>':'')+(iv.time||'-')+'</div>'
          +'<div class="cal-iv-nm">'+esc(iv.name)+'</div>'
          +'<div class="cal-iv-tag">'+esc(iv.job)+(iv.site?' · '+esc(iv.site):'')+'</div>'
          +'<div class="cal-iv-mgr">👤 '+esc(interviewerOf(iv))+'</div></div>';
      });
    } else {
      h+='<div class="cal-empty">-</div>';
    }
    h+='</div></div>';
  });
  h+='</div>';
  document.getElementById('cal_grid').innerHTML=h;
}

// ── 상세 모달 ──
window.openIv=function(date,name){
  var iv=IVS.filter(function(x){return x.date===date && x.name.replace(/'/g,'')===name;})[0];
  if(!iv) iv=IVS.filter(function(x){return x.date===date && x.name.indexOf(name)>=0;})[0];
  if(!iv) return;
  var st=statusOf(iv);
  var esc=function(s){return String(s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
  var wd=WD[iv.dObj.getDay()];
  var h='<div class="ivm-hd job-'+iv.job+'"><button class="ivm-close" onclick="closeIv()">✕</button>'
    +'<div class="ivm-nm">'+esc(iv.name)+'</div>'
    +'<div class="ivm-when">'+iv.date.slice(5).replace('-','/')+' ('+wd+') '+(iv.time||'')+'</div>'
    +'<div class="ivm-tags"><span class="ivm-tag">'+esc(iv.job)+'</span>'
    +(iv.site?'<span class="ivm-tag">'+esc(iv.site)+'</span>':'')
    +(iv.region?'<span class="ivm-tag">'+esc(iv.region)+'</span>':'')+'</div></div>';
  h+='<div class="ivm-body">';
  h+='<div class="ivm-row"><span class="ivm-lbl">면접관</span><span class="ivm-val">'+esc(interviewerOf(iv))+'</span></div>';
  h+='<div class="ivm-row"><span class="ivm-lbl">참석</span><span class="ivm-val '+(iv.attend.indexOf('불참')>=0?'ns':iv.attend.indexOf('참석')>=0?'at':'')+'">'+(esc(iv.attend)||'-')+'</span></div>';
  h+='<div class="ivm-row"><span class="ivm-lbl">결과</span><span class="ivm-val '+(iv.pass.indexOf('불합격')>=0?'fa':iv.pass.indexOf('합격')>=0?'ps':'')+'">'+(esc(iv.pass)||'-')+'</span></div>';
  if(iv.eduDate){
    h+='<div class="ivm-row"><span class="ivm-lbl">교육</span><span class="ivm-val">'+esc(iv.eduDate.slice(5).replace('-','/'))+(iv.eduTime?' '+esc(iv.eduTime):'')+(iv.eduWho?' · '+esc(iv.eduWho):'')+'</span></div>';
  }
  if(iv.memo){ h+='<div class="ivm-memo">'+esc(iv.memo)+'</div>'; }
  h+='</div>';
  document.getElementById('ivBody').innerHTML=h;
  document.getElementById('ivModal').classList.add('on');
  document.body.style.overflow='hidden';
};
window.closeIv=function(){ document.getElementById('ivModal').classList.remove('on'); document.body.style.overflow=''; };

boot();
</script></body></html>
