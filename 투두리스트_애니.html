<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<title>이등분선 문제 설명</title>
<style>
  :root{
    --ink:#1f2733; --sub:#5a6b85; --paper:#FFFDF7;
    --gold:#E8850C; --gold-bg:#FDF1DF;
    --teal:#0f9d6e; --teal-bg:#e3f7ef;
    --blue:#2b5fb0; --blue-bg:#e9f0fb;
    --red:#E23A22; --red-bg:#fdeae7;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Jua',system-ui,sans-serif;background:#2a3140;display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px;color:#e7ecf3}
  h1.pg{font-size:16px;font-family:system-ui;font-weight:700}
  .hint{font-size:12px;color:#9aa6b8;font-family:system-ui}

  /* 무대 1:1 */
  .stage-outer{border-radius:26px;overflow:hidden;background:#c8cdd6;
    background-image:linear-gradient(45deg,#b9bfc9 25%,transparent 25%),linear-gradient(-45deg,#b9bfc9 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#b9bfc9 75%),linear-gradient(-45deg,transparent 75%,#b9bfc9 75%);
    background-size:26px 26px;background-position:0 0,0 13px,13px -13px,-13px 0}
  #stage{position:relative;width:900px;height:900px;max-width:92vw;background:var(--paper);overflow:hidden;padding:44px 52px;display:flex;flex-direction:column}
  .tab{position:absolute;left:36px;top:0;width:22px;height:40px;background:#FFD43B;border-radius:0 0 6px 6px;z-index:1}
  .scene-no{position:absolute;right:52px;top:52px;font-size:22px;color:#c3ccd8;font-weight:700}
  h1{font-size:46px;color:var(--ink);letter-spacing:-1px;margin-bottom:8px;line-height:1.05}
  .kicker{font-size:23px;color:var(--gold);font-weight:700;margin-bottom:4px;padding-left:2px}

  .content{flex:1;display:flex;flex-direction:column;justify-content:center;gap:24px;min-height:0;padding-top:10px}
  .split{display:flex;gap:40px;align-items:center;flex:1}
  .fig{background:#fff;border:3px solid #EEE7D6;border-radius:20px;padding:20px;flex:0 0 auto}
  .fig svg{width:430px;height:auto}
  .txtcol{flex:1;display:flex;flex-direction:column;justify-content:center;gap:26px}

  /* 조건 라인 (문제 설명) */
  .cond{font-size:38px;color:#8a97a8;font-family:'Gaegu',sans-serif;line-height:1.4;opacity:.35;transition:opacity .4s,transform .4s;transform:translateX(10px)}
  .cond.on{opacity:1;transform:translateX(0);color:var(--ink)}
  .cond b{color:var(--ink)}
  .cond .g{color:var(--gold);font-weight:700}
  .cond .t{color:var(--teal);font-weight:700}
  .cond .b{color:var(--blue);font-weight:700}
  .cond .r{color:var(--red);font-weight:700}

  .formula{font-size:58px;font-family:'Gaegu',sans-serif;color:var(--ink);text-align:center;line-height:1.4;opacity:.4;transition:opacity .5s}
  .formula.on{opacity:1}
  .formula b{font-size:60px}
  .g{color:var(--gold);font-weight:700}.t{color:var(--teal);font-weight:700}.b{color:var(--blue);font-weight:700}.r{color:var(--red);font-weight:700}

  .ans{background:var(--teal-bg);border:4px solid #B6E5D2;border-radius:22px;padding:24px;text-align:center;opacity:.25;transition:opacity .6s;transform:scale(.9);transition:opacity .5s,transform .5s}
  .ans.on{opacity:1;transform:scale(1)}
  .ans .lb{font-size:26px;color:var(--teal);font-weight:700;display:block;margin-bottom:4px}
  .ans .vv{font-size:80px;color:#0a6f4e;font-weight:700}

  /* 핵심 정리 */
  .keyrow{display:flex;align-items:flex-start;gap:16px;font-size:32px;font-family:'Gaegu',sans-serif;color:var(--ink);line-height:1.3;opacity:.2;transition:opacity .5s,transform .5s;transform:translateY(8px)}
  .keyrow.on{opacity:1;transform:translateY(0)}
  .keyrow .num{flex:none;width:44px;height:44px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:24px;font-family:'Jua'}
  .keyrow.k1 .num{background:var(--gold)} .keyrow.k2 .num{background:var(--blue)} .keyrow.k3 .num{background:var(--red)}
  .keyrow .kb{color:var(--ink)}
  .keyrow .hl{font-weight:700}

  /* SVG 강조 애니 */
  .fade{opacity:0;transition:opacity .5s ease}
  /* 선 그려지는 효과 (dasharray=선 길이) */
  .draw-line{stroke-dasharray:135;stroke-dashoffset:135;transition:stroke-dashoffset .9s ease}
  .draw-line.drawn{stroke-dashoffset:0}
  /* 다 그려진 뒤 반짝임 */
  @keyframes sparkle{0%,100%{filter:drop-shadow(0 0 0 transparent)}50%{filter:drop-shadow(0 0 8px rgba(15,157,110,.9))}}
  .draw-line.drawn.spark{animation:sparkle 1s ease 2}
  /* 강조 요소 반짝임 */
  @keyframes pop-glow{0%{filter:drop-shadow(0 0 0 transparent)}45%{filter:drop-shadow(0 0 11px rgba(232,133,12,.85))}100%{filter:drop-shadow(0 0 0 transparent)}}
  svg .spark-on{animation:pop-glow .9s ease}
  .fade.on{opacity:1 !important}
  svg .fade{opacity:0}
  svg .fade.on{opacity:1}
  .glow{filter:drop-shadow(0 0 0 transparent);transition:filter .4s}
  .glow.on{filter:drop-shadow(0 0 6px rgba(232,133,12,.7))}

  /* OBS 모드 (초록 크로마키) */
  body.obs{background:#00B140;padding:0;overflow:hidden}
  body.obs h1.pg,body.obs .hint,body.obs .ctrl{display:none}
  body.obs .stage-outer{width:100%;height:100vh;border-radius:0;background:#00B140;background-image:none;display:flex;align-items:center;justify-content:center}
  body.obs #stage{max-width:none}

  .ctrl{display:flex;gap:10px;align-items:center;font-family:system-ui}
  .ctrl button{border:none;border-radius:10px;padding:12px 22px;font-size:14px;font-weight:800;cursor:pointer}
  .play{background:#3B82F6;color:#fff} .nav{background:#3a4657;color:#e7ecf3} .dl{background:#0f9d6e;color:#fff}
  .pageinfo{font-size:13px;color:#9aa6b8;min-width:120px;text-align:center}
</style>
</head>
<body>
<h1 class="pg">이등분선 문제 설명 애니메이션</h1>
<p class="hint">[재생]하면 씬별 타이밍(19·25·12·20·15초)에 맞춰 강조가 나타납니다. OBS는 <b>?obs</b> URL로 초록배경 자동재생.</p>

<div class="stage-outer">
  <div id="stage">
    <div class="tab"></div>
    <div class="scene-no" id="sceneNo"></div>
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="ctrl">
  <button class="play" id="play">▶ 처음부터 재생</button>
  <button class="nav" id="prev">◀</button>
  <button class="nav" id="next">▶ 씬</button>
  <span class="pageinfo" id="pinfo"></span>
  <button class="dl" id="obsBtn">OBS 모드</button>
</div>

<script>
  // ── 도형 SVG (DE∥AC, BD:DC=3:2) ──
  // n×n 격자 (넓이 칸 시각화)
  function grid(n, fillC, strokeC){
    var cell=22, out='';
    for(var r=0;r<n;r++) for(var c=0;c<n;c++){
      out+='<rect x="'+(c*cell)+'" y="'+(r*cell)+'" width="'+cell+'" height="'+cell+'" fill="'+fillC+'" stroke="'+strokeC+'" stroke-width="1.5"/>';
    }
    return out;
  }
  function fig(o){
    o=o||{};
    var tri='<polygon points="40,280 340,280 370,60" fill="#EEF1F6" stroke="#1f2733" stroke-width="2.5"/>';
    // AB(18) AC(12) 호+라벨
    var lenAB = o.lenAB ? '<g class="fade '+(o.lenAB==='on'?'on':'')+'" id="gAB"><path d="M40,280 Q187,143 370,60" fill="none" stroke="#E8850C" stroke-width="2.5" stroke-dasharray="5 4"/><text x="150" y="135" font-size="21" font-weight="700" fill="#E8850C">18cm</text></g>' : '';
    var lenAC = o.lenAC ? '<g class="fade '+(o.lenAC==='on'?'on':'')+'" id="gAC"><path d="M370,60 Q396,174 340,280" fill="none" stroke="#2b5fb0" stroke-width="2.5" stroke-dasharray="5 4"/><text x="400" y="180" font-size="21" font-weight="700" fill="#2b5fb0">12cm</text></g>' : '';
    // AD 이등분선
    var ad = o.ad ? '<g class="fade '+(o.ad==='on'?'on':'')+'" id="gAD"><line x1="370" y1="60" x2="220" y2="280" stroke="#E8850C" stroke-width="3.5"/>'
      + '<circle cx="346" cy="84" r="4" fill="#E8850C"/>'   // ∠BAD 안 점
      + '<circle cx="358" cy="92" r="4" fill="#E8850C"/>'   // ∠DAC 안 점 (같은 각 표시)
      + '<circle cx="220" cy="280" r="5" fill="#E8850C"/><text x="212" y="306" font-size="21" font-weight="700" fill="#E8850C">D</text></g>' : '';
    // DE 평행
    var de = o.de ? '<g class="fade '+(o.de==='on'?'on':'')+'" id="gDE"><line id="deLine" class="draw-line" x1="238" y1="148" x2="220" y2="280" stroke="#0f9d6e" stroke-width="3.5"/><circle cx="238" cy="148" r="5" fill="#0f9d6e"/><text x="244" y="145" font-size="21" font-weight="700" fill="#0f9d6e">E</text><text x="150" y="230" font-size="17" font-weight="700" fill="#0f9d6e">DE∥CA</text></g>' : '';
    // 작은삼각형 EBD 강조 (초록칠)
    var ebd = o.ebd ? '<polygon class="fade '+(o.ebd==='on'?'on':'')+'" id="gEBD" points="40,280 220,280 238,148" fill="'+(o.ebd==='fill'?'#7FD4B0':'#DFF3EA')+'" stroke="#0f9d6e" stroke-width="3" opacity="'+(o.ebd==='fill'?'0.75':'1')+'"/>' : '';
    // 큰삼각형 ABC 강조 (파랑칠)
    var abc = o.abc ? '<polygon class="fade '+(o.abc==='on'?'on':'')+'" id="gABC" points="40,280 340,280 370,60" fill="#9DBEEA" stroke="#2b5fb0" stroke-width="3" opacity="0.55"/>' : '';
    // 대응 꼭짓점 강조 (E↔A, B공통, D↔C)
    var corr = o.corr ? '<g class="fade '+(o.corr==='on'?'on':'')+'" id="gCORR">'
      + '<circle cx="238" cy="148" r="9" fill="none" stroke="#0f9d6e" stroke-width="2.5"/><circle cx="370" cy="60" r="9" fill="none" stroke="#2b5fb0" stroke-width="2.5"/>'
      + '<text x="255" y="120" font-size="16" font-weight="700" fill="#0f9d6e">E↔A</text>'
      + '<circle cx="220" cy="280" r="9" fill="none" stroke="#0f9d6e" stroke-width="2.5"/><circle cx="340" cy="280" r="9" fill="none" stroke="#2b5fb0" stroke-width="2.5"/>'
      + '<text x="256" y="266" font-size="16" font-weight="700" fill="#5a6b85">D↔C</text></g>' : '';
    // BD/BC 밑변 호
    var base = o.base ? '<g class="fade '+(o.base==='on'?'on':'')+'" id="gBASE"><path d="M40,280 Q130,308 220,280" fill="none" stroke="#0f9d6e" stroke-width="4" stroke-dasharray="4 4"/><text x="108" y="322" font-size="19" font-weight="700" fill="#0f9d6e">BD=3</text><path d="M40,280 Q190,332 340,280" fill="none" stroke="#2b5fb0" stroke-width="4" stroke-dasharray="4 4"/><text x="172" y="350" font-size="19" font-weight="700" fill="#2b5fb0">BC=5</text></g>' : '';
    // 이등분선 정리 강조: AB변↔BD (주황), AC변↔DC (파랑)
    var bisect = o.bisect ? '<g class="fade '+(o.bisect==='on'?'on':'')+'" id="gBIS">'
      + '<line x1="40" y1="280" x2="370" y2="60" stroke="#E8850C" stroke-width="5" opacity="0.6"/>'   // AB 변
      + '<line x1="370" y1="60" x2="340" y2="280" stroke="#2b5fb0" stroke-width="5" opacity="0.6"/>'  // AC 변
      + '<line x1="36" y1="273" x2="44" y2="287" stroke="#E8850C" stroke-width="3.5"/><line x1="366" y1="53" x2="374" y2="67" stroke="#E8850C" stroke-width="3.5"/>'  // AB 양끝 눈금
      + '<line x1="378" y1="61" x2="362" y2="59" stroke="#2b5fb0" stroke-width="3.5"/><line x1="348" y1="281" x2="332" y2="279" stroke="#2b5fb0" stroke-width="3.5"/>'  // AC 양끝 눈금
      + '<text x="150" y="130" font-size="20" font-weight="700" fill="#E8850C">18cm</text>'           // AB=18
      + '<text x="358" y="180" font-size="20" font-weight="700" fill="#2b5fb0">12cm</text>'           // AC=12
      + '<path d="M40,284 Q130,308 220,284" fill="none" stroke="#E8850C" stroke-width="4"/>'          // BD (AB와 같은 주황)
      + '<path d="M224,290 Q282,308 340,290" fill="none" stroke="#2b5fb0" stroke-width="4"/>'         // DC (AC와 같은 파랑)
      + '</g>' : '';
    var vb = o.tall ? '0 0 440 360' : '0 0 440 330';
    return '<svg viewBox="'+vb+'" xmlns="http://www.w3.org/2000/svg">'
      + tri + abc + ebd + corr + bisect + base + lenAB + lenAC + ad + de
      + '<circle cx="370" cy="60" r="5" fill="#1f2733"/><circle cx="40" cy="280" r="5" fill="#1f2733"/><circle cx="340" cy="280" r="5" fill="#1f2733"/>'
      + '<text x="376" y="55" font-size="22" font-weight="700" fill="#1f2733">A</text>'
      + '<text x="22" y="278" font-size="22" font-weight="700" fill="#1f2733">B</text>'
      + '<text x="346" y="278" font-size="22" font-weight="700" fill="#1f2733">C</text>'
      + '</svg>';
  }

  // ── 씬 정의: dur(초), build(html), steps[{at(초), do}] ──
  var SCENES = [
    // 1) 문제 (19초)
    { no:'문제', dur:19, kicker:'삼각형 각의 이등분선', title:'다음을 읽고 넓이를 구하시오',
      build:function(){
        return '<div class="split"><div class="fig">'+fig({ad:1,de:1,lenAB:1,lenAC:1})+'</div>'
          +'<div class="txtcol">'
          +'<div class="cond" id="c1">∠A의 <span class="g">이등분선</span>이 BC와 만나는 점 <span class="g">D</span></div>'
          +'<div class="cond" id="c2">점 D에서 AB 위의 점 <span class="t">E</span>, <span class="t">ED∥AC</span></div>'
          +'<div class="cond" id="c3"><span class="g">AB = 18cm</span></div>'
          +'<div class="cond" id="c4"><span class="b">AC = 12cm</span></div>'
          +'<div class="cond" id="c5">△EBD = <span class="r">45cm²</span></div>'
          +'<div class="cond" id="c6"><b>△ABC의 넓이 = ?</b></div>'
          +'</div></div>';
      },
      steps:[
        {at:1.5, el:'c1', svg:['gAD']},
        {at:5,   el:'c2', svg:['gDE']},
        {at:9,   el:'c3', svg:['gAB']},
        {at:11.5,el:'c4', svg:['gAC']},
        {at:14,  el:'c5', svg:['gEBD']},
        {at:16.5,el:'c6'},
      ]},

    // 2) 닮음 + 비율 (25초) — 색칠로 닮음 이해
    { no:'STEP 1', dur:25, kicker:'닮음과 비율', title:'△EBD ∽ △ABC',
      build:function(){
        return '<div class="split"><div class="fig">'+fig({abc:1,ebd:1,corr:1,ad:1,de:1,bisect:1,tall:1})+'</div>'
          +'<div class="txtcol">'
          +'<div class="cond" id="c1"><span class="b">큰 삼각형 ABC</span></div>'
          +'<div class="cond" id="c2"><span class="t">작은 삼각형 EBD</span><br><span style="font-size:24px">ED∥AC → 같은 모양 (닮음)</span></div>'
          +'<div class="cond" id="c3">이등분선 정리<br><span class="g">AB:AC</span> = <span class="r">BD:DC</span></div>'
          +'<div class="cond" id="c4">= 18 : 12 = <span class="g">3 : 2</span></div>'
          +'</div></div>';
      },
      steps:[
        {at:3,  el:'c1', svg:['gABC']},
        {at:9,  el:'c2', svg:['gEBD','gDE','gCORR']},
        {at:16, el:'c3', svg:['gAD','gBIS']},
        {at:21, el:'c4'},
      ]},

    // 3) 넓이비 (12초) — 3:5(전체) + 칸 격자로 9:25
    { no:'STEP 2', dur:12, kicker:'닮음비 → 넓이비', title:'조각 말고 전체로!',
      build:function(){
        return '<div class="content" style="gap:20px">'
          +'<div class="formula" id="f0" style="font-size:40px">닮음비는 <span class="r">조각 아닌 전체</span><br>BD : BC = 3 : (3+2) = <span class="b">3 : 5</span></div>'
          +'<div class="formula" id="f1" style="font-size:36px">넓이는 <span class="r">제곱!</span></div>'
          +'<div class="fig" id="fbox" style="padding:20px;opacity:.25;transition:opacity .5s">'
          +'<svg viewBox="0 0 480 175" xmlns="http://www.w3.org/2000/svg">'
          +'<g transform="translate(20,12)">'+grid(3,'#7FD4B0','#0f9d6e')+'<text x="30" y="128" font-size="22" font-weight="700" fill="#0f9d6e">9칸</text></g>'
          +'<text x="150" y="88" font-size="34" font-weight="700" fill="#5a6b85">:</text>'
          +'<g transform="translate(185,12)">'+grid(5,'#9DBEEA','#2b5fb0')+'<text x="45" y="128" font-size="22" font-weight="700" fill="#2b5fb0">25칸</text></g>'
          +'</svg></div>'
          +'<div class="formula" id="f2" style="font-size:44px">3² : 5² = <b class="r">9 : 25</b></div>'
          +'</div>';
      },
      steps:[
        {at:1,  el:'f0'},
        {at:5,  el:'f1'},
        {at:6.5,el:'fbox'},
        {at:9,  el:'f2'},
      ]},

    // 4) 계산 (20초)
    { no:'STEP 3', dur:20, kicker:'넓이 계산', title:'한 칸 = 5 → 125',
      build:function(){
        return '<div class="content" style="gap:22px">'
          +'<div class="formula" id="f1">△EBD : △ABC = <b class="r">9 : 25</b> 칸</div>'
          +'<div class="fig" id="fbox" style="padding:24px;opacity:.25;transition:opacity .5s">'
          +'<svg viewBox="0 0 440 150" xmlns="http://www.w3.org/2000/svg">'
          +'<text x="10" y="35" font-size="22" font-weight="700" fill="#0f9d6e">△EBD = 9칸 = 45cm²</text>'
          +'<text x="10" y="80" font-size="26" font-weight="700" fill="#E23A22">→ 한 칸 = 45 ÷ 9 = 5</text>'
          +'<text x="10" y="125" font-size="22" font-weight="700" fill="#2b5fb0">△ABC = 25칸 = 25 × 5</text>'
          +'</svg></div>'
          +'<div class="formula" id="f2">45 × <span class="r">25</span>/<span class="t">9</span> = <b class="r">125</b></div>'
          +'<div class="ans" id="ans"><span class="lb">△ABC의 넓이</span><span class="vv">125 cm²</span></div>'
          +'</div>';
      },
      steps:[
        {at:1,  el:'f1'},
        {at:4,  el:'fbox'},
        {at:11, el:'f2'},
        {at:15, el:'ans'},
      ]},

    // 5) 핵심 정리 (15초) — 도형 보여주며 표시
    { no:'정리', dur:15, kicker:'꼭 기억할 3가지', title:'핵심 정리',
      build:function(){
        return '<div class="split"><div class="fig">'+fig({abc:1,ebd:1,ad:1,de:1,base:1,tall:1})+'</div>'
          +'<div class="txtcol">'
          +'<div class="keyrow k1" id="k1"><span class="num">1</span><span class="kb">이등분선은 밑변을 <span class="hl" style="color:#E8850C">D로 나눈다</span></span></div>'
          +'<div class="keyrow k2" id="k2"><span class="num">2</span><span class="kb">닮음비는 <span class="hl" style="color:#2b5fb0">조각 말고 전체</span>로<br><span style="font-size:24px">(3:2 아니라 3:5)</span></span></div>'
          +'<div class="keyrow k3" id="k3"><span class="num">3</span><span class="kb">넓이비는 <span class="hl" style="color:#E23A22">닮음비의 제곱</span><br><span style="font-size:24px">(3:5 → 9:25)</span></span></div>'
          +'</div></div>';
      },
      steps:[
        {at:1,  el:'k1', svg:['gAD']},           // 이등분선·D
        {at:5.5,el:'k2', svg:['gBASE']},         // BD:BC 전체
        {at:10, el:'k3', svg:['gABC','gEBD']},   // 넓이 색칠
      ]},
  ];

  var content=document.getElementById('content');
  var timers=[];
  function clearTimers(){ timers.forEach(clearTimeout); timers=[]; }

  function showScene(i, animate){
    clearTimers();
    var s=SCENES[i];
    document.getElementById('sceneNo').textContent=s.no;
    document.getElementById('kicker').textContent=s.kicker;
    document.getElementById('title').textContent=s.title;
    content.innerHTML=s.build();
    document.getElementById('pinfo').textContent=(i+1)+' / '+SCENES.length+' · '+s.dur+'초';
    if(animate){
      s.steps.forEach(function(st){
        timers.push(setTimeout(function(){
          var el=document.getElementById(st.el); if(el) el.classList.add('on');
          if(st.svg) st.svg.forEach(function(id){
            var g=document.getElementById(id);
            if(g){ g.classList.add('on'); g.style.opacity='1'; g.style.transition='opacity .5s ease'; g.classList.add('spark-on'); setTimeout(function(){g.classList.remove('spark-on');},900); }
            if(id==='gDE'){ var dl=document.getElementById('deLine'); if(dl){
              dl.style.strokeDasharray='135'; dl.style.strokeDashoffset='135'; dl.style.transition='stroke-dashoffset .9s ease';
              setTimeout(function(){ dl.style.strokeDashoffset='0'; setTimeout(function(){dl.classList.add('spark');},900); },200);
            } }
          });
        }, st.at*1000));
      });
    } else {
      // 정지 시엔 전부 표시
      s.steps.forEach(function(st){
        var el=document.getElementById(st.el); if(el) el.classList.add('on');
        if(st.svg) st.svg.forEach(function(id){
            var g=document.getElementById(id);
            if(g){ g.classList.add('on'); g.style.opacity='1'; g.style.transition='opacity .5s ease'; g.classList.add('spark-on'); setTimeout(function(){g.classList.remove('spark-on');},900); }
            if(id==='gDE'){ var dl=document.getElementById('deLine'); if(dl){
              dl.style.strokeDasharray='135'; dl.style.strokeDashoffset='135'; dl.style.transition='stroke-dashoffset .9s ease';
              setTimeout(function(){ dl.style.strokeDashoffset='0'; setTimeout(function(){dl.classList.add('spark');},900); },200);
            } }
          });
      });
    }
  }

  var cur=0;
  function playAll(){
    var i=0;
    function playScene(){
      if(i>=SCENES.length){ if(document.body.classList.contains('obs')){ setTimeout(function(){ i=0; cur=0; playScene(); },2000); } return; }
      cur=i; showScene(i, true);
      var dur=SCENES[i].dur*1000;
      timers.push(setTimeout(function(){ i++; playScene(); }, dur));
    }
    clearTimers(); playScene();
  }

  document.getElementById('play').onclick=playAll;
  document.getElementById('prev').onclick=function(){ if(cur>0){cur--;showScene(cur,false);} };
  document.getElementById('next').onclick=function(){ if(cur<SCENES.length-1){cur++;showScene(cur,false);} };

  // OBS 모드
  document.getElementById('obsBtn').onclick=function(){ document.body.classList.add('obs'); setTimeout(playAll,600); };
  (function(){
    if(location.search.indexOf('obs')>=0){ document.body.classList.add('obs'); setTimeout(playAll,700); }
    else showScene(0,false);
  })();
</script>
</body>
</html>
