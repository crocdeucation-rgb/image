<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TO DO LIST 애니메이션</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFDF7; --ink:#2B2B2B; --line:#E4E0D5;
    --accent:#FF7A45; --check:#E23A22; --hl:#3B82F6; --hl-bg:#DBEAFE;
    --tab:#FFD43B;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Jua','Gaegu',system-ui,sans-serif;background:#3a4150;padding:24px;color:#e7ecf3}
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:17px;font-weight:700;margin-bottom:4px;font-family:system-ui,sans-serif}
  .desc{font-size:13px;color:#9aa6b8;margin-bottom:18px;font-family:system-ui,sans-serif;line-height:1.6}

  /* 무대 = 투명(체커) 위에 투두판. 16:9 */
  .stage-outer{border-radius:12px;overflow:hidden;
    background:#d9dee6;
    background-image:
      linear-gradient(45deg,#c8cdd6 25%,transparent 25%),linear-gradient(-45deg,#c8cdd6 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#c8cdd6 75%),linear-gradient(-45deg,transparent 75%,#c8cdd6 75%);
    background-size:26px 26px;background-position:0 0,0 13px,13px -13px,-13px 0}
  #stage{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden}

  /* 투두 카드 — 우측 */
  .todo{position:absolute;right:6%;top:13%;width:560px;max-width:44%;
    background:var(--paper);border:3px solid var(--ink);border-radius:20px;
    padding:26px 30px 30px;box-shadow:6px 8px 0 rgba(0,0,0,.15);
    transform:scale(.9);opacity:0}
  .todo.show{animation:pop 1.2s cubic-bezier(.2,1.4,.4,1) forwards}
  @keyframes pop{to{transform:scale(1);opacity:1}}
  /* 상단 노란 탭 */
  .tab{position:absolute;left:26px;top:-3px;width:18px;height:40px;background:var(--tab);border-radius:0 0 5px 5px}
  .todo h2{font-size:clamp(20px,3.4vw,34px);font-weight:700;color:var(--ink);
    letter-spacing:-.5px;margin-bottom:20px;padding-left:8px;white-space:nowrap}
  .todo h2 .star{color:var(--accent);font-size:.75em;margin:0 4px}

  .item{display:flex;align-items:center;gap:14px;padding:9px 0;opacity:0;transform:translateX(18px)}
  .item.in{animation:slidein 1.1s ease forwards}
  @keyframes slidein{to{opacity:1;transform:translateX(0)}}
  .box{position:relative;width:34px;height:34px;border:3px solid var(--ink);border-radius:7px;flex:none}
  .txt{font-size:clamp(16px,2.4vw,25px);font-weight:400;font-family:'Gaegu',sans-serif;font-weight:700;color:var(--ink);white-space:nowrap}
  /* 체크 SVG (그려지는 애니) */
  .box svg{position:absolute;left:-4px;top:-8px;width:44px;height:44px;overflow:visible}
  .box svg path{fill:none;stroke:var(--check);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:48;stroke-dashoffset:48}
  .item.checked svg path{animation:draw 1.2s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .item.checked .txt .hl{background:var(--hl-bg);color:var(--hl);padding:0 4px;border-radius:4px}

  /* 편집 패널 */
  .panel{background:#222a35;border-radius:12px;padding:18px 20px;margin-top:16px;font-family:system-ui,sans-serif}
  .panel .lbl{font-size:12px;font-weight:700;color:#9fb0c3;margin-bottom:8px}
  .rows{display:flex;flex-direction:column;gap:8px}
  .erow{display:flex;gap:8px;align-items:center}
  .erow input[type=text]{flex:1;background:#0d1218;border:1px solid #2a3542;border-radius:8px;
    padding:9px 12px;color:#e7ecf3;font-size:14px;font-family:inherit}
  .erow input:focus{outline:none;border-color:var(--hl)}
  .erow .chk{display:flex;align-items:center;gap:5px;font-size:12px;color:#c3cfdb;white-space:nowrap}
  .erow .del{background:#3a2530;border:none;color:#e88;border-radius:7px;width:30px;height:36px;cursor:pointer;font-size:16px}
  .addbtn{background:#232d3a;border:none;color:#9fb0c3;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px;font-family:inherit}
  .foot{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
  .foot button{border:none;border-radius:9px;padding:11px 24px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}
  .play{background:var(--hl);color:#fff}
  .tip{font-size:12px;color:#7a8798;margin-top:12px;line-height:1.7;font-family:system-ui,sans-serif}
  .tip b{color:#c3cfdb}
  .hint{font-size:11px;color:#8a97a8}

  /* OBS clean 모드 (?clean): 투두판만, 배경 투명 */
  body.clean{background:transparent;padding:0}
  body.clean h1,body.clean .desc,body.clean .panel{display:none}
  body.clean .stage-outer{background:transparent;border-radius:0}
  body.clean #stage{aspect-ratio:auto;height:100vh}

  /* [OBS 모드] 버튼으로 토글: 투두판만 전체화면, 나머지 숨김 */
  html,body{overflow-x:hidden}
  body.obs{background:#00B140;padding:0;overflow:hidden;margin:0}
  body.obs h1,body.obs .desc,body.obs .panel{display:none}
  body.obs .stage-outer{width:100%;height:100vh;border-radius:0;background:#00B140;background-image:none}
  body.obs #stage{aspect-ratio:auto;width:100%;height:100vh}
  .obs-toggle{position:fixed;right:14px;top:14px;z-index:100;background:#3B82F6;color:#fff;
    border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:800;cursor:pointer;font-family:system-ui,sans-serif}
  body.obs .obs-toggle{background:rgba(0,0,0,.4);opacity:.3}
  body.obs .obs-toggle:hover{opacity:1}
  body.obs-url .obs-toggle{display:none !important}
</style>
</head>
<body>
<button class="obs-toggle" id="obsToggle">OBS 모드</button>
<div class="wrap">
  <h1>TO DO LIST 애니메이션</h1>
  <p class="desc">항목을 입력하고 [재생]하면 판이 뜨고 항목이 하나씩 나타나며 체크가 그려집니다. 화면녹화(투명배경)해서 영상에 얹으세요. <span class="hint">*별표*로 감싸면 파랑 강조</span></p>

  <div class="stage-outer">
    <div id="stage">
      <div class="todo" id="todo">
        <div class="tab"></div>
        <h2>오늘 <span class="star">✿</span>TO DO <span style="color:var(--accent)">LIST</span></h2>
        <div id="items"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="lbl">할 일 항목 (체크 = 완료 표시로 그려짐)</div>
    <div class="rows" id="rows"></div>
    <button class="addbtn" id="add">+ 항목 추가</button>
    <div class="foot">
      <button class="play" id="playBtn">▶ 재생</button>
      <span class="hint" id="status"></span>
    </div>
    <p class="tip">
      <b>화면녹화 팁:</b> 이 투두판 영역만 녹화(맥 Cmd+Shift+5 / 윈도우 게임바 Win+G, 또는 OBS)해서 캡컷·프리미어에 얹으세요.<br>
      체커무늬 배경은 미리보기용이라 화면엔 투두판만 녹화됩니다. 배경 완전 투명이 필요하면 OBS 브라우저소스로 이 페이지를 띄우세요.
    </p>
  </div>
</div>

<script>
  var DEFAULT=[
    {t:'*학교알리미* 시험기간 CHECK', done:true},
    {t:'다인이 필기 상태 꼼꼼히 CHECK', done:false},
    {t:'채린이 수학 학습 상태 점검', done:false},
    {t:'새로 추가된 원어민 특강 추천', done:false}
  ];
  var rowsEl=document.getElementById('rows');
  var itemsEl=document.getElementById('items');
  var todoEl=document.getElementById('todo');

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function fmt(s){return esc(s).replace(/\*([^*]+)\*/g,'<span class="hl">$1</span>');}

  function readRows(){
    return [...rowsEl.querySelectorAll('.erow')].map(function(r){
      return { t:r.querySelector('input[type=text]').value, done:r.querySelector('input[type=checkbox]').checked };
    });
  }
  function renderPreview(){
    var data=readRows();
    itemsEl.innerHTML=data.map(function(d){
      var check='<svg viewBox="0 0 44 44"><path d="M9 23 L19 33 L36 12"/></svg>';
      return '<div class="item in '+(d.done?'checked':'')+'"><div class="box">'+(d.done?check:'')+'</div><div class="txt">'+(d.t? fmt(d.t) : '\u00A0')+'</div></div>';
    }).join('');
    todoEl.classList.add('show');
  }
  function makeRow(d){
    var row=document.createElement('div'); row.className='erow';
    row.innerHTML='<input type="text" value="'+(d.t||'').replace(/"/g,'&quot;')+'" placeholder="할 일 입력">'
      +'<label class="chk"><input type="checkbox" '+(d.done?'checked':'')+'> 완료</label>'
      +'<button class="del">×</button>';
    row.querySelector('.del').onclick=function(){ row.remove(); renderPreview(); };
    row.querySelector('input[type=text]').oninput=renderPreview;
    row.querySelector('input[type=checkbox]').onchange=renderPreview;
    return row;
  }
  DEFAULT.forEach(function(d){ rowsEl.appendChild(makeRow(d)); });
  document.getElementById('add').onclick=function(){ rowsEl.appendChild(makeRow({t:'',done:false})); renderPreview(); };
  renderPreview();

  // 재생 애니메이션
  document.getElementById('playBtn').onclick=function(){
    if(window.__playing) return;   // 재생 중 중복 실행 방지 (역류 방지)
    window.__playing=true;
    var data=readRows();
    todoEl.classList.remove('show');
    itemsEl.innerHTML='';
    document.getElementById('status').textContent='재생 중…';
    void todoEl.offsetWidth;
    todoEl.classList.add('show');
    var delay=1400;
    data.forEach(function(d,i){
      var el=document.createElement('div');
      el.className='item';
      el.style.opacity='0';   // 등장 전 확실히 숨김
      var check='<svg viewBox="0 0 44 44"><path d="M9 23 L19 33 L36 12"/></svg>';
      el.innerHTML='<div class="box">'+(d.done?check:'')+'</div><div class="txt">'+(d.t? fmt(d.t) : '\u00A0')+'</div>';
      itemsEl.appendChild(el);
      setTimeout(function(){
        el.style.opacity='';
        el.classList.add('in');
        if(d.done) setTimeout(function(){ el.classList.add('checked'); }, 1000);
      }, delay);
      delay += d.done ? 2400 : 1600;
    });
    setTimeout(function(){
      document.getElementById('status').textContent='완료 ✓ (다시 재생 가능)';
      window.__playing=false;
      // OBS 모드면 잠깐 뒤 판을 비우고 자동 반복 (겹침 없이)
      if(document.body.classList.contains('obs')){
        setTimeout(function(){
          itemsEl.innerHTML=''; todoEl.classList.remove('show');
          setTimeout(function(){ document.getElementById('playBtn').click(); }, 400);
        }, 2500);
      }
    }, delay+200);
  };

  // OBS clean 모드: ?clean 이면 패널 숨기고, ?auto 면 자동재생
  (function(){
    var q=location.search;
    if(q.indexOf('clean')>=0) document.body.classList.add('clean');
    if(q.indexOf('obs')>=0){
      document.body.classList.add('obs');
      document.body.classList.add('obs-url');
      document.getElementById('items').innerHTML='';   // 미리보기 완성본 제거 → 애니부터 시작
      var _tg=document.getElementById('obsToggle'); if(_tg) _tg.textContent='편집으로';
      setTimeout(function(){ document.getElementById('playBtn').click(); }, 700);
    }
    if(q.indexOf('auto')>=0) setTimeout(function(){ document.getElementById('playBtn').click(); }, 800);
  })();

  document.getElementById('obsToggle').onclick=function(){
    document.body.classList.toggle('obs');
    this.textContent=document.body.classList.contains('obs')?'편집으로':'OBS 모드';
    if(document.body.classList.contains('obs')){
      document.getElementById('items').innerHTML='';   // 완성본 제거 → 애니부터
      setTimeout(function(){document.getElementById('playBtn').click();},600);
    } else {
      renderPreview();   // 편집으로 돌아오면 미리보기 복원
    }
  };
</script>
</body>
</html>
