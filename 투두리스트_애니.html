<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&family=Gaegu:wght@400;700&family=Pretendard:wght@500;700;800&display=swap" rel="stylesheet">
<title>노트피드백 - 소수÷소수 (가로)</title>
<style>
  :root{ --ink:#1B2436; --red:#E5533D; --blue:#2E5BFF; --hand:#1a3a8a;
    --paper:#FBF7EE; --teal:#0f9d6e; --fbbg:#FFF9F2; --hl:#FFE9A8; --peach:#FFEDE6; }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard',sans-serif;}
  body{background:#20242e;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;color:#e7ecf3;}
  h1.pg{font-size:14px;font-weight:700;font-family:system-ui;}
  .hint{font-size:11px;color:#9aa6b8;text-align:center;line-height:1.6;font-family:system-ui;}
  .stage-outer{border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  /* 16:9 무대 */
  #stage{position:relative;width:1280px;height:720px;max-width:92vw;background:var(--paper);overflow:hidden;display:flex;}
  /* 좌측 노트 */
  .noteCol{position:relative;height:100%;flex:0 0 auto;width:540px;background:#fff;
    display:flex;align-items:center;justify-content:center;border-right:1px solid #e7e0d2;}
  .noteCol img{height:100%;width:auto;display:block;}
  /* 정리줄 빨간 밑줄 (노트 위 좌표 %) */
  .uline{position:absolute;height:6px;background:var(--red);border-radius:3px;
    transform-origin:left center;transform:rotate(-2.5deg) scaleX(0);transition:transform .7s ease;opacity:.85;}
  .uline.go{transform:rotate(-2.5deg) scaleX(1);}
  /* 정리줄 강조 하이라이트 박스 */
  .hlbox{position:absolute;border:3px solid var(--red);border-radius:12px;
    opacity:0;transition:opacity .4s;box-shadow:0 0 0 6px rgba(226,58,34,.12);
    transform:rotate(-2deg);transform-origin:left center;}
  .hlbox.on{opacity:1;}
  /* 우측 피드백 */
  .fbCol{flex:1;position:relative;padding:48px 56px 40px;display:flex;flex-direction:column;gap:18px;
    background:#FFFBF5;
    background-image:
      linear-gradient(#F0E6D6 1px, transparent 1px),
      linear-gradient(90deg, #F0E6D6 1px, transparent 1px);
    background-size:32px 32px;}
  .fbhead{align-self:flex-start;font-size:20px;font-weight:800;color:#fff;display:flex;align-items:center;gap:10px;
    background:linear-gradient(135deg,#E5533D,#F0824C);padding:9px 20px;border-radius:100px;
    box-shadow:0 6px 16px rgba(229,83,61,.28);opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s;}
  .fbhead.on{opacity:1;transform:none;}
  .fbhead .dot{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.25);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;}
  .cmt{font-size:30px;font-weight:700;color:var(--ink);line-height:1.4;opacity:0;transform:translateX(14px);transition:opacity .5s,transform .5s;}
  .cmt.on{opacity:1;transform:none;}
  .cmt b{color:var(--red);}
  .cmt .u{background:linear-gradient(transparent 55%, var(--hl) 55%);padding:0 3px;font-weight:800;color:var(--ink);}
  .cmt .num{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;
    color:#fff;font-weight:800;font-size:20px;margin-right:8px;vertical-align:-6px;}
  .cmt .n1{background:var(--red);} .cmt .n2{background:var(--blue);}
  .cmt.big{font-size:31px;}
  /* 예시 카드 */
  .exwrap{margin-top:2px;margin-right:150px;background:linear-gradient(135deg,#EAF1FF,#F3F7FF);border:2px solid #C7D8FF;border-radius:18px;box-shadow:0 8px 20px rgba(46,91,255,.10);
    padding:22px 26px;opacity:0;transform:scale(.96);transition:opacity .5s,transform .5s;align-self:flex-start;max-width:100%;}
  .exwrap.on{opacity:1;transform:none;}
  .extag{font-family:'Pretendard';font-size:15px;font-weight:800;color:#fff;
    background:var(--blue);border-radius:8px;padding:3px 14px;display:inline-block;margin-bottom:12px;letter-spacing:1px;}
  .exline{font-family:'Nanum Pen Script','Gaegu',cursive;color:var(--hand);
    font-size:40px;line-height:1.4;white-space:nowrap;min-height:50px;transform:rotate(-1deg);}
  /* 얼굴 자리 안내(가이드, OBS선 투명) */
  .facehint{position:absolute;border:2px dashed rgba(120,130,150,.5);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:#8892a6;font-family:system-ui;pointer-events:none;}
  #faceL{left:22px;top:22px;width:150px;height:150px;}
  #faceR{right:26px;bottom:22px;width:150px;height:150px;}
  body.obs{background:#00B140;padding:0;}
  body.obs h1.pg,body.obs .hint,body.obs .ctrl{display:none;}
  body.obs .stage-outer{width:100vw;height:100vh;border-radius:0;display:flex;align-items:center;justify-content:center;background:#00B140;}
  body.obs #stage{max-width:none;}
  body.obs .facehint{display:none;}
  .ctrl{display:flex;gap:9px;align-items:center;font-family:system-ui;flex-wrap:wrap;justify-content:center;}
  .ctrl button{border:none;border-radius:9px;padding:10px 18px;font-size:13px;font-weight:800;cursor:pointer;}
  .play{background:#3B82F6;color:#fff;}.nav{background:#3a4657;color:#e7ecf3;}
  .pageinfo{font-size:12px;color:#9aa6b8;}
</style>
</head>

<script>
  var SPD=1;
  function wait(ms){return new Promise(function(r){setTimeout(r,ms/SPD);});}
  function on(id){var e=document.getElementById(id); if(e)e.classList.add('on');}
  function go(id){var e=document.getElementById(id); if(e)e.classList.add('go');}
  function clearAll(){
    ['fh','c1','c2','c3','c4','ex'].forEach(function(id){var e=document.getElementById(id);if(e)e.classList.remove('on');});
    ['hlbox'].forEach(function(id){var e=document.getElementById(id);if(e)e.classList.remove('on');});
    ['ul1','ul2'].forEach(function(id){var e=document.getElementById(id);if(e)e.classList.remove('go');});
    document.getElementById('exln').textContent='';
  }
  function typeLine(id,text,cps){
    return new Promise(function(res){
      var el=document.getElementById(id); el.textContent='';
      var i=0, d=1000/(cps||13)/SPD;
      (function step(){ if(i>=text.length){res();return;} el.textContent=text.slice(0,i+1); i++; setTimeout(step,d); })();
    });
  }
  // 정리줄 밑줄 좌표 계산 (노트 이미지 실제 렌더 크기 기준 %)
  function placeUnderlines(){
    var img=document.getElementById('noteimg');
    var col=img.parentElement;
    var iw=img.clientWidth, ih=img.clientHeight;
    var ox=img.offsetLeft, oy=img.offsetTop;
    // 정리 영역: 노트 세로 66%~84% 사이 두 줄 (필기 좌표 기준 근사)
    // 줄1: "각각 한자리 혹은 두자리씩 옮겨" (약 y74%) / 줄2: "계산한다"(약 y82%)
    function set(id, xp, yp, wp){
      var e=document.getElementById(id);
      e.style.left=(ox+iw*xp)+'px';
      e.style.top=(oy+ih*yp)+'px';
      e.style.width=(iw*wp)+'px';
    }
    // 각각 한자리 혹은 두자리씩 옮겨 = y55% / 계산한다 = y60%
    set('ul1', 0.24, 0.573, 0.62);
    set('ul2', 0.26, 0.628, 0.18);
    // 강조박스: 정리 동그라미(y50%)~계산한다(y62%)
    var hb=document.getElementById('hlbox');
    hb.style.left=(ox+iw*0.05)+'px';
    hb.style.top=(oy+ih*0.500)+'px';
    hb.style.width=(iw*0.90)+'px';
    hb.style.height=(ih*0.150)+'px';
  }
  var timers=[];
  function clearTimers(){timers.forEach(clearTimeout);timers=[];}
  // 대본 누적초(절대시각) 기반 스케줄. 단위 초.
  function at(sec, fn){ timers.push(setTimeout(fn, (sec*1000)/SPD)); }
  async function playAll(){
    clearTimers(); clearAll(); placeUnderlines();
    // 0.0s "소수의 나눗셈 공부를 했더라구요" (2.07)
    at(0.2,  function(){on('fh');});
    at(0.5,  function(){on('c1');});
    // 2.57s "딱 두가지만 고치면 좋을거 같에" (2.13)
    at(2.57, function(){on('c2');});
    // 5.77s "우리 각각 옮긴다라고 적었는데" (2.53) → ①문구 앞부분 + 강조박스
    at(5.77, function(){document.getElementById('hlbox').classList.add('on'); on('c3');});
    // 8.30s "앞에 수랑 뒤에 수를 똑같이 옮겨야해" (2.50) → 밑줄
    at(8.30, function(){go('ul1');});
    at(8.70, function(){go('ul2');});
    // 11.30s "잘 체크해주고" (2.51) — 강조 유지(추가 동작 없음)
    // 14.11s "그다음에 밑에 예시 한 줄 적어주면 좋을거 같에" (3.17) → ②문구
    at(14.11, function(){on('c4');});
    // 17.28s "사실 개념설명 잘돼있어도 예시 없으면... 노트에 예시 적어봅시다" (12.54)
    //   → 예시 카드 천천히 등장(텍스트 안 늘림). 음성이 메인.
    at(17.28, function(){on('ex');});
    // 30.22s "3.24 나누기 1.2는" (2.59)
    at(30.22, function(){typeLine('exln','3.24 ÷ 1.2', 11);});
    // 32.81s "324 나누기 120은 2.7" (4.58)
    at(32.81, function(){typeLine('exln','3.24 ÷ 1.2 = 324 ÷ 120 = 2.7', 12);});
    // 총 ~37.4s
  }
  document.getElementById('play').onclick=playAll;
  document.getElementById('reset').onclick=function(){clearTimers();clearAll();};
  document.getElementById('obsBtn').onclick=function(){document.body.classList.add('obs');setTimeout(function(){placeUnderlines();playAll();},500);};
