<style>
  :root{--navy:#0b1730;--ink:#16223d;--blue:#2E5BFF;--teal:#0E9C8A;--gray:#6b7a94;--gray2:#9aa8c0;--line:#e7edf7;--bg:#eaeef6;--card:#fff;--soft:#f4f7fd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}

  .hero{position:relative;background:linear-gradient(120deg,#0a1631,#16294f 55%,#243a66);border-radius:20px;padding:30px 32px;overflow:hidden;box-shadow:0 18px 44px rgba(11,23,48,.4)}

  .hero .pill{position:absolute;top:26px;right:28px;font-size:11.5px;font-weight:800;color:#cfe0ff;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);padding:6px 13px;border-radius:100px}
  .list{margin-top:18px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:14px;padding:18px 22px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
  .row:hover{transform:translateX(4px);box-shadow:0 8px 22px rgba(20,40,80,.1)}
  .row .dnum{font-size:15px;font-weight:900;color:var(--teal);min-width:96px;letter-spacing:-.5px}
  .row .dinfo{flex:1}
  .row .dt{font-size:16px;font-weight:800;color:var(--navy);letter-spacing:-.4px}
  .row .ds{font-size:12.5px;color:var(--gray);margin-top:2px}

<script>
/* [파운더 전용] 파운더 아니면 차단 */
(function(){
  var ALLOW=['032100jesus@gmail.com','crocdeucation@gmail.com'];
  function block(email){
    document.body.style.overflow='hidden';
    var w=document.querySelector('.wrap'); if(w) w.style.display='none';
    var ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;z-index:99999;background:#0b1730;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:Pretendard,system-ui,sans-serif;padding:24px;text-align:center';
    ov.innerHTML='<div style="font-size:40px">🔒</div><div style="font-size:20px;font-weight:900;color:#fff">파운더님 전용 문서입니다</div><div style="font-size:14px;color:#9aa8c0;max-width:340px;line-height:1.6">오동근 파운더님만 열람하실 수 있습니다.'+(email?'<br><span style="font-size:12px;color:#68789a">현재 로그인: '+email+'</span>':'')+'</div>';
    document.body.appendChild(ov);
  }
  function check(){
    try{
      if(typeof firebase==='undefined'||!firebase.auth){ setTimeout(check,300); return; }
      firebase.auth().onAuthStateChanged(function(u){
        if(!u) return;
        if(ALLOW.indexOf((u.email||'').toLowerCase())<0){ block(u.email); }
      });
    }catch(e){ setTimeout(check,300); }
  }
  check();
})();
</script>
