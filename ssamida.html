<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="UTF-8"><style id="__pregate">body{visibility:hidden!important}#agate{visibility:visible!important}</style><script>try{if(window.self!==window.top){var e=document.getElementById("__pregate");if(e)e.remove();}}catch(_){}</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>window.GATE_CFG={title:'경영진 전용 · 쌤이다 프로젝트 현황',sub:'등록된 경영진 계정으로만 열람할 수 있습니다.<br>Google 계정으로 로그인해 주세요.',foot:'문의 · 신상준 이사'}</script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="../gate.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<title>쌤이다 프로젝트 현황</title>
<style>
  :root{
    --navy:#0b1730;--ink:#16223d;--blue:#2E5BFF;--teal:#0E9C8A;--green:#0F9D6E;--orange:#E8850C;--purple:#6D5AE6;--red:#E5533D;
    --gray:#64748b;--gray2:#9aa8c0;--line:#e7edf7;--bg:#eef2f9;--card:#fff;--soft:#f5f8ff;
    box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)
  }
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#060d1e;--ink:#dde5f5;--gray:#8c9bb8;--gray2:#68789a;--line:#1f2a42;--bg:#0a0f1c;--card:#131a2b;--soft:#0f1626}}
  :root[data-theme="dark"]{--navy:#060d1e;--ink:#dde5f5;--gray:#8c9bb8;--gray2:#68789a;--line:#1f2a42;--bg:#0a0f1c;--card:#131a2b;--soft:#0f1626}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Pretendard',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;letter-spacing:-.2px}
  .wrap{max-width:1280px;margin:0 auto;padding:22px 16px 70px}
  .hero{position:relative;background:linear-gradient(120deg,#4C6EF5,#7048E8);border-radius:18px;padding:26px 30px;overflow:hidden;box-shadow:0 16px 40px rgba(76,110,245,.28)}
  .hero::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:40px 40px}
  .hero .tag{position:relative;font-size:11px;font-weight:800;letter-spacing:3px;color:#d6dcff}
  .hero h1{position:relative;font-size:30px;font-weight:900;color:#fff;letter-spacing:-1.5px;margin:6px 0 4px;line-height:1}
  .hero .meta{position:relative;font-size:13px;color:#dfe4ff}
  .hero .pill{position:absolute;top:24px;right:26px;font-size:11px;font-weight:800;color:#eef0ff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);padding:5px 12px;border-radius:100px}
  .kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
  @media(max-width:640px){.kpi{grid-template-columns:1fr 1fr}}
  .kpi>div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 18px}
  .kpi .l{font-size:12px;color:var(--gray);font-weight:600}
  .kpi .n{font-size:26px;font-weight:900;letter-spacing:-1px;margin-top:3px}
  .kpi .n span{font-size:14px;font-weight:700;color:var(--gray)}
  .kd .n{color:var(--green)}.kp .n{color:var(--blue)}.kw .n{color:var(--orange)}.kh .n{color:var(--purple)}
  .teams{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:900px){.teams{grid-template-columns:1fr}}
  .team{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;box-shadow:0 3px 14px rgba(20,40,80,.05)}
  .thd{display:flex;align-items:center;gap:12px;padding-bottom:12px;border-bottom:2px solid var(--line);margin-bottom:6px}
  .thd .ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;background:var(--soft)}
  .thd .tn{font-size:17px;font-weight:900;color:var(--navy);letter-spacing:-.5px}
  .thd .to{font-size:12px;color:var(--gray);margin-top:1px}
  .thd .cnt{margin-left:auto;font-size:11.5px;color:var(--gray2);font-weight:700;text-align:right}
  .grp{margin-top:12px}
  .grp-lb{font-size:11px;font-weight:800;color:var(--gray2);letter-spacing:.5px;margin:4px 0 6px}
  .task{padding:9px 0;border-bottom:1px solid var(--line)}
  .task:last-child{border-bottom:none}
  .task .tr{display:flex;align-items:flex-start;gap:9px}
  .st{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px;white-space:nowrap;flex:none;margin-top:1px}
  .st.done{background:#E5F6EF;color:var(--green)}.st.doing{background:#EAF0FF;color:var(--blue)}.st.plan{background:#F0F2F7;color:#8a97ad}.st.talk{background:#FDF1E2;color:var(--orange)}.st.check{background:#EDEAFC;color:var(--purple)}
  .task .tt{font-size:14px;font-weight:800;color:var(--navy);flex:1}
  .task .tt .co{font-size:10.5px;font-weight:700;color:var(--orange);background:#FFF3C4;padding:1px 7px;border-radius:5px;margin-left:6px}
  .task .pv{font-size:11px;font-weight:800;color:var(--gray2);flex:none}
  .task .ds{font-size:12px;color:var(--gray);margin:3px 0 0 0;padding-left:0;line-height:1.5}
  .task .lg{font-size:11px;color:var(--teal);margin-top:4px;font-weight:600}
  .task .cm{font-size:11px;color:var(--purple);margin-top:3px;background:var(--soft);padding:4px 8px;border-radius:6px}
  .pbar{height:5px;background:var(--soft);border-radius:100px;overflow:hidden;margin-top:5px}
  .pfill{height:100%;border-radius:100px}
  .f-done{background:var(--green)}.f-doing{background:var(--blue)}.f-plan{background:var(--gray2)}.f-talk{background:var(--orange)}.f-check{background:var(--purple)}
  .loading{text-align:center;padding:60px 20px;color:var(--gray)}
  .docsec{margin-top:26px}
  .docsec-hd{font-size:14px;font-weight:800;color:var(--gray);display:flex;align-items:center;gap:9px;margin-bottom:11px}
  .docsec-lock{font-size:10.5px;font-weight:700;color:#8A6D0F;background:#faf3df;border:1px solid #ecd9a3;border-radius:20px;padding:3px 9px;letter-spacing:-.2px}
  .docsec-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:13px;padding:17px 19px;text-decoration:none;color:inherit;transition:.14s}
  .docsec-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(15,22,35,.08)}
  .dc-ic{flex:none;width:40px;height:40px;border-radius:11px;background:#eaf0fe;color:#3B5BDB;display:flex;align-items:center;justify-content:center;font-size:20px}
  .dc-body{flex:1;min-width:0}
  .dc-tt{font-size:14.5px;font-weight:800;letter-spacing:-.3px;color:var(--navy);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .dc-cnt{font-size:10px;font-weight:800;color:#fff;background:var(--blue);border-radius:5px;padding:2px 6px}
  .dc-ds{font-size:12.5px;color:var(--gray);margin-top:4px;line-height:1.5}
  .dc-note{font-size:11px;color:var(--gray2);margin-top:5px;font-weight:500}
  .dc-arrow{flex:none;color:var(--gray2);font-size:18px;transition:.14s}
  .docsec-card:hover .dc-arrow{color:#3B5BDB;transform:translateX(2px)}
  .foot{text-align:center;font-size:12.5px;color:var(--gray2);margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}
  .updated{font-size:11px;color:var(--gray2);text-align:right;margin-top:8px}
</style></head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="pill">🔒 경영진 전용</div>
    <div class="tag">SSAMIDA · PROJECT STATUS</div>
    <h1>쌤이다 프로젝트 현황</h1>
    <div class="meta">파운더님 지시 · 전 영역 10/10~12 오픈 목표로 총력 대응</div>
  </div>

  <div class="kpi" id="kpi">
    <div class="kd"><div class="l">완료</div><div class="n" id="kDone">-<span>건</span></div></div>
    <div class="kp"><div class="l">진행중</div><div class="n" id="kDoing">-<span>건</span></div></div>
    <div class="kw"><div class="l">예정·논의</div><div class="n" id="kPlan">-<span>건</span></div></div>
    <div class="kh"><div class="l">참여 인원</div><div class="n" id="kPpl">-<span>명</span></div></div>
  </div>

  <div class="teams" id="teams">
    <div class="loading">데이터 불러오는 중…</div>
  </div>
  <div class="updated" id="updated"></div>
  <div class="docsec">
    <div class="docsec-hd">📎 설계 · 기획 문서 <span class="docsec-lock">🔒 경영진 전용</span></div>
    <a class="docsec-card" href="https://drive.google.com/drive/folders/1KpFnQUkVEuOAVYaTitwStNJ-evLeSkhv?usp=drive_link" target="_blank" rel="noopener">
      <div class="dc-ic">📁</div>
      <div class="dc-body">
        <div class="dc-tt">쌤이다 설계 문서 모음 <span class="dc-cnt">4건</span></div>
        <div class="dc-ds">강사 정산 설계서 · 정산 실제화면 · 계약/약관 분석 · 화면/채널 설계서</div>
        <div class="dc-note">엄현호 이사 기획 · 대외비 드라이브 폴더 (등록 경영진만 열람)</div>
      </div>
      <div class="dc-arrow">→</div>
    </a>
  </div>
  <div class="foot">아라온스쿨 · 그로스 &nbsp;|&nbsp; 문의 · 신상준 이사</div>
</div>

<script>
(function(){
  // 팀별 아이콘·색
  var TEAM_META={
    '브랜딩':{ic:'🎨',name:'브랜딩 · 프론트엔드'},
    '시스템':{ic:'⚙️',name:'시스템 · 백엔드'},
    '강사플랫폼':{ic:'👨‍🏫',name:'강사 플랫폼'},
    '콘텐츠':{ic:'🚀',name:'콘텐츠 · 마케팅 · 그로스'}
  };
  var TEAM_ORDER=['브랜딩','시스템','강사플랫폼','콘텐츠'];
  // 상태 → 배지 클래스 + 그룹
  function stClass(s){
    if(/완료/.test(s)) return 'done';
    if(/진행/.test(s)) return 'doing';
    if(/협의/.test(s)) return 'talk';
    if(/심사/.test(s)) return 'check';
    return 'plan';
  }
  function stGroup(s){
    if(/완료/.test(s)) return '완료';
    if(/진행/.test(s)) return '진행중';
    return '예정·논의';
  }
  var GROUP_ORDER=['완료','진행중','예정·논의'];

  function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function render(rows){
    if(!rows||!rows.length){ document.getElementById('teams').innerHTML='<div class="loading">데이터가 없습니다.</div>'; return; }
    // 헤더 파싱 — 컬럼명으로 인덱스 찾기 (순서 바뀌어도 대응)
    var H=rows[0].map(function(x){return String(x||'').trim();});
    function ci(names){ for(var n=0;n<names.length;n++){ for(var i=0;i<H.length;i++){ if(H[i].replace(/\s/g,'').indexOf(names[n])>=0) return i; } } return -1; }
    var iTeam=ci(['팀']), iOwner=ci(['담당자']), iCollab=ci(['협업자','협업']), iTask=ci(['과제']),
        iStat=ci(['상태']), iProg=ci(['진행률','진행']), iDesc=ci(['설명']),
        iLog=ci(['진척로그','진척']), iCmt=ci(['코멘트']), iDue=ci(['마감']), iPri=ci(['우선']);

    var data=rows.slice(1).filter(function(r){ return (r[iTeam]||'').trim() && (r[iTask]||'').trim(); });

    // KPI 집계
    var done=0,doing=0,plan=0, ppl={};
    data.forEach(function(r){
      var g=stGroup((r[iStat]||''));
      if(g==='완료')done++; else if(g==='진행중')doing++; else plan++;
      var o=(r[iOwner]||'').trim(); if(o){ o.split(/[·,\/]/).forEach(function(p){ p=p.trim(); if(p) ppl[p]=1; }); }
    });
    document.getElementById('kDone').innerHTML=done+'<span>건</span>';
    document.getElementById('kDoing').innerHTML=doing+'<span>건</span>';
    document.getElementById('kPlan').innerHTML=plan+'<span>건</span>';
    document.getElementById('kPpl').innerHTML=Object.keys(ppl).length+'<span>명</span>';

    // 팀별 그룹핑
    var byTeam={};
    data.forEach(function(r){ var t=(r[iTeam]||'').trim(); if(!byTeam[t])byTeam[t]=[]; byTeam[t].push(r); });

    var html='';
    TEAM_ORDER.forEach(function(tk){
      var list=byTeam[tk]; if(!list||!list.length) return;
      var meta=TEAM_META[tk]||{ic:'📁',name:tk};
      var owner=(list[0][iOwner]||'').trim();
      // 상태 카운트
      var c={done:0,doing:0,plan:0};
      list.forEach(function(r){ var g=stGroup(r[iStat]||''); if(g==='완료')c.done++; else if(g==='진행중')c.doing++; else c.plan++; });
      html+='<div class="team"><div class="thd"><div class="ic">'+meta.ic+'</div><div><div class="tn">'+esc(meta.name)+'</div><div class="to">'+esc(owner)+'</div></div><div class="cnt">'+c.done+' 완료 · '+c.doing+' 진행 · '+c.plan+' 예정</div></div>';
      // 그룹별
      GROUP_ORDER.forEach(function(grp){
        var items=list.filter(function(r){ return stGroup(r[iStat]||'')===grp; });
        if(!items.length) return;
        html+='<div class="grp"><div class="grp-lb">'+grp+'</div>';
        items.forEach(function(r){
          var st=(r[iStat]||'').trim(), cls=stClass(st);
          var prog=iProg>=0?parseInt(r[iProg],10):NaN;
          var collab=iCollab>=0?(r[iCollab]||'').trim():'';
          var desc=iDesc>=0?(r[iDesc]||'').trim():'';
          var log=iLog>=0?(r[iLog]||'').trim():'';
          var cmt=iCmt>=0?(r[iCmt]||'').trim():'';
          var due=iDue>=0?(r[iDue]||'').trim():'';
          html+='<div class="task"><div class="tr"><span class="st '+cls+'">'+esc(st)+'</span><div class="tt">'+esc(r[iTask])
            +(collab?'<span class="co">+'+esc(collab)+'</span>':'')+(due?' <span style="font-size:11px;color:#E5533D">~'+esc(due)+'</span>':'')+'</div>'
            +(!isNaN(prog)?'<span class="pv">'+prog+'%</span>':'')+'</div>';
          if(desc) html+='<div class="ds">'+esc(desc)+'</div>';
          if(!isNaN(prog)&&prog>0) html+='<div class="pbar"><div class="pfill f-'+cls+'" style="width:'+prog+'%"></div></div>';
          if(log) html+='<div class="lg">📌 '+esc(log)+'</div>';
          if(cmt) html+='<div class="cm">💬 '+esc(cmt)+'</div>';
          html+='</div>';
        });
        html+='</div>';
      });
      html+='</div>';
    });
    document.getElementById('teams').innerHTML=html||'<div class="loading">표시할 과제가 없습니다.</div>';
  }

  function load(){
    try{
      if(typeof firebase==='undefined'||!firebase.firestore){ setTimeout(load,400); return; }
      var db=firebase.firestore();
      db.collection('execData').doc('ssamida-status').get().then(function(d){
        if(!d.exists){ document.getElementById('teams').innerHTML='<div class="loading">아직 데이터가 없습니다. (saveSsamidaStatus 실행 필요)</div>'; return; }
        var obj=JSON.parse(d.data().json||'{}');
        render(obj.rows||[]);
        if(d.data().updated) document.getElementById('updated').textContent='업데이트: '+d.data().updated;
      }).catch(function(e){
        document.getElementById('teams').innerHTML='<div class="loading">불러오기 실패: 권한을 확인해주세요.</div>';
      });
    }catch(e){ setTimeout(load,400); }
  }
  load();
})();
</script>
</body></html>
