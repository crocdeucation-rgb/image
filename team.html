<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>그로스 스테이터스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#eef0f4; --card:#ffffff; --line:#e8eaef; --ink:#1a1d24; --sub:#8b93a2;
  --blue:#1a73e8; --green:#0f9d58; --purple:#9333ea; --amber:#f4b400; --red:#e11d48;
  --cyan:#0891b2; --shadow:0 1px 2px rgba(20,25,40,.04),0 4px 16px rgba(20,25,40,.05);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Pretendard',-apple-system,system-ui,sans-serif}
body{background:var(--bg);color:var(--ink);padding:14px 16px;font-feature-settings:"tnum"}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.top h1{font-size:19px;font-weight:800;letter-spacing:-.03em}
.top .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(15,157,88,.15)}
.top .upd{font-size:11.5px;color:var(--sub)}
.top .rf{margin-left:auto;font-size:12px;padding:6px 13px;border:1px solid var(--line);border-radius:9px;background:var(--card);cursor:pointer;color:#5a6272;font-weight:600}
.top .rf:hover{border-color:#cdd2db}

/* 모바일 전용 섹션 탭 (PC에서는 숨김 · 3단 그리드 유지) */
.sec-nav{display:none;justify-content:center;gap:6px;margin-bottom:12px}
.sec-nav-btn{font-size:12px;font-weight:700;padding:6px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:#7a828f;cursor:pointer;letter-spacing:-.01em}
.sec-nav-btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}

.board{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(0,1fr) minmax(0,.74fr);gap:14px;height:calc(100vh - 62px)}
.colwrap{display:flex;flex-direction:column;gap:12px;min-height:0}
.mid{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;min-height:0}
@media (min-width:1241px){
  .sec-nav{display:none}
  .colwrap.sec{display:flex!important}
  .mid.sec{display:grid!important}
}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;gap:8px;padding:11px 15px 10px;border-bottom:1px solid var(--line)}
.ch .t{font-size:13px;font-weight:800;letter-spacing:-.02em}
.ch .cnt{font-size:11px;font-weight:800;color:#fff;border-radius:20px;padding:1px 8px;min-width:20px;text-align:center}
.ch .sp{margin-left:auto}
.ch .tabs{display:flex;gap:4px}
.tab{font-size:11px;padding:3px 9px;border-radius:14px;border:1px solid var(--line);background:#fff;color:#7a828f;cursor:pointer;font-weight:600}
.tab.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pad{padding:12px 14px}
.scroll{overflow-y:auto;min-height:0}
.scroll::-webkit-scrollbar{width:7px} .scroll::-webkit-scrollbar-thumb{background:#d5d9e0;border-radius:4px}

.sales{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 14px}
.sc{background:#fafbfc;border:1px solid var(--line);border-radius:11px;padding:9px 10px;text-align:center}
.sc .l{font-size:10px;color:var(--sub);margin-bottom:3px} .sc .l b{color:#b8bec9;font-weight:700;margin-left:2px}
.sc .v{font-size:15px;font-weight:800;letter-spacing:-.02em}
.sc.now .v{color:var(--purple)}

.pfwrap{overflow:auto}
.pf{width:100%;border-collapse:collapse;font-size:11.5px;white-space:nowrap}
.pf th{position:sticky;top:0;background:#f5f7fb;color:#5b6472;font-weight:700;font-size:10.5px;padding:7px 6px;text-align:center;border-bottom:1px solid var(--line)}
.pf td{padding:7px 6px;text-align:center;border-bottom:1px solid #f4f5f8}
.pf tr:last-child td{border-bottom:none}
.pf tr.tot{background:#fafbfd;font-weight:800} .pf tr.tot td{border-top:1.5px solid var(--line)}
.pf td.nm{text-align:left;font-weight:800;color:#3c434f;padding-left:12px}
.pf .db{color:var(--blue);font-weight:700} .pf .vs{color:var(--amber);font-weight:700} .pf .se{color:#2563eb;font-weight:700}
.pf .ca{color:var(--red);font-weight:700} .pf .od{color:var(--green);font-weight:700} .pf .sl{color:var(--purple);font-weight:800}
.pf .rt{color:#9aa1ad;font-size:10.5px} .pf .ro{color:var(--green);font-weight:800} .pf .ef{color:var(--purple);font-weight:700}

.heat{width:100%;border-collapse:collapse;font-size:10.5px}
.heat th{color:#8b93a2;font-weight:700;font-size:9px;padding:4px 2px;text-align:center;white-space:nowrap}
.heat th.l,.heat td.l{text-align:left;font-weight:800;color:#4a515d;padding-left:12px;white-space:nowrap}
.heat td{text-align:center;padding:1.5px}
.heat .cell{display:block;padding:5px 1px;border-radius:5px;font-weight:800;min-width:20px}

.hl{display:flex;flex-direction:column}
.hlrow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid #f4f5f8}
.hlrow:last-child{border-bottom:none}
.hlrow .ic{font-size:16px;width:20px;text-align:center}
.hlrow .lb{font-size:11px;color:var(--sub);width:64px;flex:0 0 auto;font-weight:600}
.hlrow .nm{font-size:14px;font-weight:800;letter-spacing:-.02em}
.hlrow .vl{margin-left:auto;font-size:12.5px;font-weight:800;color:var(--purple);white-space:nowrap}
.hlrow.warn{background:#fffaf5} .hlrow.warn .vl{color:#e65100}
.hlrow.hold{background:#f6f9ff} .hlrow.hold .vl{color:var(--blue)}
.hlrow .no{font-size:9px;color:#a7aeba;margin-left:6px}

.grp{padding:8px 0}
.glabel{display:flex;align-items:center;gap:7px;padding:4px 14px 7px;font-size:11.5px;font-weight:800;color:#5b6472}
.glabel .gc{font-size:10px;font-weight:800;color:#fff;border-radius:20px;padding:0 7px}
.item{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:12.5px}
.item+.item{border-top:1px solid #f6f7f9}
.item .when{font-size:11px;font-weight:700;color:var(--blue);min-width:58px;flex:0 0 auto}
.item .tm{font-size:11px;color:var(--green);min-width:38px;flex:0 0 auto}
.item a.nm{font-weight:700;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.item a.nm:hover{text-decoration:underline;color:var(--blue)}
.item .gr{font-size:10px;color:#a7aeba}
.item .badge{font-size:9.5px;color:#64748b;background:#f1f3f7;border-radius:7px;padding:1px 7px}
.item .as{font-size:9.5px;color:#fff;background:#98a0ad;border-radius:20px;padding:1px 7px;margin-left:auto;flex:0 0 auto;white-space:nowrap}
.item .mn{font-size:10px;color:#c084fc;font-weight:700}
.chk{width:16px;height:16px;flex:0 0 auto;cursor:pointer;accent-color:var(--purple)}
.item.done a.nm,.item.done .gr,.item.done .when{text-decoration:line-through;color:#c2c7d0}
.item.done .as{opacity:.45}
.item.today{background:#fffdf4}
.item.today .when{color:#e65100;font-weight:800}
.empty{padding:16px 14px;text-align:center;color:#b5bac4;font-size:11.5px}

.as.hye{background:var(--green)} .as.kim{background:var(--blue)} .as.jang{background:#f97316} .as.park{background:var(--purple)} .as.ahn{background:#4338ca}
.as.woo{background:var(--red)} .as.tae{background:var(--cyan)} .as.sung{background:#7c3aed} .as.noh{background:#0d9488} .as.won{background:#b45309}

/* 근무 스테이터스 (홀딩 자리 대체) */
.wk{width:100%;border-collapse:collapse;font-size:12px}
.wk th{background:#f7f8fb;color:#6b7280;font-weight:700;font-size:9.5px;padding:6px 3px;text-align:center}
.wk th.l{text-align:left;padding-left:14px}
.wk td{padding:5px 3px;text-align:center;border-bottom:1px solid #f4f5f8}
.wk td.nm{text-align:left;padding-left:14px;white-space:nowrap;font-weight:800}
.wk tr:last-child td{border-bottom:none}
.sw{position:relative;display:inline-block;width:42px;height:23px;cursor:pointer;vertical-align:middle}
.sw input{opacity:0;width:0;height:0}
.sw .sl2{position:absolute;inset:0;background:#cfd4dd;border-radius:23px;transition:.18s}
.sw .sl2:before{content:"";position:absolute;height:17px;width:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw input:checked + .sl2{background:var(--green)}
.sw input:checked + .sl2:before{transform:translateX(19px)}
.sw.busy .sl2{background:#e11d48}
.dchip{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;border:1.5px solid #dfe3ea;background:#fff;color:#aeb4bf;font-size:10.5px;font-weight:800;cursor:pointer;transition:.12s;user-select:none}
.dchip.off{background:#fdecef;border-color:#f3b6c1;color:#d11846}
.dchip.past{opacity:.32;cursor:default}
.wk-note{font-size:10px;color:#9aa1ad;padding:7px 14px 2px}
.wk-note b{color:#e11d48}
/* [2026-08-21] 모바일 오버라이드 — 원본 뒤로 이동(소스순서 우선 확보) */
@media (max-width:1240px){
  .board{grid-template-columns:minmax(0,1fr);height:auto}
  .colwrap,.mid{min-height:0}
  .sec-nav{display:flex}
  .sec{display:none}
  .colwrap.sec.on{display:flex}   /* .colwrap은 flex 컨테이너 */
  .mid.sec.on{display:grid}       /* .mid는 grid 컨테이너 */

  /* 성과 탭: 소재 히트맵 폰트/여백 축소 */
  .heat{font-size:9.5px}
  .heat th{font-size:8.5px;padding:3px 1px}
  .heat td{padding:1px}
  .heat th.l,.heat td.l{padding-left:8px}
  .heat .cell{min-width:17px;padding:4px 1px}

  /* [2026-08-21] 모바일 개선 — PC 영향 없음 (1240px 이하만) */
  /* ① 제목·새로고침 한 줄 유지 (쪼개짐 방지) */
  .top{flex-wrap:nowrap;gap:8px}
  .top h1{font-size:15px;white-space:nowrap;flex-shrink:0}
  .top .upd{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .top .rf{font-size:11px;padding:5px 10px;white-space:nowrap;flex-shrink:0}
  /* ② [2026-08-21 개정] 담당자 성과표 → 카드 2열 (가로스크롤 폐지, 핵심 7지표만) */
  .pfwrap{min-width:0;overflow-x:hidden}
  .pf{display:block;width:100%;min-width:0;font-size:12px;white-space:normal}
  .pf thead{display:none}
  .pf tbody{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:start}
  .pf tr{display:block;min-width:0;overflow:hidden;white-space:normal;background:#fff;border:1px solid #eef0f3;border-radius:10px;padding:9px 11px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .pf tr.tot{grid-column:1/-1;background:#f6f8ff;border-color:#e3e9f7}
  .pf td{border:none}
  .pf td.ca,.pf td.rt{display:none}            /* 방취·방취율·오더율 모바일 숨김 (PC 표엔 유지) */
  .pf td.nm{display:block;width:100%;font-size:13px;font-weight:800;padding:0 0 6px;margin-bottom:6px;border-bottom:1px solid #f0f2f5;text-align:left}
  .pf td.db,.pf td.vs,.pf td.se,.pf td.od,.pf td.ro,.pf td.ef{display:inline-block;width:48%;padding:3px 1px;vertical-align:top;text-align:left}
  .pf td.sl{display:block;width:100%;padding:5px 1px 2px;text-align:left;font-size:13px}
  .pf td.db::before,.pf td.vs::before,.pf td.se::before,.pf td.od::before,.pf td.sl::before,.pf td.ro::before,.pf td.ef::before{display:block;font-size:9px;color:#9aa2ae;font-weight:600;margin-bottom:1px}
  .pf td.db::before{content:'DB'}
  .pf td.vs::before{content:'방문'}
  .pf td.se::before{content:'세팅'}
  .pf td.od::before{content:'오더'}
  .pf td.sl::before{content:'매출'}
  .pf td.ro::before{content:'ROAS'}
  .pf td.ef::before{content:'효율'}
  /* 매출 요약 카드도 2열 (우측 잘림 방지) */
  .sales{grid-template-columns:repeat(2,1fr)}
  .sales .sc .v{font-size:12.5px;letter-spacing:-.03em;line-height:1.25}
  /* 소재 히트맵만 가로 스크롤 유지 (매트릭스라 카드화 부적합) */
  #heat-wrap{min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .heat{min-width:600px}
  /* 스크롤 힌트 — 오른쪽 그라데이션으로 "더 있음" 표시 */
  .pfwrap, #heat-wrap{position:relative}
  /* ③ 결번왕 등 이름 쪼개짐 방지 */
  .hlrow .nm{white-space:nowrap;flex-shrink:0}
  .hlrow .no{font-size:8.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
}

</style>
</head>
<body>
<div class="top">
  <span class="dot"></span>
  <h1>그로스 스테이터스</h1>
  <span class="upd" id="upd">불러오는 중...</span>
  <button class="rf" onclick="loadAll()">새로고침</button>
</div>

<!-- 모바일 전용 섹션 탭 (1240px 이하에서만 표시) -->
<div class="sec-nav">
  <button class="sec-nav-btn on" onclick="showSec(0)">성과</button>
  <button class="sec-nav-btn" onclick="showSec(1)">팀현황</button>
  <button class="sec-nav-btn" onclick="showSec(2)">방문</button>
</div>

<div class="board">
  <!-- 좌: 담당자 퍼널 -->
  <div class="colwrap sec on">
    <div class="card">
      <div class="ch"><span class="t">매출</span><span class="badge sp">결제일 기준</span></div>
      <div class="sales">
        <div class="sc now"><div class="l">이번 달<b id="dn-m"></b></div><div class="v" id="s-m">-</div></div>
        <div class="sc"><div class="l">지난 달</div><div class="v" id="s-lm">-</div></div>
        <div class="sc now"><div class="l">이번 주<b id="dn-w"></b></div><div class="v" id="s-w">-</div></div>
        <div class="sc"><div class="l">지난 주</div><div class="v" id="s-lw">-</div></div>
      </div>
    </div>

    <div class="card colwrap" style="flex:1;min-height:0;gap:0">
      <div class="ch">
        <span class="t">담당자별 성과분석</span>
        <span class="tabs sp" id="pf-tabs">
          <span class="tab on" onclick="setPerfTab(0)">이번달</span>
          <span class="tab" onclick="setPerfTab(1)">지난달</span>
          <span class="tab" onclick="setPerfTab(2)">전체</span>
        </span>
      </div>
      <div class="pfwrap scroll" style="flex:1">
        <table class="pf">
          <thead><tr><th>담당자</th><th>DB</th><th>방문</th><th>세팅</th><th>방취</th><th>오더</th><th>매출</th><th>방취율</th><th>오더율</th><th>ROAS</th><th>효율</th></tr></thead>
          <tbody id="pf-body"><tr><td colspan="11" class="empty">불러오는 중...</td></tr></tbody>
        </table>
        <div style="padding:10px 12px 4px;font-size:11px;font-weight:800;color:#5b6472">담당자 × 소재 배정</div>
        <div id="heat-wrap"><div class="empty">불러오는 중...</div></div>
      </div>
    </div>
  </div>

  <!-- 가운데: 상 팀성과 / 하 챙길리드(+근무 스테이터스) -->
  <div class="mid sec">
    <div class="card">
      <div class="ch"><span class="t">🔥 이번주 팀 성과</span><span class="badge sp">이번주</span></div>
      <div class="hl" id="hl"></div>
    </div>
    <div class="card colwrap" style="min-height:0;gap:0">
      <div class="ch"><span class="t">📋 지금 챙길 리드</span><span class="badge sp">실시간</span></div>
      <div class="scroll" id="situation" style="flex:1"><div class="empty">불러오는 중...</div></div>
    </div>
    <div class="card">
      <div class="ch"><span class="t">🟢 근무 스테이터스</span><span class="badge sp">직접 체크</span></div>
      <div style="padding:0 4px 4px;overflow-x:auto">
        <table class="wk"><thead><tr><th class="l">담당자</th><th>가능</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th></tr></thead><tbody id="wk-body"></tbody></table>
      </div>
      <div class="wk-note">오늘 못 나오면 <b>가능 OFF</b> · 이번 주 안 되는 날은 <b>요일</b>을 눌러 표시 (지난 요일은 자동 무시 · 토요일 밤 초기화)</div>
    </div>
  </div>

  <!-- 우: 방문 목록 -->
  <div class="colwrap sec">
    <div class="card colwrap" style="flex:1;min-height:0;gap:0">
      <div class="ch"><span class="t">📅 방문 목록</span><span class="cnt sp" id="c-visit" style="background:var(--amber)">0</span></div>
      <div class="scroll" id="visit" style="flex:1"><div class="empty">불러오는 중...</div></div>
    </div>
  </div>
</div>

<script>
const SITUATION_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRCsXJM18PpCJdk7ajik__XSEB6lgOmahUdTeXT_bKqr52VadEMP_BnNLg0oDdpQA-slQ14TNSkfXxn/pub?gid=669050300&single=true&output=csv';
const SUMMARY_CSV_URL   = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRCsXJM18PpCJdk7ajik__XSEB6lgOmahUdTeXT_bKqr52VadEMP_BnNLg0oDdpQA-slQ14TNSkfXxn/pub?gid=1438610573&single=true&output=csv';
const SCHEDULE_CSV_URL  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRCsXJM18PpCJdk7ajik__XSEB6lgOmahUdTeXT_bKqr52VadEMP_BnNLg0oDdpQA-slQ14TNSkfXxn/pub?gid=1384080283&single=true&output=csv';
// ★ WORK_CSV_URL: '아라위키 자동화' 스프레드시트 → '근무상태' 탭 웹게시 CSV (2026-08-11 연결)
const WORK_CSV_URL      = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRp14Bg9QZsfrfO9bv63ZjHnM4OL5A-7-eiQX-J4hVku0W-qwKmTQT6vlVRp-vBGBM87wajO7Qe6Xs_/pub?gid=1370179906&single=true&output=csv';
const WEBAPP_URL        = 'https://script.google.com/macros/s/AKfycbxu_6qC9WKTtVcAJJtoh_EfmvUbyzbkZFlTRC7uUr_dFmUYehON0Vhb3HdAwrTnF37w/exec';

const MID_DAYS=4;
const ASSIGNEES=['우혜림','김윤호','장윤호','박창건','김태석','김성윤','노영호','김원득','김우진'];
const ASSIGNEE_START_IDX=46;
const SOJ_KEYS=['노트릴스','노필릴스','채리','GT','원톱','5단계루틴','기초부족','MLST공부','MLST캐러셀','노트공부법','너만본다','CPA(텐핑)','카카오','Organic','네이버브랜드','기타'];
const cmap={'우혜림':'hye','김윤호':'kim','장윤호':'jang','박창건':'park','김우진':'woo','김태석':'tae','김성윤':'sung','노영호':'noh','김원득':'won','안준섭':'ahn'};
const dayN=['일','월','화','수','목','금','토'];
const WDAYS=['월','화','수','목','금','토'];
let summaryRows=[], perfTab=0, workState={};

/* ── 모바일 섹션 탭 (1240px 이하에서만 동작 · PC는 CSS로 3단 유지) ── */
let currentSec=0;
function showSec(i){
  currentSec=i;
  document.querySelectorAll('.board > .sec').forEach((s,k)=>s.classList.toggle('on',k===i));
  document.querySelectorAll('.sec-nav-btn').forEach((b,k)=>b.classList.toggle('on',k===i));
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function asB(a){return a?'<span class="as '+(cmap[a]||'')+'">'+esc(a)+'</span>':''}
function nmL(n,p){p=(p||'').replace(/-/g,'');return p?'<a class="nm" href="https://notion.so/'+p+'" target="_blank" rel="noopener">'+esc(n)+'</a>':'<span class="nm">'+esc(n)+'</span>'}
function tMid(){var t=new Date();t.setHours(0,0,0,0);return t}
function vFmt(vd,vt){if(!vd)return{lab:'',diff:null};var d=new Date(vd+'T00:00:00');var df=Math.round((d-tMid())/86400000);return{lab:(d.getMonth()+1)+'/'+d.getDate()+' ('+dayN[d.getDay()]+')',diff:df,tm:vt||''}}
function pickDay(s){var m=String(s||'').match(/\((\d+일차)\)/);return m?m[1]:''}
async function csv(u){var t=await (await fetch(u)).text();return t.trim().split('\n').map(r=>r.split(',').map(c=>c.trim()))}

async function loadAll(){
  document.getElementById('upd').textContent='불러오는 중...';
  await Promise.all([loadSit(),loadSum(),loadVisit(),loadWork()]);
  document.getElementById('upd').textContent='업데이트 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});
}

/* ── 지금 챙길 리드 (중간관리·우선 / 홀딩 제거) + 근무 스테이터스 ── */
async function loadSit(){
  let rows;
  try{ rows=await csv(SITUATION_CSV_URL); rows.shift(); }
  catch(e){ document.getElementById('situation').innerHTML='<div class="empty">데이터를 불러오지 못했어요. GitHub(https)에서 열어야 표시됩니다.</div>'; return; }
  const L=rows.filter(r=>r[0]).map(r=>({pageId:r[0],name:r[1],grade:r[2],as:r[3],status:r[4],vd:r[5],vt:r[6],prio:r[7]==='1',mid:r[8]==='1'}));
  const mid=[];
  L.forEach(l=>{ const v=vFmt(l.vd,l.vt);
    if(v.diff!==null&&v.diff>=MID_DAYS) mid.push({l,v});
  });
  mid.sort((a,b)=>a.v.diff-b.v.diff);

  const midRow=({l,v})=>'<div class="item '+(l.mid?'done':'')+'"><input type="checkbox" class="chk" '+(l.mid?'checked':'')+' onchange="tglMid(this,\''+l.pageId+'\')"><span class="when">'+v.lab+'</span>'+nmL(l.name,l.pageId)+' <span class="gr">'+esc(l.grade)+'</span><span class="mn">+'+v.diff+'일</span>'+asB(l.as)+'</div>';
  const grp=(icon,label,color,arr,fn)=>'<div class="grp"><div class="glabel">'+icon+' '+label+'<span class="gc" style="background:'+color+'">'+arr.length+'</span></div>'+(arr.length?arr.map(fn).join(''):'<div class="empty">없음</div>')+'</div>';
  document.getElementById('situation').innerHTML =
    grp('🔔','중간관리','var(--purple)',mid,midRow);
}
function tglMid(el,pid){
  el.closest('.item').classList.toggle('done',el.checked);
  if(!WEBAPP_URL||WEBAPP_URL.indexOf('PASTE_')===0) return;
  fetch(WEBAPP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'midmanage',pageId:pid,checked:el.checked})}).catch(function(){});
}

/* ── 근무 스테이터스 (독립 카드 / 하이브리드: 요일=근무일 positive) ── */
const cHex={hye:'#0f9d58',kim:'#1a73e8',jang:'#f97316',park:'#9333ea',woo:'#e11d48',tae:'#0891b2',sung:'#7c3aed',noh:'#0d9488',won:'#b45309',ahn:'#4338ca'};
async function loadWork(){
  let ok=false;
  if(WORK_CSV_URL.indexOf('WORK_GID')<0 && WORK_CSV_URL.indexOf('PASTE_')<0){
    try{
      const rows=await csv(WORK_CSV_URL); rows.shift();
      rows.forEach(function(r){ if(!r[0])return;
        var off={}; WDAYS.forEach(function(d,i){off[d]=(r[2+i]==='1'||r[2+i]==='TRUE'||r[2+i]==='O')});
        workState[r[0]]={active:!(r[1]==='0'||r[1]==='FALSE'), off:off};
      }); ok=true;
    }catch(e){}
  }
  if(!ok){ ASSIGNEES.forEach(function(n){ if(!workState[n]) workState[n]={active:true,off:{월:false,화:false,수:false,목:false,금:false,토:false}}; }); }
  renderWorkRows();
}
function renderWorkRows(){
  if(!document.getElementById('wk-body'))return;
  var todayIdx=new Date().getDay();           // 0=일 .. 6=토
  var todayN=dayN[todayIdx];
  var html=ASSIGNEES.map(function(n){
    var s=workState[n]||{active:true,off:{}};
    var days=WDAYS.map(function(d){
      var dIdx=dayN.indexOf(d);               // 월=1 .. 토=6
      var isOff=!!(s.off&&s.off[d]);
      var isPast=(todayIdx!==0 && dIdx<todayIdx);   // 오늘보다 앞선 요일 = 지나감(배정 무시)
      var mark=(d===todayN)?'outline:2px solid #c4b5fd;outline-offset:1px':'';
      var cls='dchip'+(isOff?' off':'')+(isPast?' past':'');
      var click=isPast?'':' onclick="tglDay(\''+n+'\',\''+d+'\',this)"';
      return '<td><span class="'+cls+'" style="'+mark+'"'+click+'>'+d+'</span></td>';
    }).join('');
    var sw='<label class="sw '+(s.active?'':'busy')+'"><input type="checkbox" '+(s.active?'checked':'')+' onchange="tglActive(\''+n+'\',this)"><span class="sl2"></span></label>';
    var color=cHex[cmap[n]]||'#3c434f';
    return '<tr><td class="nm" style="color:'+color+'">'+esc(n)+'</td><td>'+sw+'</td>'+days+'</tr>';
  }).join('');
  document.getElementById('wk-body').innerHTML=html;
}
function tglActive(name,el){
  el.closest('.sw').classList.toggle('busy',!el.checked);
  if(!workState[name])workState[name]={active:true,off:{}};
  workState[name].active=el.checked;
  postWork({action:'setActive',name:name,active:el.checked});
}
function tglDay(name,day,el){
  if(!workState[name])workState[name]={active:true,off:{}};
  if(!workState[name].off)workState[name].off={};
  var next=!workState[name].off[day];
  workState[name].off[day]=next; el.classList.toggle('off',next);
  // 요일 체크 = 그 요일 안 됨(오프) → 노션 체크박스 true=오프
  postWork({action:'setDayoff',name:name,day:day,off:next});
}
function postWork(p){
  if(!WEBAPP_URL||WEBAPP_URL.indexOf('PASTE_')===0) return;
  fetch(WEBAPP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)}).catch(function(){});
}

/* ── 방문 목록 ── */
async function loadVisit(){
  let rows;
  try{ rows=await csv(SCHEDULE_CSV_URL); rows.shift(); }
  catch(e){ document.getElementById('visit').innerHTML='<div class="empty">데이터를 불러오지 못했어요.</div>'; return; }
  const today=tMid();
  const tStr=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  const vs=rows.filter(r=>r[0]&&r[4]==='visit'&&new Date(r[0])>=today).sort((a,b)=>new Date(a[0])-new Date(b[0]));
  document.getElementById('c-visit').textContent=vs.length;
  document.getElementById('visit').innerHTML = vs.length ? vs.map(r=>{
    const d=new Date(r[0]); const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const isT=ds===tStr; const lab=(d.getMonth()+1)+'/'+d.getDate()+' ('+dayN[d.getDay()]+')';
    return '<div class="item '+(isT?'today':'')+'"><span class="when">'+(isT?'오늘':lab)+'</span><span class="tm">'+(r[1]||'미정')+'</span>'+nmL(r[2],r[7])+' <span class="gr">'+esc(sg(r[3]))+'</span>'+asB(r[6])+'</div>';
  }).join('') : '<div class="empty">방문 예정 없음</div>';
}
function sg(g){if(!g)return'';if(g.indexOf('초')>=0){var m=g.match(/\d+/);return m?'초'+m[0]:'초'}if(g.indexOf('중')>=0){var m=g.match(/\d+/);return m?'중'+m[0]:'중'}if(g.indexOf('고')>=0){var m=g.match(/\d+/);return m?'고'+m[0]:'고'}return g}

/* ── 요약 ── */
async function loadSum(){
  try{ summaryRows=await csv(SUMMARY_CSV_URL); }
  catch(e){ document.getElementById('hl').innerHTML='<div class="empty">성과 로드 실패</div>'; return; }
  const r12=summaryRows[11]||[], r13=summaryRows[12]||[];
  document.getElementById('s-m').textContent=r12[1]||'-';
  document.getElementById('s-w').textContent=r12[3]||'-';
  document.getElementById('s-lm').textContent=r13[1]||'-';
  document.getElementById('s-lw').textContent=r13[3]||'-';
  document.getElementById('dn-m').textContent=pickDay(r12[0]);
  document.getElementById('dn-w').textContent=pickDay(r12[2]);
  renderHL(); renderPerf();
}
function renderHL(){
  var hl={};
  for(var i=0;i<summaryRows.length;i++){ if(summaryRows[i]&&summaryRows[i][0]==='주간하이라이트'){ for(var j=i+1;j<Math.min(i+7,summaryRows.length);j++){var r=summaryRows[j];if(!r||!r[0])break;hl[r[0]]={name:r[1]||'-',val:r[2]||'',extra:r[3]||''}} break; } }
  var row=function(ic,lb,d,cls,note){var nm=(d&&d.name)?d.name:'-';var vl=(d&&d.val)?d.val:'';return '<div class="hlrow '+(cls||'')+'"><span class="ic">'+ic+'</span><span class="lb">'+lb+'</span><span class="nm">'+esc(nm)+'</span>'+(note?'<span class="no">'+esc(note)+'</span>':'')+'<span class="vl">'+esc(vl+'')+'</span></div>'};
  var conv=(hl['전환왕']&&hl['전환왕'].extra)?hl['전환왕'].extra:'';
  var soj=(hl['결번진단']&&hl['결번진단'].extra)?hl['결번진단'].extra:'';
  document.getElementById('hl').innerHTML =
    row('🔥','매출왕',hl['매출왕']) + row('🏆','방문왕',hl['방문왕']) +
    row('⚡','전환왕',hl['전환왕'],'',conv) +
    row('⏳','홀딩회수',hl['홀딩회수'],'hold') +
    row('🔄','결번왕ㅜ',hl['결번진단'],'warn',soj);
}
function setPerfTab(i){perfTab=i;var ts=document.querySelectorAll('#pf-tabs .tab');for(var k=0;k<ts.length;k++)ts[k].classList.toggle('on',k===i);renderPerf()}
function renderPerf(){
  if(!summaryRows.length)return;
  var off=perfTab*6+1, co=19+perfTab*3;
  var tDb=0,tVs=0,tSe=0,tCa=0,tOd=0;
  var rows=ASSIGNEES.map(function(name,i){
    var r=summaryRows[ASSIGNEE_START_IDX+i]||[];
    var db=+(r[off]||0),vs=+(r[off+1]||0),se=+(r[off+2]||0),ca=+(r[off+3]||0),od=+(r[off+4]||0);
    var sales=r[off+5]||'0원'; tDb+=db;tVs+=vs;tSe+=se;tCa+=ca;tOd+=od;
    var cr=vs?Math.round(ca/vs*100):0, or=se?Math.round(od/se*100):0;
    var roas=r[co+1]?(+r[co+1]).toFixed(2):'-', ef=r[co+2]?r[co+2]+'만':'-';
    return '<tr><td class="nm">'+esc(r[0]||name)+'</td><td class="db">'+db+'</td><td class="vs">'+vs+'</td><td class="se">'+se+'</td><td class="ca">'+ca+'</td><td class="od">'+od+'</td><td class="sl">'+esc(sales)+'</td><td class="rt" style="color:var(--red)">'+cr+'%</td><td class="rt">'+or+'%</td><td class="ro">'+roas+'</td><td class="ef">'+ef+'</td></tr>';
  });
  rows.push('<tr class="tot"><td class="nm">합계</td><td class="db">'+tDb+'</td><td class="vs">'+tVs+'</td><td class="se">'+tSe+'</td><td class="ca">'+tCa+'</td><td class="od">'+tOd+'</td><td class="sl">-</td><td class="rt" style="color:var(--red)">'+(tVs?Math.round(tCa/tVs*100):0)+'%</td><td class="rt">'+(tSe?Math.round(tOd/tSe*100):0)+'%</td><td class="ro">-</td><td class="ef">-</td></tr>');
  document.getElementById('pf-body').innerHTML=rows.join('');

  var sojCol=perfTab===1?29:(perfTab===2?30:28);
  var hd=ASSIGNEES.map(function(name,i){var r=summaryRows[ASSIGNEE_START_IDX+i]||[];var s={};(r[sojCol]||'').split(';').forEach(function(p){var k=p.lastIndexOf(':');if(k>0)s[p.slice(0,k)]=+(p.slice(k+1))||0});return{name:r[0]||name,soj:s}});
  var keys=SOJ_KEYS.filter(function(k){return hd.some(function(d){return (d.soj[k]||0)>0})});
  var mx=1; hd.forEach(function(d){keys.forEach(function(k){if((d.soj[k]||0)>mx)mx=d.soj[k]})});
  var col=function(v){if(!v)return'#f6f7f9';var t=Math.min(v/mx,1);return'rgba(147,51,234,'+(0.10+t*0.72).toFixed(2)+')'};
  var ht;
  if(!keys.length){ht='<div class="empty">이 기간 소재 배정 없음</div>'}
  else{ht='<table class="heat"><thead><tr><th class="l">담당자</th>'+keys.map(function(k){return'<th>'+esc(k)+'</th>'}).join('')+'</tr></thead><tbody>'+hd.map(function(d){return'<tr><td class="l">'+esc(d.name)+'</td>'+keys.map(function(k){var v=d.soj[k]||0;var fg=v>mx*0.55?'#fff':'#5b4a6b';return'<td><span class="cell" style="background:'+col(v)+';color:'+fg+'">'+(v||'')+'</span></td>'}).join('')+'</tr>'}).join('')+'</tbody></table>'}
  document.getElementById('heat-wrap').innerHTML=ht;
}

loadAll();
setInterval(loadAll,5*60*1000);
</script>
