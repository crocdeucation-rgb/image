<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>운영본부</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>window.GATE_CFG={title:'운영본부',sub:'운영본부 현황판입니다.<br>경영진 계정으로 로그인해 주세요.',foot:'문의: 신상준 이사'};</script>
<style id="__pregate">body{visibility:hidden!important}#agate{visibility:visible!important}</style>

<script src="gate.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#F1F4F9;--pan:#fff;--ink:#161C2B;--soft:#6B7688;--mute:#9AA6B8;--line:#E3E8F0;
--v1:#4C6EF5;--v1s:#E8EDFE;--red:#E23A22;--reds:#FDECEA;--pos:#1F9D64;--poss:#E4F4EC;
--amber:#D9820B;--ambers:#FDF2E3;--pur:#6D4DD6;--purs:#EFEBFD}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1360px;margin:0 auto;padding:14px 18px 70px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.brand{font-size:20px;font-weight:800}
.brand span{font-size:12.5px;font-weight:600;color:var(--soft);margin-left:8px}
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:#fff;font:inherit;font-size:14px;font-weight:800;color:var(--soft);padding:9px 18px;cursor:pointer;border-radius:22px;white-space:nowrap}
.tabs button:hover{border-color:#C5D0FA;color:var(--ink)}
.tabs button.on{color:#fff;background:var(--v1);border-color:var(--v1)}
.nav{display:flex;align-items:center;gap:8px}
.nav button{border:1px solid var(--line);background:#fff;width:28px;height:28px;border-radius:8px;cursor:pointer;font:inherit;color:var(--soft)}
.nav b{font-size:15px;font-weight:800}
.nav em{font-style:normal;font-size:12px;color:var(--v1);font-weight:700}
.zone{margin-bottom:12px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.zh{display:flex;align-items:center;gap:9px;padding:13px 17px;border-bottom:1px solid var(--line);cursor:pointer}

/* 섹션 헤더 우측 슬롯 (주간 이동 등) */
.zh-right{margin-left:auto;display:flex;align-items:center;gap:2px}
.wknav{display:flex;align-items:center;gap:6px}
.wkbtn{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:17px;font-weight:700;color:var(--soft);cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;transition:.1s}
.wkbtn:hover{border-color:var(--v1);color:var(--v1);background:var(--v1s)}
.wklab{font-size:12.5px;font-weight:800;color:var(--ink);white-space:nowrap;min-width:96px;text-align:center}
@media(max-width:768px){.wklab{font-size:11.5px;min-width:auto}.wkbtn{width:28px;height:28px;font-size:15px}.zh-right{gap:1px}}
.zh .ar{font-size:11px;color:var(--mute);width:11px}
.zh i{width:8px;height:8px;border-radius:50%;flex:none}
.zh h2{font-size:15px;font-weight:800}
.zh .n{font-size:12.5px;color:var(--soft);font-weight:700}
.zh .d{font-size:11.5px;color:var(--mute);margin-left:auto;text-align:right;line-height:1.4}
.zb{padding:14px 17px 18px}
.lead{font-size:12.5px;color:var(--soft);line-height:1.65;margin-bottom:12px}
.lead b{color:var(--ink)}
/* 주간 캘린더 */
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:start}
.cd{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;text-align:left;font:inherit;padding:0;width:100%}
.cd h4{font-size:12.5px;font-weight:800;padding:8px 11px;background:#F6F8FB;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.cd h4 span{color:var(--mute);font-weight:600}
.cd.hol{background:#F6F8FB;border-style:dashed}
.cd.hol h4{background:#EDF0F6;color:var(--mute)}
.holt{padding:22px 8px;text-align:center;font-size:12.5px;font-weight:800;color:var(--mute)}
.cd.past{opacity:.7}.cd.past h4{background:#F1F4F9;color:var(--mute)}
.cd.today{border-color:var(--v1);box-shadow:0 0 0 2px var(--v1s)}
.cd.today h4{background:var(--v1);color:#fff}.cd.today h4 span{color:#D7E0FE}
.cd.tmr h4{background:var(--v1s);color:var(--v1)}
.cd.sel{box-shadow:0 0 0 2px var(--ink)}
.cd .bd{padding:8px 11px 10px}
.kv{display:flex;justify-content:space-between;font-size:12px;line-height:1.85}
.kv em{font-style:normal;color:var(--soft)}
.kv b{font-weight:800}
.kv .ok{color:var(--pos);font-size:11px;font-weight:700}
.kv .ng{color:var(--red);font-size:11px;font-weight:800}
.kv .z{color:#D4DAE4}
.cd ul{list-style:none;margin-top:7px;padding-top:7px;border-top:1px solid #F0F3F8;font-size:11.5px;line-height:1.75}
.cd li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#3D4759}
.cd li .tt{color:var(--mute);font-weight:700;margin-right:3px}
.cd li .kk{color:var(--mute);font-size:10.5px;margin-left:3px}
.cd .warn{margin-top:7px;padding:6px 9px;background:var(--reds);color:var(--red);border-radius:7px;font-size:11px;font-weight:700;line-height:1.5;white-space:normal}
/* 사건 줄 */
.ev{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:11px 0;border-top:1px solid #F0F3F8}
.ev:first-child{border-top:0}
.ev .tm{font-size:12.5px;font-weight:800;color:var(--soft)}
.ev .tm small{display:block;font-weight:700;font-size:10.5px;margin-top:2px}
.ev .who{font-size:13.5px;font-weight:800}
.ev .who small{font-weight:600;font-size:11.5px;color:var(--soft);margin-left:5px}
.org{font-size:11.5px;color:var(--soft);margin-top:2px}
.org b{color:var(--ink);font-weight:800}
.flow{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}
.stp{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:6px;background:#EEF1F6;color:var(--soft)}
.stp em{font-style:normal;font-weight:700;opacity:.8;margin-left:4px}
.stp.개통{background:var(--v1s);color:var(--v1)}
.stp.입학식{background:var(--purs);color:var(--pur)}
.stp.첫만남{background:var(--ambers);color:#9A5B06}
.stp.첫수업{background:var(--poss);color:#16784C}
.stp.해피콜{background:#EEF1F6;color:var(--soft)}
.stp.done{opacity:.5}
.arw{color:#C3CBD9;font-weight:800}
.tag{font-size:11px;font-weight:800;padding:2px 8px;border-radius:5px}
.tag.ok{background:var(--poss);color:#16784C}
.tag.pre{background:var(--v1s);color:var(--v1)}
.tag.ng{background:var(--reds);color:var(--red)}
.tag.wait{background:var(--ambers);color:#9A5B06}
.tag.empty2{background:#fff;color:var(--mute);border:1px dashed var(--line)}
.dpn{font-size:11.5px;color:var(--mute);font-weight:700}
.note{font-size:12.5px;color:#3D4759;line-height:1.55;margin-top:5px;word-break:keep-all}
.note.none{color:var(--mute)}
.note mark{background:#FFF1C9;color:#7A5200;padding:0 2px;border-radius:3px}
.empty{padding:20px;text-align:center;color:var(--mute);font-size:12.5px}
/* 안 된 것 */
.miss{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.mc{border:1px solid var(--line);border-radius:11px;padding:11px 13px;cursor:pointer;background:#fff;text-align:left;font:inherit;width:100%}
.mc.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mc h5{font-size:12.5px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline}
.mc h5 b{font-size:19px;color:var(--red)}
.mc h5 b.zero{color:var(--mute)}
.mc p{font-size:11.5px;color:var(--soft);line-height:1.5;margin-top:4px}
/* 코치/강사 칩 */
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:18px;padding:5px 12px;font:inherit;font-size:12.5px;font-weight:700;color:var(--soft);cursor:pointer}
.chip span{color:var(--mute);margin-left:5px;font-weight:600;font-size:11.5px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}.chip.on span{color:#B9C2D3}
.chip .hot{color:var(--red)}
/* 타임테이블 */
.scrollx{overflow-x:auto}
.tt{border-collapse:collapse;width:100%;font-size:12px;min-width:640px}
.tt th{font-size:12.5px;font-weight:800;padding:8px 6px;border:1px solid var(--line);background:#F6F8FB;white-space:nowrap}
.tt th small{display:block;font-weight:600;color:var(--mute);font-size:11px}
.tt th.td{background:var(--v1);color:#fff}.tt th.td small{color:#D7E0FE}
.tt td{border:1px solid var(--line);padding:3px;vertical-align:top;min-width:120px}
.tt td.tmc,.tt th.tmc{min-width:56px;width:56px;text-align:center;background:#FAFBFD;color:var(--soft);font-weight:800;white-space:nowrap;font-size:11.5px;vertical-align:middle}
.slot{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--v1);border-radius:5px;background:var(--v1s);padding:3px 7px;margin-bottom:3px;font:inherit;font-size:11.5px;cursor:pointer;color:var(--ink)}
.slot b{font-weight:800}
.slot small{color:var(--soft);margin-left:4px}
.slot .ex{float:right;font-size:9.5px;font-weight:800;border-radius:6px;padding:0 5px;background:#fff;border:1px solid currentColor}
.slot .ex.new{background:#E7F0FF;color:#1C57C4;border-color:#B7CEF6}
.slot .ex.mwb{background:var(--red);color:#fff;border-color:var(--red);font-weight:800}
.slot.w0{border-left-color:var(--red);background:var(--reds)}
.slot.w0 .ex{background:var(--red);color:#fff}
.slot.w1{border-left-color:var(--amber);background:var(--ambers)}
.slot.w1 .ex{background:var(--amber);color:#fff}
.slot.past{border-left-color:#C3CBD9;background:#F3F5F9;opacity:.75}
.slot.mw{border-left-color:var(--red);background:#FDECEA}
.slot.can{border-left-color:var(--red);opacity:.55;text-decoration:line-through}
.kpi{display:flex;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.kpi div{flex:1 1 110px;padding:10px 13px;border-left:1px solid var(--line)}
.kpi div:first-child{border-left:0}
.kpi .l{font-size:11px;color:var(--soft);font-weight:700}
.kpi b{display:block;font-size:20px;font-weight:800;margin-top:2px}
.kpi .r b{color:var(--red)}
.kpi .g b{color:var(--pos)}
/* 표 */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{font-size:11.5px;color:var(--mute);font-weight:700;padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid #F0F3F8;vertical-align:top}
.tbl td.c,.tbl th.c{text-align:center}
.tbl.tfix{table-layout:fixed}
.tbl.tfix td{word-break:keep-all;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl.tfix td.note{white-space:normal}
.tbl tr.hot td{background:#FFFBFA}
.tbl .z{color:#C9D1DE}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px;flex-wrap:wrap}
.seg button{border:0;background:#fff;font:inherit;font-size:12px;font-weight:700;color:var(--soft);padding:6px 12px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--ink);color:#fff}
.grp{font-size:12px;font-weight:800;color:var(--mute);margin:20px 2px 8px;letter-spacing:.4px}
.drow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.dcol{flex:1 1 260px;min-width:240px}
.dcol.mid{flex:1 1 400px}
.dcol.wide{flex:2 1 560px}
.dcards{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.dcol.mid .dcards{grid-template-columns:repeat(2,1fr)}
.dcol.wide .dcards{grid-template-columns:repeat(2,1fr)}
@media(min-width:1200px){.dcol.wide .dcards{grid-template-columns:repeat(3,1fr)}}
.dch{font-size:12.5px;font-weight:800;padding:7px 11px;border-radius:9px;margin-bottom:8px}
.dch b{float:right}
.dch.해피콜{background:#EEF1F6;color:var(--soft)}
.dch.개통{background:var(--v1s);color:var(--v1)}
.dch.입학식{background:var(--purs);color:var(--pur)}
.dch.첫만남{background:var(--ambers);color:#9A5B06}
.dch.첫수업{background:var(--poss);color:#16784C}
.dcard.ok{background:#FAFDFB;border-color:#CFE9DC}
.okb{font-size:10.5px;font-weight:800;color:#16784C;background:var(--poss);padding:2px 7px;border-radius:5px}
.dcard{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px;background:#fff}
.dtop{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.dnm{border:0;background:none;font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:#CBD3E0;text-underline-offset:3px}
.dtm{font-size:11.5px;font-weight:800;color:var(--soft)}
.dchain{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0 4px}
.mini2{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:5px;background:#EEF1F6;color:var(--soft)}
.mini2.개통{background:var(--v1s);color:var(--v1)}
.mini2.입학식{background:var(--purs);color:var(--pur)}
.mini2.첫만남{background:var(--ambers);color:#9A5B06}
.mini2.첫수업{background:var(--poss);color:#16784C}
.mini2.done{opacity:.45}
.dcard .note{font-size:11.5px;margin-top:3px;line-height:1.5}
.dcard .org{font-size:11px;line-height:1.55}
@media (max-width:820px){.dcol,.dcol.mid,.dcol.wide{flex:1 1 100%}.dcol.mid .dcards,.dcol.wide .dcards{grid-template-columns:1fr}}
.fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.fbar input{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 13px;font:inherit;font-size:13px;width:240px;outline:none}
.fbar input:focus{border-color:var(--v1)}
.qwrap{position:relative;margin-left:auto;flex:0 1 280px;min-width:120px}
.qwrap .qsearch{width:100%;margin-left:0}
#qres{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:300}
.qcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:0 8px 28px rgba(20,30,60,.16)}
.qrow{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid #F3F5F9;cursor:pointer}
.qrow:first-child{border-top:0}
.qrow b{font-size:13px}
.qrow span{font-size:11.5px;color:var(--soft)}
.wlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:4px 16px}
.wrow{display:flex;gap:8px;align-items:baseline;font-size:12.5px;padding:3px 0;border-bottom:1px solid #F5F7FA}
.wrow b{min-width:22px;text-align:right;color:var(--red);font-weight:800}
.wrow span{color:#3D4759;line-height:1.5}
.anch{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.anch button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px;font:inherit;font-size:12px;font-weight:700;color:var(--soft);cursor:pointer}
.anch button:hover{border-color:var(--ink);color:var(--ink)}
.more{cursor:pointer;font-size:12.5px;font-weight:800;color:var(--soft);padding:9px 0;border-top:1px solid var(--line);margin-top:8px;list-style:none}
.more::-webkit-details-marker{display:none}
.more::before{content:'▸ ';color:var(--mute)}
details[open]>.more::before{content:'▾ '}
.ov{position:fixed;inset:0;background:rgba(22,28,43,.5);display:flex;align-items:center;justify-content:center;padding:24px 14px;z-index:2147483000;overflow:auto}
@media(max-width:768px){.ov{align-items:flex-end;padding:0}.card{max-width:100%;border-radius:18px 18px 0 0;max-height:90vh}}
.card{background:#fff;border-radius:16px;max-width:620px;width:100%;padding:20px 22px;max-height:88vh;overflow-y:auto}
.card h3{font-size:18px;font-weight:800}
.card .cls{float:right;border:0;background:#EEF1F6;border-radius:8px;width:28px;height:28px;cursor:pointer;color:var(--soft)}
.hi{display:grid;grid-template-columns:58px 1fr;gap:9px;font-size:12.5px;padding:7px 0;border-bottom:1px solid #F3F5F9}
.hi .d{color:var(--mute);font-weight:700}
@media (max-width:820px){
 .zh{flex-wrap:nowrap;gap:7px;padding:12px 14px}
 .zh h2{font-size:14px;white-space:nowrap}
 .zh .d{display:none}
 .zb{padding:12px 14px 16px}
 .wrap{padding:12px 12px 60px}
 .cal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;grid-template-columns:none}
 .cd{min-width:84%;scroll-snap-align:start}
 .cal::-webkit-scrollbar{height:4px}
 .ev{grid-template-columns:1fr;gap:4px}
 .ev .tm{font-size:12px}
 .tt td{min-width:104px}
}
.altiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.altile{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;text-align:left;cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:3px}
.altile .alt{font-size:12.5px;font-weight:800;color:var(--ink)}
.altile b{font-size:26px;font-weight:900;color:var(--red);line-height:1.1}
.altile b small{font-size:12px;font-weight:700;margin-left:2px;color:var(--soft)}
.altile .alc{font-size:11px;color:var(--mute);line-height:1.4}
.altile .alh{font-size:11px;font-weight:800;color:var(--red);background:var(--reds);border-radius:5px;padding:1px 6px;align-self:flex-start;margin-top:2px}
.altile.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink) inset;background:#FCFCFE}
.altile.zero b{color:var(--mute)}
.nmbtn{border:0;background:none;font:inherit;font-weight:800;cursor:pointer;padding:0}
.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.chart{border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px}
.chh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.chh b{font-size:13.5px;font-weight:800}
.chh span{font-size:11px;color:var(--soft);display:flex;align-items:center;gap:5px}
.chh i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:6px}
.chf{font-size:11px;color:var(--soft);line-height:1.5;margin-top:4px;border-top:1px dashed var(--line);padding-top:6px;word-break:keep-all}
@media (max-width:1100px){.altiles{grid-template-columns:repeat(3,1fr)}.charts{grid-template-columns:1fr}}
@media (max-width:620px){.altiles{grid-template-columns:repeat(2,1fr)}}
.anch.sticky{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;margin-bottom:6px;align-items:center}
.anch-g{font-size:11.5px;font-weight:800;color:var(--ink);margin:0 2px 0 4px}
.anch-sep{width:1px;height:16px;background:var(--line);margin:0 6px}
.sech{font-size:17px;font-weight:900;margin:26px 2px 10px;padding-bottom:6px;border-bottom:2px solid var(--ink)}

.tbl.mrow.al td:nth-child(4){grid-area:3/1/4/3;font-size:11.5px;color:var(--soft)}

.tbl.mrow.al td:nth-child(5){grid-area:4/1/5/3}
/* 만료 예정: 이름·학년·지점 | 만료일 D-n  /  담당 · 코칭 · 상태  /  특이사항 */
.tbl.mrow.ex tr{grid-template-columns:auto auto 1fr auto}

.tbl.mrow.ex td:nth-child(3){grid-area:2/1;font-size:12px}

.cgT .chead{display:grid;grid-template-columns:140px 82px 150px 1fr;gap:10px;padding:6px 14px;font-size:10.5px;color:var(--mute);font-weight:700;background:#FCFDFE;border-top:1px solid var(--line)}
.crow{display:grid;grid-template-columns:140px 82px 150px 1fr;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid #F0F3F8;cursor:pointer;font-size:12.5px}

/* 모바일 정리 2차: 가로 스크롤 줄·KPI 압축·표 카드·주간표 요일 선택 */
details.cgrp>summary{list-style:none;cursor:pointer}
details.cgrp>summary::-webkit-details-marker{display:none}
.ttday{display:none}
@media(max-width:768px){

.chips,.anch,.anch.sticky{flex-wrap:nowrap!important;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;white-space:nowrap}
.chips::-webkit-scrollbar,.anch::-webkit-scrollbar,.seg::-webkit-scrollbar{display:none}

.scrollx{overflow-x:auto!important;-webkit-overflow-scrolling:touch}
.scrollx>.tbl th,.scrollx>.tbl td:first-child{white-space:nowrap}

.pgrid{gap:8px!important}
.pcard{padding:9px 12px}.pch{margin-bottom:4px}.pch b{font-size:14.5px}
.pl{padding:5px 0}.pll span{font-size:12.5px}.pll b{font-size:16px}.pls{font-size:10.5px;margin-top:0}

details.cgrp>summary.cgh{border-bottom:0;margin:0;padding:10px 2px}
details.cgrp>summary.cgh::after{content:'▸';margin-left:auto;color:var(--mute);font-size:12px}

details.cgrp .cgrep{margin-left:0;flex-wrap:wrap}

.tt.dsel tr:first-child{display:none}
.tbl.mrow.cx td:nth-child(2),.tbl.mrow.cm td:nth-child(2){grid-area:1/1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tbl.mrow.cx td:nth-child(3),.tbl.mrow.cm td:nth-child(3){grid-area:2/1;font-size:12px}
.tbl.mrow.cx td:nth-child(3)::before,.tbl.mrow.cm td:nth-child(3)::before{content:'코칭 ';color:var(--mute)}
.tbl.mrow.cx td:nth-child(4){display:none}

.tbl.mrow.cx td:nth-child(6),.tbl.mrow.cm td:nth-child(5){grid-area:3/1/4/3}
.tbl.mrow.ce td:nth-child(1){grid-area:1/1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl.mrow.ce td:nth-child(1) button{font-size:14.5px!important;margin-right:6px}
.tbl.mrow.ce td:nth-child(2){grid-area:1/2;text-align:right;font-weight:800}

<script>
/* 운영본부 — Firestore 로더 (gate.js 인증 후 opsData 6문서 읽어 조립)
   프리뷰(window.OPS 주입)면 이 로더는 통째로 스킵. */
(function(){
  if(window.OPS){ return; }               // 로컬 프리뷰: 데이터 이미 있음
  var DOCS=['summary','event','teach','coachA','coachB','cancel'];
  var loaded=false;
  function showMsg(t,err){
    var w=document.querySelector('.wrap'); if(!w) return;
    var el=document.getElementById('ops-load');
    if(!el){ el=document.createElement('div'); el.id='ops-load';
      el.style.cssText='padding:60px 20px;text-align:center;color:#6B7684;font:600 15px Pretendard,system-ui'; w.insertBefore(el,w.firstChild); }
    el.innerHTML=t+(err?'<br><small style="color:#9AA6B8">'+err+'</small>':'');
  }
  async function _fsGet(db,docId){
    var doc=await db.collection('opsData').doc(docId).get();
    if(!doc.exists) throw new Error('opsData/'+docId+' 없음');
    var d=doc.data(); return d.json ? JSON.parse(d.json) : d;
  }
  async function load(){
    if(loaded) return; 
    try{
      var db=firebase.firestore();
      showMsg('불러오는 중…');
      var parts=await Promise.all(DOCS.map(function(id){ return _fsGet(db,id); }));
      loaded=true;
      var O={};
      parts.forEach(function(p){
        Object.keys(p).forEach(function(k){
          if(k==='coach'){ O.coach=O.coach||{}; for(var n in p.coach) O.coach[n]=p.coach[n]; }
          else O[k]=p[k];
        });
      });
      window.OPS=O;
      var el=document.getElementById('ops-load'); if(el) el.remove();
      if(window.__bootOps) window.__bootOps();
    }catch(e){
      if(String(e&&e.code||e).indexOf('permission')>=0){ /* 아직 로그인 전 — auth 콜백에서 재시도 */ return; }
      showMsg('데이터를 불러오지 못했습니다.', (e&&e.message)||e);
    }
  }
  // gate.js가 firebase 초기화·로그인 처리 → 인증(권한통과) 시점에 읽는다.
  function wait(){
    if(window.firebase && firebase.auth){
      firebase.auth().onAuthStateChanged(function(u){ if(u) load(); });
      // 이미 세션 복원돼 있으면 즉시 시도
      if(firebase.auth().currentUser) load();
    } else { setTimeout(wait,120); }
  }
  wait();
})();
</script>

function evRow(name,list){
  var L=list.slice().sort(function(a,b){return (a.time||'~').localeCompare(b.time||'~');});
  var e0=L[0], dpn=e0.join?diff(e0.join,CUR):null;
  var chain=L.map(function(x){
    var cls='stp '+x.kind+(x.st==='done'?' done':'');
    return '<span class="'+cls+'">'+x.kind+(x.time?'<em>'+x.time+'</em>':'')+(x.st==='done'?' ✓':(x.st==='miss'?' ✗':''))+'</span>';
  }).join('<span class="arw">›</span>');
  var st=L.some(function(x){return x.st==='miss';})?'miss':(L.every(function(x){return x.st==='done';})?'done':'today');
  var pre=L.map(function(x){return x.pre;}).filter(Boolean)[0]||'';
  var tag = st==='done'?'<span class="tag ok">완료</span>'
          : st==='miss'?(pre?'<span class="tag pre">사전 안내 '+esc(pre)+'</span>':'<span class="tag ng">칸 비어 있음</span>')
          : '<span class="tag wait">진행</span>';
  var who=[];L.forEach(function(x){if(x.who&&who.indexOf(x.who)<0)who.push(x.who+(x.target?'('+x.target+')':''));});
  var note=L.map(function(x){return x.note;}).filter(Boolean)[0]||'';
  var stn=STAT[name]; if(stn&&stn.note) note=stn.note+(note?' / '+note:'');
  return '<div class="ev"><div class="tm">'+(e0.time||'—')+(dpn!==null?'<small>D+'+dpn+'</small>':'')+'</div>'+
   '<div><div class="who"><button data-name="'+esc(name)+'" style="border:0;background:none;font:inherit;font-weight:800;cursor:pointer;padding:0;text-decoration:underline;text-decoration-color:#CBD3E0;text-underline-offset:3px">'+esc(name)+'</button>'+
   '<small>'+esc(e0.grade||'')+(e0.join?' · 가입 '+md(e0.join):'')+'</small></div>'+org(e0)+
   '<div class="flow">'+chain+tag+(who.length?'<span class="dpn">'+esc(who.join(' · '))+'</span>':'')+'</div>'+
   '<div class="note'+(note?'':' none')+'">'+(note?hi(note):'특이사항 칸 비어 있음')+'</div></div></div>';
}
function evList(list,byJoin){
  if(!list.length) return '<div class="empty">해당하는 건이 없습니다.</div>';
  var g={};list.forEach(function(e){(g[e.name]=g[e.name]||[]).push(e);});
  return Object.keys(g).sort(function(a,b){
    if(byJoin) return (g[b][0].join||'').localeCompare(g[a][0].join||'');
    return ((g[a][0].time||'~')).localeCompare(g[b][0].time||'~');
  }).map(function(n){return evRow(n,g[n]);}).join('');
}

  var n=0;
  Object.keys(CO).forEach(function(k){CO[k].live.forEach(function(m){
    if(inBr(m)&&(m.wks||[]).indexOf(w)>=0) n++;});});
  return n;
}

// 회원 이름 → coach 데이터(학년·지점·상담·담임) lookup 인덱스 (1회 생성)
function todoMemberIndex(){
  if(window.__tmIdx) return window.__tmIdx;
  var idx={};
  function nrm(n){return String(n||'').replace(/\(.*?\)/g,'').replace(/\s/g,'');}
  Object.keys(CO).forEach(function(c){
    ['live','exp'].forEach(function(kk){ (CO[c][kk]||[]).forEach(function(m){
      var k=nrm(m.n); if(!idx[k]) idx[k]={g:m.g||'',br:m.br||'',sang:m.sang||'',coach:c};
    });});
  });
  window.__tmIdx=idx; return idx;
}
function todoLook(name){ var i=todoMemberIndex()[String(name||'').replace(/\(.*?\)/g,'').replace(/\s/g,'')]; return i||{g:'',br:'',sang:'',coach:''}; }

// 📅 만료임박 = coach live 중 이번주(w0) 만료, 취소·휴강 제외
function todoExpiring(){
  var out=[];
  Object.keys(CO).forEach(function(c){ (CO[c].live||[]).forEach(function(m){
    if(m.wk==='w0' && !m.can && !m.hold && inBrM(m)){

}

function todoCard(x, mode){

  var sang = x.sang || L.sang || '';
  var saup = x.saup || L.saup || '';

  if(br) meta.push(esc(br));

  if(saup) meta.push('사업 '+esc(saup));
  if(coach) meta.push('담임 '+esc(coach));

  var timeHtml='';

    var dd=14-diff(x.join,x.recv);

}

function alertData(){
  var A={onb:[],call:[],dev:[],mw:[],orphan:[]};
  var CAN={};IN.forEach(function(i){if(i.type==='취소')CAN[i.name]=1;});
  var gone=function(n,L){return CAN[n]||(L||[]).some(function(e){return /당취|당일취소|취소|환불/.test(e.note||'');});};
  var by={};EV.forEach(function(e){(by[e.name]=by[e.name]||[]).push(e);});
  Object.keys(by).forEach(function(n){
    var L=by[n],x=L[0],j=x.join; if(!j||!inBr(x)) return;
    var f=L.reduce(function(a,e){return e.day<a?e.day:a;},'9999-12-31');
    if(diff(j,f)>45) return;                                   /* 기존 회원 재개통 제외 */
    if(L.some(function(e){return e.kind==='첫수업'&&e.st==='done';})) return;
    if(gone(n,L)) return;
    if(L.some(function(e){return (e.st==='plan'||e.st==='today')&&e.day>=TODAY;})) return;
    var miss=L.some(function(e){return e.st==='miss';}), dd=diff(j,TODAY);
    if(dd<14&&!miss) return;
    var last=L.slice().sort(function(a,b){return a.day<b.day?-1:1;}).pop();
    A.onb.push({dt:j,n:n,d:dd,br:x.br,sang:x.sang,saup:x.saup,sub:'가입 '+md(j),
      st:last.kind+' '+(last.st==='done'?'완료':last.st==='miss'?'불참':'예정')+' '+md(last.day),bad:miss,note:last.note||''});
  });
  Object.keys(CO).forEach(function(c){CO[c].live.forEach(function(m){
    if(!inBr(m)||m.can||CAN[m.n]) return;
    var lg=m.log; if(!lg) return;
    var t=lg.tail||[],k=0;
    for(var i=t.length-1;i>=0;i--){ if(t[i][0]==='skip'&&t[i][1].indexOf('휴강')<0) k++; else if(t[i][0]==='note') continue; else break; }
    if(k>=2) A.call.push({dt:lg.last||'',n:m.n,d:k,unit:'회',br:m.br,sang:m.sang,saup:m.saup,sub:'담당 '+c,
      st:'마지막 완료 '+(lg.last?md(lg.last):'없음'),bad:k>=3,note:t.slice(-3).map(function(z){return z[1];}).join(' → ')});
    var expired=m.exp&&m.exp<TODAY;

  });});
  var seen={};
  (D.device||[]).slice().sort(function(a,b){return a.d<b.d?-1:1;}).forEach(function(x){
    if(!inBr(x)||seen[x.n]||x.d>TODAY||CAN[x.n]) return;
    if(EV.some(function(e){return e.name===x.n&&e.kind==='첫수업'&&e.st==='done';})) return;
    var dd=diff(x.d,TODAY); if(dd<7) return; seen[x.n]=1;
    A.dev.push({dt:x.d,n:x.n,d:dd,br:x.br,sang:x.sang,saup:x.saup,sub:x.side,st:x.kind+' '+md(x.d),bad:dd>=21,note:x.note||''});
  });
  IN.forEach(function(i){
    if(i.type!=='민원'||i.state!=='open'||!inBr(i)) return;
    var dd=diff(i.day,TODAY); if(dd<14) return;
    A.mw.push({dt:i.day,n:i.name,d:dd,br:i.br,sang:i.sang,saup:i.saup,sub:i.sub||'',st:'접수 '+md(i.day),bad:dd>=21,note:i.note||''});
  });
  Object.keys(CO).forEach(function(c){CO[c].live.forEach(function(m){
    if(m.orphan&&inBr(m)) A.orphan.push({dt:m.join||'',n:m.n,d:(m.orphanState==='방치'?1:0),br:m.br,sang:m.sang,saup:m.saup,sub:'원 담당 '+m.orphan+(m.orphanState==='이관중'?' → '+m.orphanTo:''),st:m.orphanState==='방치'?'재배정 대기':'이관 중 ('+m.orphanTo+')',bad:m.orphanState==='방치',note:m.note||''});
  });});
  Object.keys(A).forEach(function(k){A[k].sort(function(a,b){return (b.dt||'').localeCompare(a.dt||'');});});
  return A;
}
// ⚡청약철회 위험 + 🔴갓 들어온 취소문의 — 신규 여정의 이탈자·급한 응대
// D.inbox(민원 실파싱) 기반. 둘 다 진행중(open)만. 완결은 취소 섹션.
function _churnLook(name){
  return (typeof todoLook==='function') ? todoLook(name) : {g:'',br:'',sang:'',coach:''};
}
function churnData(){
  var IB=D.inbox||[], risk=[], fresh=[], seenR={}, seenF={};
  IB.forEach(function(x){
    if(x.status!=='진행중') return;              // 진행중만 (완결·유지=취소섹션)
    var L=_churnLook(x.name), br=L.br||x.br||'';
    if(BR && br!==BR) return;                    // 지점필터
    var base={name:x.name, join:x.join, recv:x.recv, why:x.why, res:x.res,
              sang:x.sang||L.sang||'', saup:x.saup||L.saup||'', coach:x.teach||L.coach||'', br:br, g:x.grade||L.g||'', absent:x.absent};
    // ⚡청약철회: 오늘-가입 ≤14 (법적 데드라인)
    if(x.join){ var sj=diff(x.join,TODAY);
      if(sj>=0&&sj<=14 && !seenR[x.name]){ seenR[x.name]=1; risk.push(Object.assign({dleft:14-sj},base)); } }
    // 🔴갓취소: 접수 ≤3일 (막 들어옴)
    if(x.recv){ var age=diff(x.recv,TODAY);
      var isChurn=!!(x.join&&diff(x.join,TODAY)>=0&&diff(x.join,TODAY)<=14);
      if(age>=0&&age<=3 && !isChurn && !seenF[x.name]){ seenF[x.name]=1; fresh.push(Object.assign({age:age},base)); } }
  });
  risk.sort(function(a,b){return a.dleft-b.dleft;});   // 남은기간 적은순
  fresh.sort(function(a,b){return a.age-b.age;});       // 최근순
  return {risk:risk, fresh:fresh};
}
// 철회위험·갓취소 띠 HTML (신규 여정 파이프라인 아래)
function churnBar(){
  var C=churnData();
  if(!C.risk.length && !C.fresh.length) return '';
  function chip(x,mode){
    var tag = mode==='risk'
      ? '<span class="cb-dday'+(x.dleft<=3?' hot':'')+'">D-'+x.dleft+'</span>'
      : '<span class="cb-age">'+(x.age===0?'오늘':x.age+'일 전')+'</span>';
    var badges='';

function combo(o){
  var W=440,H=236,pl=12,pr=12,top=30,lineH=62,gap=18,base=H-40,n=o.data.length,cw=(W-pl-pr)/n;
  var bTop=top+lineH+gap, bH=base-bTop;
  var bm=Math.max.apply(null,o.data.map(function(d){return d.bar;}).concat([1]));
  var lv=o.data.map(function(d){return d.line;}).filter(function(v){return v!=null;});
  var lmax=Math.max.apply(null,lv.concat([0.0001])), lmin=Math.min.apply(null,lv.concat([lmax]));
  var span=(lmax-lmin)||lmax||1, lo=Math.max(0,lmin-span*0.35), hi2=lmax+span*0.15;
  var ly=function(v){return top+lineH-(v-lo)/(hi2-lo)*lineH;};
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
  s+='<rect x="'+pl+'" y="'+(top-8)+'" width="'+(W-pl-pr)+'" height="'+(lineH+16)+'" rx="6" fill="#F7F9FC"/>';
  s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+base+'" y2="'+base+'" stroke="#D5DCE7"/>';
  var pts=[];
  o.data.forEach(function(d,i){
    var cx=pl+cw*i+cw/2, bw=Math.min(cw*0.5,34), h=Math.max(d.bar/bm*bH,2), y=base-h;
    s+='<rect x="'+(cx-bw/2)+'" y="'+y+'" width="'+bw+'" height="'+h+'" rx="3" fill="'+o.barCol+'"'+(d.part?' fill-opacity=".4" stroke="'+o.barCol+'" stroke-dasharray="3 2"':'')+'/>';
    s+='<text x="'+cx+'" y="'+(y-5)+'" text-anchor="middle" font-size="12" font-weight="800" fill="#161C2B">'+d.bar+'</text>';
    s+='<text x="'+cx+'" y="'+(base+15)+'" text-anchor="middle" font-size="11.5" font-weight="700" fill="#6B7688">'+d.lab+'</text>';
    if(d.part) s+='<text x="'+cx+'" y="'+(base+29)+'" text-anchor="middle" font-size="10" fill="#9AA6B8">'+d.part+'</text>';
    if(d.line!=null){pts.push([cx,ly(d.line),d]);}
  });
  if(pts.length>1) s+='<polyline fill="none" stroke="'+o.lineCol+'" stroke-width="2.2" stroke-linejoin="round" points="'+pts.map(function(p){return p[0]+','+p[1];}).join(' ')+'"/>';
  pts.forEach(function(p,i){
    var dl=i?p[2].line-pts[i-1][2].line:null;
    s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.6" fill="#fff" stroke="'+o.lineCol+'" stroke-width="2"/>';
    s+='<text x="'+p[0]+'" y="'+(p[1]-8)+'" text-anchor="middle" font-size="11.5" font-weight="800" fill="'+o.lineCol+'">'+o.fmt(p[2].line)+'</text>';
  });
  s+='</svg>';
  return '<div class="chart"><div class="chh"><b>'+o.title+'</b><span><i style="background:'+o.barCol+'"></i>'+o.barName+'<i style="background:'+o.lineCol+';height:3px;margin-top:5px"></i>'+o.lineName+'</span></div>'+s+
    (o.foot?'<div class="chf">'+o.foot+'</div>':'')+'</div>';
}

    CO[k].live.concat(CO[k].exp).forEach(function(m){if(m.n===name&&!cm){cm=m;coach=k;}});});
  var o=E[0]||I[0]||cm||{};
  var KIND=['해피콜','개통','입학식','첫만남','첫수업'];
  var steps=KIND.map(function(k){
    var f=E.filter(function(e){return e.kind===k;}).pop();
    if(!f) return '<span class="stp">'+k+'<em>—</em></span>';
    return '<span class="stp '+k+(f.st==='done'?' done':'')+'">'+k+'<em>'+md(f.day)+(f.time?' '+f.time:'')+'</em>'+(f.st==='miss'?' ✗':'')+'</span>';
  }).join('<span class="arw">›</span>');
  var his=[];
  if(o.join) his.push([o.join,'가입']);
  E.forEach(function(e){his.push([e.day,e.kind+(e.time?' '+e.time:'')+(e.who?' · '+e.who:'')+(e.st==='miss'?' — 기록 없음':'')]);});
  I.forEach(function(i){his.push([i.recv||i.day, '민원'+(i.res?' · '+i.res:'')+(i.why?' — '+i.why:'')]);});
  if(cm&&cm.can) his.push([cm.can.d,'취소 · '+(cm.can.kind||'')+' — '+(cm.can.why||'')]);
  his.sort(function(a,b){return (a[0]||'').localeCompare(b[0]||'');});
  var notes=[];
  var stn=STAT[name]; if(stn&&stn.note) notes.push(['어드민',stn.note]);
  var sn=E.map(function(e){return e.note;}).filter(Boolean)[0]; if(sn) notes.push(['오티리스트',sn]);
  if(cm&&cm.note) notes.push(['코칭('+coach+')',cm.note]);
  return '<div class="ov" data-close="1"><div class="card"><button class="cls" data-close="1">✕</button>'+
   '<h3>'+esc(name)+'</h3>'+
   '<div class="org" style="margin-top:4px"><b>'+esc(o.br||(cm&&cm.br)||'지점 미확인')+'</b> · 상담 '+esc(o.sang||(cm&&cm.sang)||'—')+
   ' · 사업 '+esc(o.saup||(cm&&cm.saup)||'—')+(coach?' · 코칭 '+esc(coach):'')+
   (o.join?' · 가입 '+md(o.join)+' (D+'+diff(o.join,CUR)+')':'')+
   (cm&&cm.exp?' · 관리만료 '+md(cm.exp):'')+(cm&&cm.ten>=0?' · 학습기간 '+cm.ten+'일':'')+((cm&&cm.ten>=0&&cm.ten<=30&&!cm.can)?' <span class="tag" style="background:#E7F0FF;color:#1C57C4">신규</span>':'')+'</div>'+
   (cm&&cm.log?'<div class="lead" style="margin:10px 0 0">최근 주차 입력(완료 표기 아님) &nbsp;'+
     (cm.log.tail||[]).map(function(x){return '<span class="mini2'+(x[0]==='done'?' 첫수업':'')+'">'+(x[0]==='done'?(x[1]?md(x[1]):'완료'):esc(x[1]))+'</span>';}).join(' ')+
     ''+'</div>':'')+
   '<div class="flow" style="margin:14px 0">'+steps+'</div>'+
   (notes.length?'<div style="border-top:1px solid var(--line);padding-top:10px"><div class="grp" style="margin-top:0">특이사항</div>'+
     notes.map(function(n){return '<div class="hi"><span class="d">'+esc(n[0])+'</span><div class="note">'+hi(n[1])+'</div></div>';}).join('')+'</div>':'')+
   '<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:10px"><div class="grp" style="margin-top:0">이력</div>'+
   his.map(function(h){return '<div class="hi"><span class="d">'+md(h[0])+'</span><div class="note">'+hi(h[1])+'</div></div>';}).join('')+'</div>'+
   '</div></div>';
}
function searchBox(){
  if(!Q||Q.length<1) return '';
  var out=[],seen={};
  Object.keys(CO).forEach(function(k){CO[k].live.concat(CO[k].exp).forEach(function(m){
    if(m.n.indexOf(Q)>=0&&!seen['m'+m.n]){seen['m'+m.n]=1;
      out.push({t:'회원',n:m.n,d:(m.g||'')+' · '+(m.br||'')+' · 코칭 '+k,act:'name'});}});});
  Object.keys(CO).forEach(function(k){if(k.indexOf(Q)>=0) out.push({t:'코칭 담당',n:k,d:CO[k].team+' · 관리중 '+CO[k].live.length,act:'coach'});});
  Object.keys(TC.tt||{}).forEach(function(k){if(k.indexOf(Q)>=0) out.push({t:'강사',n:k,d:((TC.prof||{})[k]||{}).subj||'',act:'teach'});});
  if(!out.length) return '<div class="qcard"><div class="empty" style="padding:8px">일치하는 이름이 없습니다.</div></div>';
  return '<div class="qcard">'+out.slice(0,12).map(function(o){
    return '<div class="qrow" data-'+o.act+'="'+esc(o.n)+'"><b>'+esc(o.n)+'</b><span>'+esc(o.t)+' · '+esc(o.d)+'</span></div>';
  }).join('')+(out.length>12?'<div class="empty" style="padding:6px">외 '+(out.length-12)+'건</div>':'')+'</div>';
}

function render(){
  var mon=monday(CUR);
  document.body.classList.remove('tab-all','tab-coach','tab-teach');
  document.body.classList.add('tab-'+TAB);
  var BL=(D.branchList||[]);
  document.getElementById('brsel').innerHTML=(TAB==='teach')?'':('<button class="chip'+(BR===''?' on':'')+'" data-br="">전체 지점</button>'+
    BL.map(function(b){return '<button class="chip'+(BR===b?' on':'')+'" data-br="'+esc(b)+'">'+esc(b)+'</button>';}).join(''));
  document.getElementById('brsel').style.display=(TAB==='teach')?'none':'';
  document.getElementById('qres').innerHTML=searchBox();
  document.getElementById('sub').textContent='시트 '+md(DATA)+' 수집분 기준';
  var T=[['all','전체 현황'],['coach','코칭 현황'],['teach','강사 현황']];
  document.getElementById('tabs').innerHTML=T.map(function(t){
    return '<button class="'+(TAB===t[0]?'on':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>';}).join('');
  var el=document.getElementById('app');
  if(TAB==='all'){
    var SEC=[['지금 할 일',[['journey','신규 회원 여정',journeyBox],['week','이번 주 · 다음 주',weekBox],['alert','확인 필요',alertBox]]],
             ['관리 현황',[['exp','관리기간 만료 예정',expBox],['can','취소',canBox],['guard','민원 방어',guardBox]]],
             ['분석',[['flow','월별 흐름',flowBox],['funnel','월별 진단',funnelBox],['fill','채워야 할 칸',fillBox],['dev','기기 · 설치 트러블',devBox],['data','데이터 상태',dataBox]]]];
    var anchor='<div class="anch sticky">'+SEC.map(function(g){
        return '<span class="anch-g">'+g[0]+'</span>'+g[1].map(function(z){return '<button data-anch="'+z[0]+'">'+esc(z[1])+'</button>';}).join('');}).join('<span class="anch-sep"></span>')+'</div>';
    el.innerHTML=anchor+SEC.map(function(g,gi){
        var inner=g[1].map(function(z){return z[2]();}).join('');
        // '분석' 묶음(마지막)은 모바일에서 기본 접힘 — 매일 안 보는 것
        if(g[0]==='분석') return '<details class="secfold"'+(window.innerWidth>768?' open':'')+'><summary class="sech secfold-h">'+g[0]+' <span class="secfold-hint">— 월별 추이·진단·데이터 상태 (탭하여 펼치기)</span></summary>'+inner+'</details>';
        return '<div class="sech">'+g[0]+'</div>'+inner;
      }).join('');
  }
  else if(TAB==='coach') el.innerHTML=(BR?branchStaffBox(BR):'')+coachTab();
  else el.innerHTML=teachTab();
  document.getElementById('ovl').innerHTML=CARD?card(CARD):'';
  document.body.style.overflow=CARD?'hidden':'';
  try{ if(window.self!==window.top){ var _cs=!!CARD; if(_cs!==window.__lastCard){ window.__lastCard=_cs; parent.postMessage({t:_cs?'cardOpen':'cardClose'},'*'); if(_cs){ setTimeout(function(){ try{ var c=document.querySelector('.card'); if(c) c.scrollIntoView({block:'center'}); }catch(e){} },30); } } } }catch(e){}
  try{ if(window.self!==window.top){ var h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight); parent.postMessage({t:'frameH',h:h},'*'); parent.postMessage({type:'resize-iframe',height:h+40},'*'); } }catch(e){}
}
document.addEventListener('click',function(e){
  var c=e.target.closest('[data-close]');
  if(c&&(e.target.classList.contains('ov')||e.target.closest('.cls'))){CARD=null;render();if(window.__cardScrollY!=null){window.scrollTo(0,window.__cardScrollY);}return;}
  var b=e.target.closest('button,[data-z],.qrow,[data-bsel2],[data-jnext],[data-jmore],[data-expmore],[data-canmore],[data-mwper],[data-name]');
  if(!b) return;
  if(b.dataset.tab){TAB=b.dataset.tab;OPENZ={};render();window.scrollTo(0,0);}
  else if(b.dataset.mv){CUR=add(CUR,7*(+b.dataset.mv));SEL=null;render();}
  else if(b.dataset.go){SEL=b.dataset.go;render();}
  else if(b.dataset.miss){MISS=b.dataset.miss;render();}
  else if(b.dataset.ew){window.__ew=b.dataset.ew;render();}
  else if(b.dataset.cew){window.__cew=b.dataset.cew;render();}
  else if(b.dataset.cf){window.__cf=b.dataset.cf;render();}
  else if(b.dataset.cst){window.__cst=b.dataset.cst;window.__ctag="";window.__ccat="";window.__canmore=false;render();}
  else if(b.dataset.ctag!==undefined){window.__ctag=b.dataset.ctag;render();}
  else if(b.dataset.ccat!==undefined){window.__ccat=b.dataset.ccat;render();}
  else if(b.dataset.gm){window.__gm=b.dataset.gm;render();}
  else if(b.dataset.fm){window.__fm=b.dataset.fm;render();}
  else if(b.dataset.cg){window.__cg=b.dataset.cg;render();}
  else if(b.dataset.gsort){window.__gsort=b.dataset.gsort;render();}
  else if(b.dataset.expview){window.__expview=b.dataset.expview;render();}
  else if(b.dataset.bsel){window.__bsel=b.dataset.bsel;render();}
  else if(b.dataset.cp){window.__cp=b.dataset.cp;render();}
  else if(b.dataset.al){window.__al=b.dataset.al;render();}
  else if(b.dataset.df){window.__df=b.dataset.df;render();}
  else if(b.dataset.bf){window.__bf=b.dataset.bf;window.__bsel2="";render();}
  else if(b.dataset.jv){window.__jv=b.dataset.jv;window.__jnext="";render();}
  else if(b.dataset.jnext!==undefined){window.__jnext=b.dataset.jnext;window.__jv="onb";window.__jmore=false;render();}
  else if(b.dataset.jmore!==undefined){window.__jmore=(b.dataset.jmore==='1');render();}
  else if(b.dataset.expmore!==undefined){window.__expmore=(b.dataset.expmore==='1');render();}
  else if(b.dataset.canmore!==undefined){window.__canmore=(b.dataset.canmore==='1');render();}
  else if(b.dataset.mwper){window.__mwper=b.dataset.mwper;render();}
  else if(b.dataset.bsel2){window.__bsel2=(window.__bsel2===b.dataset.bsel2?'':b.dataset.bsel2);render();}
  else if(b.dataset.g){window.__g=b.dataset.g;OPENZ={};render();window.scrollTo(0,0);}
  else if(b.dataset.anch!==undefined){var t=document.getElementById('z-'+b.dataset.anch);
    if(t) window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-64,behavior:'smooth'});}
  else if(b.dataset.coach){TAB='coach';window.__c=b.dataset.coach;CTAB='live';window.__cOpen=1;render();syncMDClass();window.scrollTo(0,0);}
  else if(b.dataset.mdback!==undefined){window.__cOpen=0;window.__tOpen=0;render();syncMDClass();}
  else if(b.dataset.teach){TAB='teach';window.__tOpen=1;setTimeout(syncMDClass,0);window.__t=b.dataset.teach;render();window.scrollTo(0,0);}
  else if(b.dataset.tsj){window.__tsj=b.dataset.tsj;window.__t=null;render();}
  else if(b.dataset.br!==undefined&&b.classList.contains('chip')){BR=b.dataset.br;render();}
  else if(b.dataset.ctab){CTAB=b.dataset.ctab;render();}
  else if(b.dataset.name){window.__cardScrollY=window.pageYOffset||document.documentElement.scrollTop||0;CARD=b.dataset.name;render();}
  else if(b.dataset.z){var k=b.dataset.z;OPENZ[k]=!(OPENZ[k]!==undefined?OPENZ[k]:b.querySelector('.ar').textContent==='▾');render();}
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){Q=e.target.value.trim();document.getElementById('qres').innerHTML=searchBox();}
});
/* ── 모바일 후처리: 월별 표 최신달로 스크롤 · 주간표 요일 선택 ── */
function moPost(){
  if(window.innerWidth>768) return;
  document.querySelectorAll('#z-flow .scrollx,#z-funnel .scrollx,#z-cmon .scrollx').forEach(function(x){x.scrollLeft=x.scrollWidth;});
  document.querySelectorAll('#app .chips').forEach(function(c){var on=c.querySelector('.chip.on'); if(on&&on.offsetLeft>c.clientWidth-40) c.scrollLeft=on.offsetLeft-12;});
  var tbs=document.querySelectorAll('#app table.tt'); if(!tbs.length) return;
  var wd=P(TODAY).getDay(), sel=window.__ttd||((wd>=1&&wd<=5)?wd:1);
  tbs.forEach(function(t){
    // 시간표는 요일 분할 안 하고 주간 전체 표시(가로 스크롤). 강사개인·코칭담당·과목별수업표 모두
    if(t.closest('#z-ttt')||t.closest('#z-ctt')||t.closest('#z-tsj')) return;
    var hr=t.rows[0]; if(!hr) return;
    for(var r=1;r<t.rows.length;r++){var cs=t.rows[r].cells;t.rows[r].classList.add('r');
      for(var i=1;i<cs.length;i++){ if(cs[i].querySelector('.slot')) t.rows[r].classList.add('h'+i); }}
    var bar='<div class="ttday">'+[1,2,3,4,5].map(function(i){var th=hr.cells[i]; if(!th) return '';
      var sm=th.querySelector('small');
      return '<button data-ttd="'+i+'" class="'+(i===sel?'on':'')+'">'+esc(th.childNodes[0].textContent)+(sm?'<small>'+esc(sm.textContent)+'</small>':'')+'</button>';}).join('')+'</div>';
    (t.closest('.scrollx')||t).insertAdjacentHTML('beforebegin',bar);
    t.classList.add('dsel','d'+sel);
  });
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-ttd]'); if(!b) return; e.stopPropagation();
  var i=+b.dataset.ttd; window.__ttd=i;
  document.querySelectorAll('#app table.tt.dsel').forEach(function(t){t.className=t.className.replace(/\bd[1-5]\b/,'d'+i);});
  document.querySelectorAll('.ttday button').forEach(function(x){x.classList.toggle('on',+x.dataset.ttd===i);});
},true);
var _render0=render; render=function(){_render0(); try{moPost();}catch(err){} try{syncMDClass();}catch(e){}};
function syncMDClass(){
  var b=document.body;
  b.classList.toggle('md-coach-open', !!window.__cOpen);
  b.classList.toggle('md-teach-open', !!window.__tOpen);
}

render();
})();
};
